# `dart analyze --fatal-infos` is the bar (see .github/workflows/ci.yml).
include: package:lints/recommended.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

linter:
  rules:
    - always_declare_return_types
    - prefer_final_locals
    - prefer_single_quotes
    # The package is the delivery contract's Dart implementation; every
    # public API carries documentation.
    - public_member_api_docs
    - unawaited_futures

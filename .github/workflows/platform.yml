name: Platform deploy artifacts

# Pull-request checks for the RFC 0002 platform's deployment artifacts:
# the three images (built, never pushed) and deploy/charts/glossa-platform
# (lint, render, schema validation). release.yml pushes the images.
#
# A workflow of its own rather than jobs in ci.yml: three image builds
# (~2 min each, the Studio one fetches the design system) are only worth
# running when something they are built from changes, and ci.yml has no
# path filters, only paths-ignore.

on:
  pull_request:
    paths:
      - "platform/**"
      - "messageformat/**"
      - "runtimes/go/**"
      - "studio/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "deploy/charts/glossa-platform/**"
      - ".github/workflows/platform.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  images:
    name: Build ${{ matrix.image }} image (no push)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: glossa-server
            dockerfile: platform/Dockerfile.server
          - image: glossa-edge
            dockerfile: platform/Dockerfile.edge
          - image: glossa-studio
            dockerfile: studio/Dockerfile
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          # Into the runner's Docker, for the smoke check below.
          load: true
          tags: ${{ matrix.image }}:pr
          build-args: |
            VERSION=pr-${{ github.event.pull_request.number || 'manual' }}
            REVISION=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max
          platforms: linux/amd64
      - name: Runs as non-root
        run: |
          user=$(docker image inspect "${{ matrix.image }}:pr" --format '{{.Config.User}}')
          echo "user=$user"
          case "$user" in ""|0|0:*|root|root:*) echo "::error::${{ matrix.image }} runs as root"; exit 1;; esac
      - name: Size
        run: docker image ls "${{ matrix.image }}:pr" --format '{{.Repository}}:{{.Tag}} {{.Size}}' >> "$GITHUB_STEP_SUMMARY"

  chart:
    name: Chart glossa-platform (lint, template, kubeconform)
    runs-on: ubuntu-latest
    env:
      CHART: deploy/charts/glossa-platform
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with:
          version: v3.16.0
      - name: Install kubeconform (pinned + sha256-verified binary)
        env:
          KUBECONFORM_VERSION: "0.7.0"
          KUBECONFORM_SHA256: "c31518ddd122663b3f3aa874cfe8178cb0988de944f29c74a0b9260920d115d3"
        run: |
          curl -sSL -o kubeconform.tar.gz \
            "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "${KUBECONFORM_SHA256}  kubeconform.tar.gz" | sha256sum -c -
          tar xzf kubeconform.tar.gz kubeconform && sudo mv kubeconform /usr/local/bin/
      - name: Required values fail the render
        run: |
          if helm template t "$CHART" > /dev/null 2>&1; then
            echo "::error::rendering without values should fail on the REQUIRED values"; exit 1
          fi
      - name: Lint, render and validate every values file
        run: |
          set -euo pipefail
          for values in "$CHART"/ci/*-values.yaml "$CHART"/examples/*.yaml; do
            echo "::group::$values"
            helm lint "$CHART" --strict -f "$values"
            helm template t "$CHART" --namespace glossa-platform -f "$values" \
              | kubeconform -strict -summary -kubernetes-version 1.31.0 \
                  -schema-location default \
                  -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
            echo "::endgroup::"
          done

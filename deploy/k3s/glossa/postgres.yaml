# Postgres StatefulSet — single replica, PVC-backed.
#
# Single replica is fine on single-node k3s; HA Postgres is a
# separate concern (CloudNativePG operator or a managed DB). The
# PVC binds to local-path on the node so data persists across pod
# restarts — that's the third acceptance bullet for task-deploy.
#
# Service is headless (clusterIP: None) so the StatefulSet pod can
# be reached as `postgres-0.postgres.glossa.svc.cluster.local` and
# DATABASE_URL can use the short `postgres` name from app config.
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: glossa
spec:
  clusterIP: None
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: glossa
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef:
                name: glossa-postgres
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "glossa", "-d", "glossa"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "glossa", "-d", "glossa"]
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        # Longhorn, three replicas. local-path is a directory on one node: it
        # pinned this pod to edge-1, which is also the only control-plane node,
        # so losing that machine lost the database and the cluster together.
        # At 13 MB the replication costs essentially nothing.
        storageClassName: longhorn
        # Was 20Gi "because the spec called for it" against 13 MB of actual
        # data. Longhorn schedules against the request on every replica, so
        # an honest number is worth real capacity here.
        resources:
          requests:
            storage: 5Gi

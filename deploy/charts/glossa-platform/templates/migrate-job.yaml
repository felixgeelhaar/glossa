{{- if .Values.server.migrations.enabled }}
{{- $name := include "gp.componentName" (dict "root" $ "component" "migrate") -}}
{{- $v := .Values.server -}}
{{- $m := .Values.server.migrations -}}
{{- if .Values.networkPolicy.enabled }}
# Created before the Job on every install and upgrade: hooks run before
# the release's own NetworkPolicies exist, and a namespace-wide default
# deny would otherwise block the first migration. Helm keeps hook
# resources after uninstall; delete this one by hand then.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $name }}
  labels:
    {{- include "gp.componentLabels" (dict "root" $ "component" "migrate") | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  podSelector:
    matchLabels:
      {{- include "gp.selectorLabels" (dict "root" $ "component" "migrate") | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress: []
  egress:
    {{- include "gp.np.dnsEgress" . | nindent 4 }}
    {{- include "gp.np.egressRule" .Values.networkPolicy.egress.postgres | nindent 4 }}
---
{{- end }}
# glossa-server -migrate=only as the schema owner (CREATEROLE, never a
# superuser), before any server pod of the new version starts. The owner
# DSN reaches only this Job, never the server pods.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $name }}
  labels:
    {{- include "gp.componentLabels" (dict "root" $ "component" "migrate") | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "0"
    # A failed Job stays for `kubectl logs`; the next upgrade replaces it.
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ $m.backoffLimit }}
  activeDeadlineSeconds: {{ $m.activeDeadlineSeconds }}
  template:
    metadata:
      labels:
        {{- include "gp.componentLabels" (dict "root" $ "component" "migrate") | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        {{- include "gp.podSecurityContext" 65532 | nindent 8 }}
      {{- with (include "gp.scheduling" (dict "root" $ "values" $v) | trim) }}{{ . | nindent 6 }}{{ end }}
      containers:
        - name: migrate
          image: {{ include "gp.image" (dict "root" $ "image" $v.image) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["-migrate=only"]
          securityContext:
            {{- include "gp.containerSecurityContext" . | nindent 12 }}
          # Only what migrating needs: config validation also asks for the
          # app DSN and the auth secret, but neither is used to connect.
          env:
            - name: GLOSSA_LOG_LEVEL
              value: {{ $v.logLevel | quote }}
            {{- include "gp.secretEnv" (dict "name" "MIGRATION_DATABASE_URL" "secret" (required "database.migration.secretName is required when server.migrations.enabled (Secret with the owner DSN)" .Values.database.migration.secretName) "key" .Values.database.migration.secretKey) | nindent 12 }}
            {{- include "gp.databaseAppEnv" . | nindent 12 }}
            {{- include "gp.authEnv" . | nindent 12 }}
          resources:
            {{- toYaml $m.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
{{- end }}

apiVersion: rollops.klarlabs.de/v1
kind: RolloutConfig
metadata: { name: gl-sts-postgres }
spec:
  target:
    kind: kubernetes
    ref: glossa/prod/sts-postgres
    criticality: medium
    spec:
      namespace: glossa
      resource: statefulset/postgres
      manifest: |
        apiVersion: apps/v1
        kind: StatefulSet
        metadata:
          annotations:
            meta.helm.sh/release-name: glossa
            meta.helm.sh/release-namespace: glossa
          labels:
            app.kubernetes.io/instance: glossa
            app.kubernetes.io/managed-by: Helm
            app.kubernetes.io/name: glossa
            app.kubernetes.io/version: 0.1.0
            helm.sh/chart: glossa-0.1.1
          name: postgres
          namespace: glossa
        spec:
          persistentVolumeClaimRetentionPolicy:
            whenDeleted: Retain
            whenScaled: Retain
          podManagementPolicy: OrderedReady
          replicas: 1
          revisionHistoryLimit: 10
          selector:
            matchLabels:
              app: postgres
          serviceName: postgres
          template:
            metadata:
              labels:
                app: postgres
            spec:
              containers:
              - env:
                - name: PGDATA
                  value: /var/lib/postgresql/data/pgdata
                envFrom:
                - secretRef:
                    name: glossa-app
                image: docker.io/postgres:16-alpine
                imagePullPolicy: IfNotPresent
                name: postgres
                ports:
                - containerPort: 5432
                  protocol: TCP
                readinessProbe:
                  exec:
                    command:
                    - pg_isready
                    - -U
                    - $(POSTGRES_USER)
                    - -d
                    - $(POSTGRES_DB)
                  failureThreshold: 3
                  initialDelaySeconds: 5
                  periodSeconds: 5
                  successThreshold: 1
                  timeoutSeconds: 1
                resources:
                  limits:
                    memory: 512Mi
                  requests:
                    cpu: 50m
                    memory: 128Mi
                terminationMessagePath: /dev/termination-log
                terminationMessagePolicy: File
                volumeMounts:
                - mountPath: /var/lib/postgresql/data
                  name: data
              dnsPolicy: ClusterFirst
              restartPolicy: Always
              schedulerName: default-scheduler
              securityContext:
                fsGroup: 70
                runAsGroup: 70
                runAsNonRoot: true
                runAsUser: 70
                seccompProfile:
                  type: RuntimeDefault
              terminationGracePeriodSeconds: 30
          updateStrategy:
            rollingUpdate:
              partition: 0
            type: RollingUpdate
          volumeClaimTemplates:
          - apiVersion: v1
            kind: PersistentVolumeClaim
            metadata:
              name: data
            spec:
              accessModes:
              - ReadWriteOnce
              resources:
                requests:
                  storage: 5Gi
              volumeMode: Filesystem
  strategy: { type: rolling }

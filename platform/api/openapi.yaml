  # ── messages ────────────────────────────────────────────────────────
  /v1/tenants/{tenant}/projects/{project}/messages:
    parameters:
      - $ref: "#/components/parameters/TenantPath"
      - $ref: "#/components/parameters/ProjectPath"
    get:
      operationId: listMessages
      tags: [messages]
      summary: Messages of a project, by key
      description: |
        Filters combine. `missing_in` and `outdated_in` (at most one) ask
        Localization which messages have no translation in a locale, or
        one made against an older source revision; they also need
        `translations.read`. They see a bulk upsert's messages
        (`message-upserts`, `glossa push`) as soon as it returns, and
        other message writes once their event has been processed
        (usually within a second). Needs `catalog.read`.
        Problem codes: `coverage_filter_conflict` (400).
      security:
        - session: []
        - bearer: []
      parameters:
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/PageToken"
        - name: namespace
          in: query
          required: false
          schema: { $ref: "#/components/schemas/Namespace" }
        - name: state
          in: query
          required: false
          schema: { $ref: "#/components/schemas/MessageState" }
        - name: key_prefix
          in: query
          required: false
          description: Keys starting with this, e.g. `checkout.`.
          schema: { type: string, maxLength: 200 }
        - name: missing_in
          in: query
          required: false
          description: Only messages without a translation in this locale.
          schema: { $ref: "#/components/schemas/Locale" }
        - name: outdated_in
          in: query
          required: false
          description: Only messages whose translation in this locale is outdated.
          schema: { $ref: "#/components/schemas/Locale" }
      responses:
        "200":
          description: A page of messages.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessageList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      operationId: createMessage
      tags: [messages]
      summary: Create a message
      description: |
        The source is parsed (ICU MF1 unless `syntax` or the project's
        default says MF2) into the canonical MF2 model; revision 1 starts
        the message's source log. Needs `catalog.write`. Problem codes:
        `key_taken` (409), `invalid_message` (400, the MessageFormat
        error code in `detail`), `invalid_message_key`,
        `invalid_namespace`, `invalid_details`, `invalid_syntax`,
        `message_too_long` (400).
      security:
        - session: []
          csrf: []
        - bearer: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateMessage" }
      responses:
        "201":
          description: The message.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
            Location: { $ref: "#/components/headers/Location" }
            Idempotent-Replayed: { $ref: "#/components/headers/IdempotentReplayed" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /v1/tenants/{tenant}/projects/{project}/namespaces:
    parameters:
      - $ref: "#/components/parameters/TenantPath"
      - $ref: "#/components/parameters/ProjectPath"
    get:
      operationId: listNamespaces
      tags: [messages]
      summary: A project's namespaces, by name, with their message counts
      description: |
        Every namespace that holds a message, in name order, with how
        many of its messages are `active` and `obsolete` — what an
        export or a filter offers to choose from. One grouped read of
        the project's messages per page. Needs `catalog.read`.
      security:
        - session: []
        - bearer: []
      parameters:
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/PageToken"
      responses:
        "200":
          description: A page of namespaces.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NamespaceList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/tenants/{tenant}/projects/{project}/message-upserts:
    parameters:
      - $ref: "#/components/parameters/TenantPath"
      - $ref: "#/components/parameters/ProjectPath"
    post:
      operationId: upsertMessages
      tags: [messages]
      summary: Create or revise messages in bulk (CLI push)
      description: |
        Up to 500 messages by key, in one transaction. Idempotent: a
        message whose source parses to the stored model is `unchanged`,
        so pushing the same catalog twice changes nothing. An obsolete
        message pushed again is reactivated. Items fail on their own
        (`results[].error.code`: `invalid_message_key`,
        `invalid_message`, `invalid_namespace`, `invalid_details`,
        `invalid_syntax`, `message_too_long`, `duplicate_key`,
        `source_revision_conflict` when `base_revision` is stale) without
        failing the batch. Localization's view of the changed messages is
        updated in the same transaction, so `missing_in`/`outdated_in`
        listings and fills see the push as soon as it returns. Needs
        `catalog.write`. Problem codes: `too_many_items` (400).
      security:
        - session: []
          csrf: []
        - bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MessageUpsert" }
      responses:
        "200":
          description: One result per item, in request order.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessageUpsertResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/tenants/{tenant}/projects/{project}/messages/{message}:
    parameters:
      - $ref: "#/components/parameters/TenantPath"
      - $ref: "#/components/parameters/ProjectPath"
      - $ref: "#/components/parameters/MessagePath"
    get:
      operationId: getMessage
      tags: [messages]
      summary: A message
      description: Needs `catalog.read`.
      security:
        - session: []
        - bearer: []
        - in_context: []
      responses:
        "200":
          description: The message.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      operationId: updateMessage
      tags: [messages]
      summary: Change a message's namespace, description or length limit
      description: |
        Not a source revision. `max_length: 0` removes the limit. Needs
        `catalog.write`.
      security:
        - session: []
          csrf: []
        - bearer: []
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateMessage" }
      responses:
        "200":
          description: The updated message.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "412": { $ref: "#/components/responses/PreconditionFailed" }
        "428": { $ref: "#/components/responses/PreconditionRequired" }

  /v1/tenants/{tenant}/projects/{project}/messages/{message}/source:
    parameters:
      - $ref: "#/components/parameters/TenantPath"
      - $ref: "#/components/parameters/ProjectPath"
      - $ref: "#/components/parameters/MessagePath"
    put:
      operationId: reviseMessageSource
      tags: [messages]
      summary: Revise a message's source text
      description: |
        Appends a source revision and publishes
        `catalog.message.source_revised`, which makes existing
        translations outdated. Text that parses to the current model is
        no revision (the message comes back unchanged). The key and ID
        never change. Needs `catalog.write`. Problem codes:
        `invalid_message` (400), `message_obsolete` (409).
      security:
        - session: []
          csrf: []
        - bearer: []
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReviseSource" }
      responses:
        "200":
          description: The message.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "412": { $ref: "#/components/responses/PreconditionFailed" }
        "428": { $ref: "#/components/responses/PreconditionRequired" }

  /v1/tenants/{tenant}/projects/{project}/messages/{message}/obsoletion:
    parameters:
      - $ref: "#/components/parameters/TenantPath"
      - $ref: "#/components/parameters/ProjectPath"
      - $ref: "#/components/parameters/MessagePath"
    post:
      operationId: obsoleteMessage
      tags: [messages]
      summary: Retire a message
      description: |
        The message keeps its history and translations but is no longer
        released. Pushing its key again reactivates it. Idempotent. Needs
        `catalog.write`. `If-Match` is optional; when sent it must match.
      security:
        - session: []
          csrf: []
        - bearer: []
      parameters:
        - $ref: "#/components/parameters/IfMatchOptional"
      responses:
        "200":
          description: The obsolete message.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "412": { $ref: "#/components/responses/PreconditionFailed" }

  /v1/tenants/{tenant}/projects/{project}/messages/{message}/renames:
    parameters:
      - $ref: "#/components/parameters/TenantPath"
      - $ref: "#/components/parameters/ProjectPath"
      - $ref: "#/components/parameters/MessagePath"
    post:
      operationId: renameMessage
      tags: [messages]
      summary: Give a message a new key
      description: |
        The explicit way to change a message's identity as runtimes see
        it: the ID, source log and translations stay with the message.
        `Location` points at the new key. Needs `catalog.write`. `If-Match`
        is optional; when sent it must match. Problem codes: `key_taken`
        (409), `invalid_message_key` (400).
      security:
        - session: []
          csrf: []
        - bearer: []
      parameters:
        - $ref: "#/components/parameters/IfMatchOptional"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RenameMessage" }
      responses:
        "200":
          description: The renamed message.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
            Location: { $ref: "#/components/headers/Location" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "412": { $ref: "#/components/responses/PreconditionFailed" }

  /v1/tenants/{tenant}/projects/{project}/messages/{message}/source-revisions:

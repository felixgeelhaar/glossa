          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      operationId: updateProject
      tags: [projects]
      summary: Rename a project or change its settings
      description: |
        Members omitted from the body keep their value; the source locale
        can't change. Needs `catalog.write`. Problem codes: `slug_taken`
        (409), `invalid_slug`, `invalid_name`, `invalid_syntax`,
        `invalid_branch` (400).
      security:
        - session: []
          csrf: []
        - bearer: []
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateProject" }
      responses:
        "200":
          description: The updated project.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "412": { $ref: "#/components/responses/PreconditionFailed" }
        "428": { $ref: "#/components/responses/PreconditionRequired" }
    delete:
      operationId: deleteProject
      tags: [projects]
      summary: Delete a project and everything in it
      description: |
        Deletes its applications, messages, source history, locales and
        translations. Needs `tenant.manage`. `If-Match` is optional; when
        sent it must match.
      security:
        - session: []
          csrf: []
        - bearer: []
      parameters:

          csrf: []
        - bearer: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/KnowledgeExportJobRequest" }
      responses:
        "201":
          description: The job, queued.
          headers:
            Location: { $ref: "#/components/headers/Location" }
            Idempotent-Replayed: { $ref: "#/components/headers/IdempotentReplayed" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExportJob" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
    get:
      operationId: listTermbaseExportJobs
      tags: [exports]
      summary: The workspace's TBX exports
      description: Tenant-wide TBX exports (without a project), newest first. Needs `integration.read`.
      security:
        - session: []
        - bearer: []
      parameters:
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/PageToken"
        - { name: state, in: query, required: false, schema: { $ref: "#/components/schemas/IntegrationJobState" } }
      responses:
        "200":
          description: A page of export jobs.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExportJobList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }

  # ── github ──────────────────────────────────────────────────────────
  /v1/integrations/github/webhooks:
    post:
      operationId: receiveGitHubWebhook
      tags: [github]
      summary: Receive a GitHub webhook delivery
      description: |
        GitHub's own endpoint, not a Studio one. It carries no session:
        GitHub signs each delivery, and the signature is what
        authenticates it.

        The body is read raw, capped at 5 MiB, and its
        `X-Hub-Signature-256` is checked with HMAC-SHA256 in constant
        time **before anything parses it**. A verified delivery is
        written to an inbox keyed by `X-GitHub-Delivery` and answered
        `202` at once, well inside GitHub's ten seconds; a worker
        processes it. A delivery id already seen inside the seven-day
        replay window is a no-op and also answers `202`, so GitHub's
        redeliveries are safe.

        Handled events: `installation`, `installation_repositories`,
        `pull_request` (`opened`, `synchronize`, `reopened`, `closed`)
        and `check_run` (`rerequested`). Anything else is acknowledged
        and dropped. Nothing in Glossa's correctness depends on a
        delivery arriving: a merge lands through the default branch's
        push, not through this endpoint.

        A delivery whose signature does not verify answers `401` with no
        detail. Problem codes: `invalid_webhook` (401),
        `webhook_too_large` (413), `github_not_configured` (503).
      security: []
      x-glossa-idempotency: "GitHub keys a delivery by X-GitHub-Delivery, and the inbox makes a repeat of one a no-op for seven days."
      parameters:
        - name: X-GitHub-Event
          in: header
          required: true
          description: The event name, e.g. `pull_request`.
          schema: { type: string, maxLength: 64 }
        - name: X-GitHub-Delivery
          in: header
          required: true
          description: GitHub's delivery id; the inbox key.
          schema: { type: string, maxLength: 128 }
        - name: X-Hub-Signature-256
          in: header
          required: true
          description: "`sha256=` and the HMAC-SHA256 of the raw body under the App's webhook secret."
          schema: { type: string, maxLength: 128 }
      requestBody:
        required: true
        description: |
          The raw delivery. GitHub sends `application/json`; Glossa reads
          the bytes exactly as they were signed and parses them only
          after the signature verifies, so the body is declared as an
          opaque stream.
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        "202":
          description: |
            The delivery was verified and stored, or was a duplicate the
            inbox already holds. Nothing has been processed yet.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebhookAck" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /v1/tenants/{tenant}/github/install-intents:
    parameters:
      - $ref: "#/components/parameters/TenantPath"
    post:
      operationId: startGitHubInstall
      tags: [github]
      summary: Start installing the Glossa GitHub App
      description: |
        Issues a single-use `state`, bound to this workspace, to the
        person asking and to a short expiry, and returns the GitHub URL
        to send them to. Only the state's hash is stored, so a reader of
        the database cannot replay one.

        Send the person to `install_url`; GitHub returns them with the
        `state`, an `installation_id`, a `code` and a `setup_action`,
        which go to `POST /v1/tenants/{tenant}/github/installations`.

        Needs `integration.manage`. Problem codes:
        `github_not_configured` (503).
      security:
        - session: []
          csrf: []
        - bearer: []
      x-glossa-idempotency: "Every call issues a fresh single-use state; repeating one is meant to make another."
      responses:
        "201":
          description: The state and where to send the person.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GitHubInstallIntent" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /v1/tenants/{tenant}/github/installations:
    parameters:
      - $ref: "#/components/parameters/TenantPath"
    post:
      operationId: completeGitHubInstall
      tags: [github]
      summary: Finish an installation, with the person's ownership verified
      description: |
        The callback of `install-intents`. The `state` is verified and
        burned — it is single-use, so a failed attempt starts over
        rather than retrying — and then the `code` is redeemed for the
        person's own GitHub token, which is used once to check that they
        can actually see the `installation_id` they claim, and dropped.
        That is what stops someone claiming an installation of an
        account they have nothing to do with.

        An installation maps to exactly one workspace. Re-running this
        for one this workspace already holds refreshes it; one another
        workspace holds is refused with `installation_already_claimed`,
        which never says which workspace that is.

        Needs `integration.manage`. Problem codes:
        `invalid_install_state` (400: unknown, expired, already used, or
        `setup_action=request`, which means no installation was made),
        `install_state_not_yours` (403),
        `installation_not_visible` (403: the person's token cannot see
        it), `installation_already_claimed` (409),
        `github_unavailable` (503), `github_not_configured` (503).
      security:
        - session: []
          csrf: []
        - bearer: []
      x-glossa-idempotency: "The single-use state is the key: redeeming it twice is refused."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GitHubInstallCallback" }
      responses:
        "201":
          description: The installation, now this workspace's.
          headers:
            Location: { $ref: "#/components/headers/Location" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GitHubInstallation" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/Unavailable" }
    get:
      operationId: listGitHubInstallations
      tags: [github]
      summary: The workspace's GitHub installations
      description: |
        Each installation with the repositories the App can see through
        it, read from GitHub. An installation GitHub cannot be reached
        for still lists, with `repositories_unavailable` set and no
        repositories, so one unreachable account does not empty the
        page. A `suspended` or `revoked` installation lists without
        repositories, because GitHub would refuse the call anyway.

        Needs `integration.read`. Problem codes:
        `github_not_configured` (503).
      security:
        - session: []
        - bearer: []
      parameters:
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/PageToken"
      responses:
        "200":
          description: A page of installations.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GitHubInstallationList" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /v1/tenants/{tenant}/github/installations/{installation}:
    parameters:
      - $ref: "#/components/parameters/TenantPath"
      - $ref: "#/components/parameters/InstallationPath"
    delete:
      operationId: forgetGitHubInstallation
      tags: [github]
      summary: Forget an installation and its Git connections
      description: |
        Removes the installation and its Git connections from Glossa. It
        does **not** uninstall the App: only GitHub can do that, on the
        account's or organization's Applications settings page. Until it
        is uninstalled there GitHub keeps sending webhooks, which Glossa
        then acknowledges and ignores.

        Needs `integration.manage`. Problem codes:
        `github_not_configured` (503).
      security:
        - session: []
          csrf: []
        - bearer: []
      responses:
        "204":
          description: The installation is gone from Glossa.
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /v1/tenants/{tenant}/github/connections:
    parameters:
      - $ref: "#/components/parameters/TenantPath"
    post:
      operationId: createGitConnection
      tags: [github]
      summary: Connect a repository to a project and application
      description: |
        Ties one of an installation's repositories — by its numeric
        `repository_id`, so a rename or a transfer does not break the
        connection — to a project and one of its applications, with the
        repository's default branch and an optional monorepo `path`.

        One repository can feed several projects, one per `path`; the
        same repository and path twice is `connection_exists`. The
        repository must be one the installation can actually see and the
        application one the project actually has, so a connection that
        could never work is refused here rather than failing quietly on
        the first pull request. `default_branch` may be left out, and
        GitHub's is used.

        Needs `integration.manage`. Problem codes: `invalid_connection`
        (400), `application_not_found` (404), `repository_not_visible`
        (404), `connection_exists` (409), `installation_revoked` (409),
        `github_unavailable` (503), `github_not_configured` (503).
      security:
        - session: []
          csrf: []
        - bearer: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GitConnectionRequest" }
      responses:
        "201":
          description: The connection.
          headers:
            Location: { $ref: "#/components/headers/Location" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GitConnection" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/Unavailable" }
    get:
      operationId: listGitConnections
      tags: [github]
      summary: The workspace's Git connections
      description: |
        Every repository-to-project connection, optionally narrowed to
        one installation or one project.

        Needs `integration.read`. Problem codes: `invalid_query` (400),
        `github_not_configured` (503).
      security:
        - session: []
        - bearer: []
      parameters:
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/PageToken"
        - { name: installation, in: query, required: false, description: Only this installation's connections., schema: { $ref: "#/components/schemas/Id" } }
        - { name: project, in: query, required: false, description: Only this project's connections., schema: { $ref: "#/components/schemas/Id" } }
      responses:
        "200":
          description: A page of connections.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GitConnectionList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /v1/tenants/{tenant}/github/connections/{connection}:
    parameters:
      - $ref: "#/components/parameters/TenantPath"
      - $ref: "#/components/parameters/ConnectionPath"
    get:
      operationId: getGitConnection
      tags: [github]
      summary: One Git connection
      description: |
        Needs `integration.read`. Problem codes:
        `github_not_configured` (503).
      security:
        - session: []
        - bearer: []
      responses:
        "200":
          description: The connection.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GitConnection" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Unavailable" }
    patch:
      operationId: updateGitConnection
      tags: [github]
      summary: Change a connection's project, application, branch or path
      description: |
        The repository is fixed: pointing a connection at another
        repository is a different connection, so create that one and
        delete this one.

        Needs `integration.manage`. Problem codes: `invalid_connection`
        (400), `application_not_found` (404), `connection_exists` (409:
        another connection already covers that path),
        `github_not_configured` (503).
      security:
        - session: []
          csrf: []
        - bearer: []
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GitConnectionChange" }
      responses:
        "200":
          description: The connection.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GitConnection" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "412": { $ref: "#/components/responses/PreconditionFailed" }
        "428": { $ref: "#/components/responses/PreconditionRequired" }
        "503": { $ref: "#/components/responses/Unavailable" }
    delete:
      operationId: deleteGitConnection
      tags: [github]
      summary: Remove a Git connection
      description: |
        The repository and the installation stay; only the link to this
        project goes.

        Needs `integration.manage`. Problem codes:
        `github_not_configured` (503).
      security:
        - session: []
          csrf: []
        - bearer: []
      responses:
        "204":
          description: The connection is gone.
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Unavailable" }

  # ── context ─────────────────────────────────────────────────────────
  /v1/tenants/{tenant}/projects/{project}/context-builds:
    parameters:
      - $ref: "#/components/parameters/TenantPath"
      - $ref: "#/components/parameters/ProjectPath"
    get:
      operationId: listContextBuilds
      tags: [context]
      summary: A project's usage uploads (builds), newest first
      description: |
        With how many usages each holds and how many of those name a key
        the catalog didn't know at upload (`unknown_keys`). Retention
        keeps the latest 3 builds per application, branch and source plus
        every current one, and deletes a closed branch's builds 7 days
        after it closed (RFC 0004 §2.3). Needs `catalog.read`. Problem
        codes: `unknown_application` (400).
      security:
        - session: []
        - bearer: []
      parameters:
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/PageToken"
        - name: application
          in: query
          required: false
          description: Only this application's builds (its slug).
          schema: { $ref: "#/components/schemas/Slug" }
      responses:
        "200":
          description: A page of builds.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContextBuildList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      operationId: createContextBuild
      tags: [context]
      summary: Upload a build's usages (glossa context push)
      description: |
        The body is one `glossa.usages/v1` document: where one
        application's messages are used at one commit, as
        `@glossa/unplugin` (`.glossa/usages.json`) and `glossa extract`
        write it (schema: `runtimes/testdata/schemas/usages.v1.schema.json`).
        It is validated by the schema's rules — members it doesn't define
        are ignored within v1, anything else it refuses is
        `invalid_usages` — and holds at most 100 000 usages and 20 MB.

        Keys are resolved to message IDs now, so renaming a message later
        keeps its usages; a key the catalog doesn't know is stored and
        counted in `unknown_keys`. Whether the build is of the default
        branch is the project's `settings.default_branch`, not the
        uploader's say. `digest` is the SHA-256 of the document's
        RFC 8785 canonical form (without undefined members), and an upload
        is idempotent by application, commit, `source` and digest: the
        same document again answers `200` with the first upload's build
        and `Idempotent-Replayed: true`.

        Uploads are rate-limited per tenant (10 a minute, bursts of 60).
        Needs `catalog.write` (developers, `write` tokens: CI). Problem
        codes: `invalid_usages`, `too_many_usages`, `invalid_source`,
        `unknown_application` (400), `payload_too_large` (413),
        `rate_limited` (429).
      x-glossa-idempotency: >-
        An upload is identified by its application, commit, source and digest; repeating one returns the
        first build (200, Idempotent-Replayed) instead of storing a second.
      security:
        - session: []
          csrf: []
        - bearer: []
      parameters:
        - name: source
          in: query
          required: true
          description: >-
            The collector that wrote the document: `plugin` (@glossa/unplugin), `extract` (`glossa extract`),
            `runtime` (capture and editor sessions) or `capture` (`glossa capture`).
          schema: { $ref: "#/components/schemas/ContextSource" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UsagesDocument" }
      responses:
        "200":
          description: The same document was uploaded before; its build.
          headers:
            Idempotent-Replayed: { $ref: "#/components/headers/IdempotentReplayed" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContextBuild" }
        "201":
          description: The build, stored.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContextBuild" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /v1/tenants/{tenant}/projects/{project}/messages/{message}/usages:
    parameters:
      - $ref: "#/components/parameters/TenantPath"
      - $ref: "#/components/parameters/ProjectPath"
      - $ref: "#/components/parameters/MessagePath"
    get:
      operationId: listMessageUsages
      tags: [context]
      summary: Where a message appears (its current usages)
      description: |
        The usages of the message the key names now, in the current
        builds: per application and source, the latest build of the
        default branch — or, with `branch`, that branch's latest build,
        falling back to the default branch's where the branch didn't
        rebuild. The default branch's usages come first, then by
        application, file and line; `truncated` says more than `limit`
        exist. Needs `catalog.read`. Problem codes: `invalid_branch` (400).
      security:
        - session: []
        - bearer: []
      parameters:
        - $ref: "#/components/parameters/ContextBranch"
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 1000, default: 100 }
      responses:
        "200":
          description: The message's current usages.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessageUsages" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/tenants/{tenant}/projects/{project}/usages:
    parameters:
      - $ref: "#/components/parameters/TenantPath"
      - $ref: "#/components/parameters/ProjectPath"
    get:
      operationId: listUsages
      tags: [context]
      summary: The current usages on a route, in a component or in a file
      description: |
        The messages a route, component or file shows (RFC 0004 §8): the
        usages in the current builds (see `listMessageUsages`; `branch`
        selects a branch view), by build and position. Filters combine;
        without one, every current usage. Needs `catalog.read`. Problem
        codes: `invalid_branch` (400).
      security:
        - session: []
        - bearer: []
      parameters:
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/PageToken"
        - $ref: "#/components/parameters/ContextBranch"
        - name: route
          in: query
          required: false
          description: A route pattern, exactly (`/checkout/[step]`).
          schema: { type: string, maxLength: 1024 }
        - name: component
          in: query
          required: false
          description: A component, exactly (`PaymentFooter`, `mail.(*Mailer).Send`).
          schema: { type: string, maxLength: 512 }
        - name: file
          in: query
          required: false
          description: A file path relative to the project root, exactly.
          schema: { type: string, maxLength: 1024 }
      responses:
        "200":
          description: A page of usages.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContextUsageList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/tenants/{tenant}/projects/{project}/unused-messages:
    parameters:
      - $ref: "#/components/parameters/TenantPath"
      - $ref: "#/components/parameters/ProjectPath"
    get:
      operationId: listUnusedMessages
      tags: [context]
      summary: Active messages no current build uses
      description: |
        By key. They are reported, never obsoleted: a dynamic key
        (`t(\`plan.${tier}\`)`) is invisible to every collector.
        `current_builds` is how many builds were considered — with none,
        nothing was uploaded yet and every message is listed — and
        `active_messages` and `unused_messages` give the project's context
        coverage. `branch` selects a branch view (see `listMessageUsages`).
        Needs `catalog.read`. Problem codes: `invalid_branch` (400).
      security:
        - session: []
        - bearer: []
      parameters:
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/PageToken"
        - $ref: "#/components/parameters/ContextBranch"
      responses:
        "200":
          description: A page of unused messages.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UnusedMessageList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/tenants/{tenant}/projects/{project}/captures:
    parameters:
      - $ref: "#/components/parameters/TenantPath"
      - $ref: "#/components/parameters/ProjectPath"
    post:
      operationId: createCaptures
      tags: [context]
      summary: Upload a build's captures (glossa capture --upload)
      description: |
        A `multipart/form-data` body: first a part named `manifest`
        (`application/json`), one `glossa.captures/v1` manifest as
        `glossa capture` writes it (schema:
        `runtimes/testdata/schemas/captures.v1.schema.json`), then one
        part per distinct image, named by the lowercase hex SHA-256 of
        its bytes as `captures[].image.sha256` references it, with
        `Content-Type: image/png`. Every referenced image has exactly one
        part and every part is referenced.

        The manifest is validated by the schema's rules like a usages
        document (members it doesn't define are ignored within v1) and
        the server's: at most 500 captures, one per route, viewport and
        locale; at most 10 000 regions each; viewports of at most
        10 000 CSS pixels a side; every region `index` names an entry of
        its `renders`. Region boxes are stored as the whole CSS pixels
        that cover them. Each image must be the PNG its part name and
        manifest entry say — at most 10 MB and 40 megapixels — and is
        re-encoded without metadata before it is stored; the same pixels
        are stored once per project (`images_deduplicated`). The whole
        body is at most 200 MB: split a larger capture plan over several
        uploads (one per application, or per locale).

        The upload records a build with `source` `capture`: whether it is
        of the default branch is the project's `settings.default_branch`.
        Region keys are resolved to message IDs now; the keys the catalog
        doesn't know are stored and listed in `unknown_keys`. An upload is
        idempotent by application, commit and the SHA-256 of the
        manifest's RFC 8785 canonical form (without undefined members):
        the same manifest again answers `200` with the first upload's
        build and `Idempotent-Replayed: true`, without reading its images.

        A tenant keeps at most 2 GB of capture images (the deployment
        may set another limit). An upload whose new pixels would pass it
        is refused with `storage_quota_exceeded` and stores nothing;
        pixels the project already holds are deduplicated and cost
        nothing, and retention (RFC 0004 §2.3) frees the quota again as
        builds age out.

        Uploads share the per-tenant limit of usage uploads (10 a minute,
        bursts of 60). Needs `catalog.write` (developers, `write` tokens:
        CI). Problem codes: `invalid_request` (not a multipart body),
        `invalid_captures` (a malformed body or manifest, or parts that
        don't match it), `too_many_captures`, `too_many_regions`,
        `invalid_image`, `unknown_application` (400),
        `payload_too_large`, `image_too_large`,
        `storage_quota_exceeded` (413), `rate_limited` (429),
        `storage_unavailable` (503).
      x-glossa-idempotency: >-
        An upload is identified by its application, commit, source (capture) and manifest digest; repeating one
        returns the first build (200, Idempotent-Replayed) instead of storing a second.
      security:
        - session: []
          csrf: []
        - bearer: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [manifest]
              properties:
                manifest: { $ref: "#/components/schemas/CapturesManifest" }
              additionalProperties:
                description: One PNG per distinct image, the part named by its lowercase hex SHA-256.
                type: string
                format: binary
            encoding:
              manifest: { contentType: application/json }
      responses:
        "200":
          description: The same manifest was uploaded before; its build.
          headers:
            Idempotent-Replayed: { $ref: "#/components/headers/IdempotentReplayed" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CaptureUpload" }
        "201":
          description: The build with its captures, stored.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CaptureUpload" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /v1/tenants/{tenant}/projects/{project}/captures/{capture}/image:
    parameters:
      - $ref: "#/components/parameters/TenantPath"
      - $ref: "#/components/parameters/ProjectPath"
      - $ref: "#/components/parameters/CapturePath"
    get:
      operationId: getCaptureImage
      tags: [context]
      summary: A capture's image
      description: |
        The re-encoded PNG, read through the API (the object store never
        hands out a URL). It is content-addressed and never changes:
        `ETag` is its SHA-256 and it may be cached privately for a year;
        `If-None-Match` with that `ETag` answers `304`. Needs
        `catalog.read`. Problem codes: `not_found` (404; also when
        retention deleted the image), `storage_unavailable` (503).
      security:
        - session: []
        - bearer: []
      parameters:
        - name: If-None-Match
          in: header
          required: false
          description: The `ETag` of a cached copy.
          schema: { type: string, maxLength: 256 }
      responses:
        "200":
          description: The image.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
            Cache-Control: { $ref: "#/components/headers/ImmutableCacheControl" }
          content:
            image/png:
              schema: { type: string, format: binary }
        "304":
          description: The cached copy is the image.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
            Cache-Control: { $ref: "#/components/headers/ImmutableCacheControl" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /v1/tenants/{tenant}/projects/{project}/messages/{message}/captures:
    parameters:
      - $ref: "#/components/parameters/TenantPath"
      - $ref: "#/components/parameters/ProjectPath"
      - $ref: "#/components/parameters/MessagePath"
    get:
      operationId: listMessageCaptures
      tags: [context]
      summary: Where a message appears on screen (its current captures)
      description: |
        The captures in the current builds (see `listMessageUsages`;
        `branch` selects a branch view with the default branch's
        fallback) that show the message the key names now, each with the
        message's regions on it (`visible` false: it rendered zero-size
        or off-screen) and the API path of its image. The default
        branch's captures come first, then by application, route, locale
        and the widest viewport; `truncated` says more than `limit`
        exist. Boxes are CSS pixels from the page's top left; the image
        is `image.width / viewport.width` times larger (the device scale
        factor). Needs `catalog.read`. Problem codes: `invalid_branch`
        (400).
      security:
        - session: []
        - bearer: []
      parameters:
        - $ref: "#/components/parameters/ContextBranch"
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 1000, default: 100 }
      responses:
        "200":
          description: The message's current captures.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessageCaptures" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ── branches ────────────────────────────────────────────────────────
  /v1/tenants/{tenant}/projects/{project}/branches:
    parameters:
      - $ref: "#/components/parameters/TenantPath"
      - $ref: "#/components/parameters/ProjectPath"
    get:
      operationId: listBranches
      tags: [branches]
      summary: Branches of a project, by name
      description: |
        `state` lists only `open`, `merged` or `closed` branches. `name`
        is the way to find a branch whose `id` you don't have (an
        unknown name is an empty page, not a 404). Needs `catalog.read`.
        Problem codes: `invalid_branch_state` (400).
      security:
        - session: []
        - bearer: []
      parameters:
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/PageToken"
        - name: state
          in: query
          required: false
          schema: { $ref: "#/components/schemas/BranchState" }
        - name: name
          in: query
          required: false
          description: Only the branch with this exact name.
          schema: { $ref: "#/components/schemas/BranchName" }
      responses:
        "200":
          description: A page of branches.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BranchList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      operationId: upsertBranch
      tags: [branches]
      summary: Open a branch, or record what CI knows about it
      description: |
        Addressed by `name`, because a branch that doesn't exist yet has
        no `id`: the first call creates it (`201`), later ones record its
        head commit, its pull request number and its preview URL
        (`200`). It proposes nothing — `pushBranchMessages` does that —
        and a closed branch reopens. Opening a branch opens its preview
        environment (`pr-<number>`, or `br-<hash>` without a pull
        request). Needs `catalog.write`. Problem codes: `invalid_branch`,
        `invalid_push`, `invalid_preview_url` (400), `branch_merged`
        (409).
      x-glossa-idempotency: The name is the branch's identity; the call is an upsert, so a retry is safe.
      security:
        - session: []
          csrf: []
        - bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpsertBranch" }
      responses:
        "200":
          description: The branch as it now stands.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Branch" }
        "201":
          description: The branch was created.
          headers:
            Location: { $ref: "#/components/headers/Location" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Branch" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/tenants/{tenant}/projects/{project}/branch-pushes:
    parameters:
      - $ref: "#/components/parameters/TenantPath"
      - $ref: "#/components/parameters/ProjectPath"
    post:
      operationId: pushBranchMessages
      tags: [branches]
      summary: Push a branch's messages (CI, glossa push --branch)
      description: |
        The branch's catalog, up to 10000 messages in one transaction —
        a whole catalog, not a batch, so `complete` can be trusted. The
        branch is created by its first push, and a closed one reopens.

        Nothing live changes: a key the project doesn't have becomes a
        `proposed` message the branch owns, changed source for a live
        key becomes a *source proposal*, and a key whose live source
        already says this is `unchanged`. Two open branches proposing
        the same new key with different source are a `key_conflict` for
        both. With `complete`, the keys the branch proposed before and
        no longer has are withdrawn, and the project's live keys the
        push lacks are reported in `removed` — reported only: a branch
        never obsoletes anything.

        The answer is the branch's status report, the same one
        `getBranch` returns, plus one result per item in request order.
        Items fail on their own (`items[].error.code`, as for
        `upsertMessages`) without failing the push. Needs
        `catalog.write`. Problem codes: `too_many_branch_items`,
        `invalid_branch`, `invalid_push` (400), `branch_merged` (409).
      security:
        - session: []
          csrf: []
        - bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BranchPush" }
      responses:
        "200":
          description: The branch's status report, with a result per item.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BranchPushResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/tenants/{tenant}/projects/{project}/branches/{branch}:
    parameters:
      - $ref: "#/components/parameters/TenantPath"
      - $ref: "#/components/parameters/ProjectPath"
      - $ref: "#/components/parameters/BranchPath"
    get:
      operationId: getBranch
      tags: [branches]
      summary: A branch's status report
      description: |
        What the branch proposes as its last push left it: its new keys,
        its source proposals, the live keys its last complete push
        lacked (`removed`), the key conflicts it shares with other open
        branches, and how many current translations per locale merging
        it will make outdated. This is what the PR check reports. Needs
        `catalog.read` (`outdated` also needs `translations.read`).
      security:
        - session: []
        - bearer: []
      responses:
        "200":
          description: The branch and its status report.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BranchStatus" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/tenants/{tenant}/projects/{project}/branches/{branch}/proposals:
    parameters:
      - $ref: "#/components/parameters/TenantPath"
      - $ref: "#/components/parameters/ProjectPath"
      - $ref: "#/components/parameters/BranchPath"
    get:
      operationId: listBranchProposals
      tags: [branches]
      summary: What a branch proposes, key by key
      description: |
        By key: the source the branch pushed for it, the message it
        names, and for a source change the revision it was proposed
        against. Needs `catalog.read`.
      security:
        - session: []
        - bearer: []
      parameters:
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/PageToken"
      responses:
        "200":
          description: A page of proposals.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProposalList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/tenants/{tenant}/projects/{project}/branches/{branch}/closure:
    parameters:
      - $ref: "#/components/parameters/TenantPath"
      - $ref: "#/components/parameters/ProjectPath"
      - $ref: "#/components/parameters/BranchPath"
    post:
      operationId: closeBranch
      tags: [branches]
      summary: Close a branch (its pull request was closed unmerged)
      description: |
        Its preview environment is destroyed, so the edge answers 404
        for it, and its proposed messages stay proposed for 14 days
        before they become obsolete — reopening the branch, or pushing
        their keys again, brings them back with their translations and
        history. Idempotent: closing a closed branch changes nothing.
        Needs `catalog.write`. Problem codes: `branch_merged` (409).
      security:
        - session: []
          csrf: []
        - bearer: []
      responses:
        "200":
          description: The closed branch.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Branch" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/tenants/{tenant}/projects/{project}/branches/{branch}/merge:
    parameters:
      - $ref: "#/components/parameters/TenantPath"
      - $ref: "#/components/parameters/ProjectPath"
      - $ref: "#/components/parameters/BranchPath"
    post:
      operationId: mergeBranch
      tags: [branches]
      summary: Mark a branch merged
      description: |
        Bookkeeping and cleanup, not activation: the **default branch's
        push** makes proposed messages active and proposals source
        revisions, so nothing depends on this call arriving. It destroys
        the branch's preview environment and starts the 14-day clock on
        whatever the default branch didn't bring in. A merged branch
        takes no more pushes. Idempotent. Needs `catalog.write`.
      security:
        - session: []
          csrf: []
        - bearer: []
      responses:
        "200":
          description: The merged branch.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Branch" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/tenants/{tenant}/projects/{project}/branches/{branch}/preview:
    parameters:
      - $ref: "#/components/parameters/TenantPath"
      - $ref: "#/components/parameters/ProjectPath"
      - $ref: "#/components/parameters/BranchPath"
    put:
      operationId: setBranchPreview
      tags: [branches]
      summary: Record where CI deployed the branch's preview
      description: |
        `glossa preview register --url`. The URL is shown in Studio and
        in the pull request comment; it is where the in-product editor
        runs. An empty `url` clears it. Needs `catalog.write`. Problem
        codes: `invalid_preview_url` (400).
      security:
        - session: []
          csrf: []
        - bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BranchPreview" }
      responses:
        "200":
          description: The branch, with its preview URL.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Branch" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: __Host-glossa_session
      description: |
        Session cookie set by the sign-in operations: HttpOnly, Secure,
        SameSite=Lax, Path=/. Revocable server-side.
    csrf:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: |
        Required with the session cookie on unsafe methods. Its value is
        the `csrf_token` of the session.
    bearer:
      type: http
      scheme: bearer
      bearerFormat: glossa_api_…
      description: |
        A tenant API token, `glossa_api_` followed by 43 base64url
        characters. Acts only in its own tenant, within its scopes.
    in_context:
      type: http
      scheme: bearer
      bearerFormat: glossa_ctx_…
      description: |
        An in-context grant, `glossa_ctx_` followed by 43 base64url
        characters: the in-product editor's credential (RFC 0004 §5.2).
        It acts as the person who minted it, lives 15 minutes, cannot be
        refreshed, and is bound to one project and one origin — a
        request whose `Origin` is not the bound one is `401`
        `origin_not_bound`, whatever the credential. The operations that
        accept it are exactly the ones the overlay calls, and exactly
        the ones CORS allows from a registered preview origin; it is
        refused everywhere else. It is sent without cookies
        (`credentials: "omit"`) and so needs no CSRF token.

  parameters:
    TenantPath:
      name: tenant
      in: path
      required: true
      description: A tenant `id`.
      schema: { $ref: "#/components/schemas/Id" }
    MemberPath:
      name: member
      in: path
      required: true
      description: A member `id`.
      schema: { $ref: "#/components/schemas/Id" }
    TokenPath:
      name: token
      in: path
      required: true
      description: An API token `id` (never its secret).
      schema: { $ref: "#/components/schemas/Id" }
    ProjectPath:
      name: project
      in: path
      required: true
      description: A project `id`.
      schema: { $ref: "#/components/schemas/Id" }
    ApplicationPath:
      name: application
      in: path
      required: true
      description: An application `id`.
      schema: { $ref: "#/components/schemas/Id" }
    InstallationPath:
      name: installation
      in: path
      required: true
      description: A GitHub installation `id` as Glossa issued it, not GitHub's number.
      schema: { $ref: "#/components/schemas/Id" }
    ConnectionPath:
      name: connection
      in: path
      required: true
      description: A Git connection `id`.
      schema: { $ref: "#/components/schemas/Id" }
    MessagePath:
      name: message
      in: path
      required: true
      description: A message `key` (`checkout.pay`). Keys are URL-safe as they are.
      schema: { $ref: "#/components/schemas/MessageKey" }
    LocalePath:
      name: locale
      in: path
      required: true
      description: A locale code; canonicalized before use.
      schema: { $ref: "#/components/schemas/Locale" }
    BranchPath:
      name: branch
      in: path
      required: true
      description: |
        A branch `id`. Branch names may hold `/`, and an encoded slash
        doesn't survive every proxy, so URLs never carry the name; find
        the `id` with `listBranches?name=…`.
      schema: { $ref: "#/components/schemas/Id" }
    EnvironmentPath:
      name: environment
      in: path
      required: true
      description: An environment `name`.
      schema: { $ref: "#/components/schemas/EnvironmentName" }
    ReleasePath:
      name: release
      in: path
      required: true
      description: A release `id`.
      schema: { $ref: "#/components/schemas/Id" }
    PasskeyPath:
      name: passkey
      in: path
      required: true
      description: A passkey `id` (its credential ID, base64url).
      schema: { type: string, minLength: 1, maxLength: 1400, pattern: "^[A-Za-z0-9_-]+$" }
    DeliveryKeyPath:
      name: delivery_key
      in: path
      required: true
      description: A delivery key `id` (not the key itself).
      schema: { $ref: "#/components/schemas/Id" }
    PreviewOriginPath:
      name: preview_origin
      in: path
      required: true
      description: A registered preview origin's `id`.
      schema: { $ref: "#/components/schemas/Id" }
    TMUnitPath:
      name: unit
      in: path
      required: true
      description: A translation-memory unit `id`.
      schema: { $ref: "#/components/schemas/Id" }
    ConceptPath:
      name: concept
      in: path
      required: true
      description: A termbase concept `id`.
      schema: { $ref: "#/components/schemas/Id" }
    StyleGuidePath:
      name: style_guide
      in: path
      required: true
      description: A style guide `id`.
      schema: { $ref: "#/components/schemas/Id" }
    AIProviderPath:
      name: ai_provider
      in: path
      required: true
      description: An AI provider `id`.
      schema: { $ref: "#/components/schemas/Id" }
    AIFillPath:
      name: ai_fill
      in: path
      required: true
      description: A fill `id`.
      schema: { $ref: "#/components/schemas/Id" }
    AIJobPath:
      name: ai_job
      in: path
      required: true
      description: A job `id`.
      schema: { $ref: "#/components/schemas/Id" }
    AISuggestionPath:
      name: ai_suggestion
      in: path
      required: true
      description: A suggestion `id`.
      schema: { $ref: "#/components/schemas/Id" }
    ImportJobPath:
      name: import_job
      in: path
      required: true
      description: An import job `id`.
      schema: { $ref: "#/components/schemas/Id" }
    ExportJobPath:
      name: export_job
      in: path
      required: true
      description: An export job `id`.
      schema: { $ref: "#/components/schemas/Id" }
    CapturePath:
      name: capture
      in: path
      required: true
      description: A capture `id`.
      schema: { $ref: "#/components/schemas/Id" }
    ContextBranch:
      name: branch
      in: query
      required: false
      description: >-
        A branch view: that branch's latest builds, and the default branch's where it didn't rebuild.
        Absent: the default branch's.
      schema: { type: string, minLength: 1, maxLength: 255 }
    PageSize:
      name: page_size
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
    PageToken:
      name: page_token
      in: query
      required: false
      description: The `next_page_token` of the previous page.
      schema: { type: string, maxLength: 512 }
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: The `ETag` the change is based on.
      schema: { type: string, maxLength: 64 }
    IfMatchOptional:
      name: If-Match
      in: header
      required: false
      description: When sent, the `ETag` the change is based on.
      schema: { type: string, maxLength: 64 }
    IfMatchSingleton:
      name: If-Match
      in: header
      required: false
      description: >-
        When sent, the `ETag` the change is based on: `"0"` (the ETag of unsaved defaults) writes only while
        nobody has saved the settings yet, and fails with 412 once someone has.
      schema: { type: string, maxLength: 64 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema: { type: string, minLength: 1, maxLength: 255, pattern: "^[\\x21-\\x7E]+$" }
    CeremonyCookie:
      name: __Host-glossa_webauthn
      in: cookie
      required: false
      description: WebAuthn ceremony state set by the matching challenge operation.
      schema: { type: string, maxLength: 8192 }

  headers:
    ETag:
      description: Opaque version of the resource, for `If-Match`.
      schema: { type: string }
    Location:
      description: URL of the created resource.
      schema: { type: string }
    ImmutableCacheControl:
      description: "`private, max-age=31536000, immutable`: content-addressed, never changes."
      schema: { type: string }
    IdempotentReplayed:
      description: "`true` when this response replays an earlier request with the same `Idempotency-Key`."
      schema: { type: string, enum: ["true"] }
    SessionCookie:
      description: "`__Host-glossa_session=…; Path=/; HttpOnly; Secure; SameSite=Lax`"
      schema: { type: string }
    ClearedSessionCookie:
      description: Expires the session cookie.
      schema: { type: string }
    CeremonyCookie:
      description: "`__Host-glossa_webauthn=…; Path=/; HttpOnly; Secure; SameSite=Strict; Max-Age=300`"
      schema: { type: string }

  responses:
    SessionStarted:
      description: Signed in. The session cookie is set.
      headers:
        Set-Cookie: { $ref: "#/components/headers/SessionCookie" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Session" }
    BadRequest:
      description: The request is malformed or invalid.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Unauthenticated:
      description: No valid credentials.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Forbidden:
      description: Authenticated, but not allowed (or missing the CSRF token).
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    NotFound:
      description: No such resource in this tenant.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Conflict:
      description: The request conflicts with the resource's state.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    PreconditionFailed:
      description: "`If-Match` doesn't match the current `ETag`."
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    PreconditionRequired:
      description: "`If-Match` is required."
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    UnprocessableEntity:
      description: The `Idempotency-Key` was used for a different request.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    TooManyRequests:
      description: Slow down.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Unavailable:
      description: A dependency (object storage) is unavailable; retry.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    PayloadTooLarge:
      description: The request body exceeds the limit.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Gone:
      description: The resource existed and was deleted (retention).
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    StructuralQAFailed:
      description: |
        `structural_qa_failed`: the translation is structurally
        incompatible with its source (`findings`, errors first).
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/QAProblem" }

  schemas:
    Id:
      type: string
      description: An opaque identifier.
      minLength: 1
      maxLength: 64
    Timestamp:
      type: string
      format: date-time
      description: RFC 3339, UTC.
    Email:
      type: string
      format: email
      maxLength: 254
    Locale:
      type: string
      description: |
        A BCP 47 language tag. Stored and returned canonicalized
        (`en_us` → `en-US`, `iw` → `he`).
      minLength: 2
      maxLength: 64
      examples: [de, pt-BR, zh-Hant-TW]
    Role:
      type: string
      enum: [owner, admin, developer, translator, reviewer]
      description: |
        `owner` everything; `admin` everything except owner changes;
        `developer` catalog, translations, releases, tokens;
        `translator` translates; `reviewer` translates and reviews.
        Translators and reviewers can be limited to `locales`.
    Scope:
      type: string
      enum: [read, write, publish, admin]
      description: |
        `read` reads the tenant; `write` pushes messages and
        translations; `publish` creates releases; `admin` manages the
        tenant, members and tokens (never owners). Every scope implies
        `read`.
    Problem:
      type: object
      description: RFC 9457 problem details.
      required: [type, title, status, code]
      properties:
        type: { type: string, format: uri, examples: ["urn:glossa:problem:slug_taken"] }
        title: { type: string }
        status: { type: integer }
        code: { type: string, pattern: "^[a-z][a-z0-9_]*$", description: Stable machine-readable code. }
        detail: { type: string }
        instance: { type: string }
        errors:
          type: array
          items: { $ref: "#/components/schemas/FieldError" }
    FieldError:
      type: object
      required: [pointer, detail]
      properties:
        pointer: { type: string, description: JSON Pointer into the request body. }
        detail: { type: string }

    Meta:
      type: object
      required: [sign_in_methods, email_delivery]
      properties:
        sign_in_methods:
          type: array
          uniqueItems: true
          description: |
            How people can sign in here, strongest first: `passkey` when
            a WebAuthn relying party is configured, `password` always,
            `magic_link` when the server sends email.
          items: { type: string, enum: [passkey, password, magic_link] }
        email_delivery:
          type: boolean
          description: |
            Whether the server sends email. Without it magic links,
            email verification and password reset by email are
            unavailable (`email_disabled`), a password account works
            without a verified address, and invitations wait: only a
            verified address accepts one.
        edge_url:
          type: string
          format: uri
          description: |
            glossa-edge's public base URL, what runtimes are configured
            with (`{edge_url}/v1/{key}/{environment}/manifest.json`).
            Absent when the deployment doesn't announce it
            (`GLOSSA_EDGE_PUBLIC_URL`).
    EmailRequest:
      type: object
      required: [email]
      properties:
        email: { $ref: "#/components/schemas/Email" }
    TokenRedemption:
      type: object
      required: [token]
      properties:
        token: { type: string, minLength: 1, maxLength: 256, description: The token from the emailed link. }
    Registration:
      type: object
      required: [email, password]
      properties:
        email: { $ref: "#/components/schemas/Email" }
        password: { type: string, minLength: 12, maxLength: 1024 }
        display_name: { type: string, maxLength: 200 }
    PasswordSignIn:
      type: object
      required: [email, password]
      properties:
        email: { $ref: "#/components/schemas/Email" }
        password: { type: string, minLength: 1, maxLength: 1024 }
        totp_code: { type: string, pattern: "^[0-9]{6}$" }
    PasswordReset:
      type: object
      required: [token, password]
      properties:
        token: { type: string, minLength: 1, maxLength: 256 }
        password: { type: string, minLength: 12, maxLength: 1024 }
    WebAuthnResponse:
      type: object
      description: The `PublicKeyCredential` from the browser, serialized as JSON.
      additionalProperties: true
    PasskeyRegistration:
      type: object
      required: [credential]
      properties:
        name: { type: string, maxLength: 100, description: A label such as "MacBook Touch ID". }
        credential: { $ref: "#/components/schemas/WebAuthnResponse" }
    PasskeyOptions:
      type: object
      required: [options]
      properties:
        options:
          type: object
          description: WebAuthn options to pass to `navigator.credentials`.
          additionalProperties: true
    Passkey:
      type: object
      required: [id, name, created_at]
      properties:
        id: { type: string, description: "The credential ID, base64url." }
        name: { type: string }
        created_at: { $ref: "#/components/schemas/Timestamp" }
        last_used_at:
          $ref: "#/components/schemas/Timestamp"
          description: The last sign-in with it; absent until it signs in.
    PasskeyList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Passkey" }
        next_page_token: { type: string }
    TotpEnrollment:
      type: object
      required: [secret, otpauth_uri]
      properties:
        secret: { type: string, description: "Base32 secret, for manual entry." }
        otpauth_uri: { type: string, description: "`otpauth://` URI, for a QR code." }
    TotpCode:
      type: object
      required: [code]
      properties:
        code: { type: string, pattern: "^[0-9]{6}$" }

    Person:
      type: object
      required: [id, email, email_verified, totp_enabled, individual_tenant_id, created_at]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        email: { $ref: "#/components/schemas/Email" }
        display_name: { type: string }
        email_verified: { type: boolean }
        totp_enabled: { type: boolean }
        individual_tenant_id: { $ref: "#/components/schemas/Id" }
        created_at: { $ref: "#/components/schemas/Timestamp" }
    Session:
      type: object
      required: [person, csrf_token, expires_at]
      properties:
        person: { $ref: "#/components/schemas/Person" }
        csrf_token: { type: string, description: Send as `X-CSRF-Token` on unsafe requests. }
        expires_at: { $ref: "#/components/schemas/Timestamp" }
    Me:
      type: object
      required: [person, memberships, csrf_token]
      properties:
        person: { $ref: "#/components/schemas/Person" }
        csrf_token: { type: string }
        memberships:
          type: array
          items: { $ref: "#/components/schemas/Membership" }
    Membership:
      type: object
      required: [member_id, tenant, roles, locales]
      properties:
        member_id: { $ref: "#/components/schemas/Id" }
        tenant: { $ref: "#/components/schemas/Tenant" }
        roles:
          type: array
          items: { $ref: "#/components/schemas/Role" }
        locales:
          type: array
          items: { $ref: "#/components/schemas/Locale" }

    Tenant:
      type: object
      required: [id, kind, slug, name, created_at]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        kind: { type: string, enum: [individual, organization] }
        slug: { type: string, pattern: "^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$" }
        name: { type: string, minLength: 1, maxLength: 200 }
        created_at: { $ref: "#/components/schemas/Timestamp" }
    TenantList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Tenant" }
        next_page_token: { type: string }
    CreateTenant:
      type: object
      required: [slug, name]
      properties:
        slug: { type: string, pattern: "^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$" }
        name: { type: string, minLength: 1, maxLength: 200 }

    Member:
      type: object
      required: [id, email, status, roles, locales, created_at, updated_at]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        email: { $ref: "#/components/schemas/Email" }
        person_id:
          $ref: "#/components/schemas/Id"
          description: Set once the invitation is accepted.
        display_name: { type: string }
        status: { type: string, enum: [invited, active] }
        roles:
          type: array
          items: { $ref: "#/components/schemas/Role" }
        locales:
          type: array
          description: Locales a translator or reviewer works on; empty means all.
          items: { $ref: "#/components/schemas/Locale" }
        created_at: { $ref: "#/components/schemas/Timestamp" }
        updated_at: { $ref: "#/components/schemas/Timestamp" }
    MemberList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Member" }
        next_page_token: { type: string }
    AddMember:
      type: object
      required: [email, roles]
      properties:
        email: { $ref: "#/components/schemas/Email" }
        roles:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/Role" }
        locales:
          type: array
          maxItems: 200
          items: { $ref: "#/components/schemas/Locale" }
    UpdateMember:
      type: object
      properties:
        roles:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/Role" }
        locales:
          type: array
          maxItems: 200
          items: { $ref: "#/components/schemas/Locale" }

    Token:
      type: object
      required: [id, name, hint, scopes, created_by, created_at]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        name: { type: string }
        hint: { type: string, description: "The first characters of the secret, e.g. `glossa_api_Ab3x`." }
        scopes:
          type: array
          items: { $ref: "#/components/schemas/Scope" }
        created_by: { type: string, description: "`person:<id>` or `token:<id>`." }
        created_at: { $ref: "#/components/schemas/Timestamp" }
        expires_at: { $ref: "#/components/schemas/Timestamp" }
        last_used_at: { $ref: "#/components/schemas/Timestamp" }
        revoked_at: { $ref: "#/components/schemas/Timestamp" }
    TokenList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Token" }
        next_page_token: { type: string }
    CreateToken:
      type: object
      required: [name, scopes]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        scopes:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/Scope" }
        expires_at: { $ref: "#/components/schemas/Timestamp" }
    CreatedToken:
      type: object
      required: [token]
      properties:
        token: { $ref: "#/components/schemas/Token" }
        secret:
          type: string
          description: "The token value (`glossa_api_…`). Shown only in the first response."

    # ── catalog ────────────────────────────────────────────────────────
    Slug:
      type: string
      pattern: "^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$"
    Syntax:
      type: string
      enum: [mf1, mf2]
      description: "Authoring syntax: ICU MessageFormat 1 or Unicode MessageFormat 2."
    ProjectSettings:
      type: object
      required: [default_syntax, review_required]
      properties:
        default_syntax: { $ref: "#/components/schemas/Syntax" }
        review_required:
          type: boolean
          description: |
            New translations wait for review (`needs_review`) unless a
            reviewer approves them as they write. When false, new text is
            `approved` on write.
        default_branch:
          type: string
          minLength: 1
          maxLength: 255
          description: |
            The repository's default branch (`main` unless set): usage
            uploads of it are what every view of the current usages falls
            back to (RFC 0004 §2.2). A valid Git branch name
            (`invalid_branch`). Always present in responses; absent in a
            write, the project keeps its current one.
    Project:
      type: object
      required: [id, slug, name, source_locale, settings, created_at, updated_at]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        slug: { $ref: "#/components/schemas/Slug" }
        name: { type: string }
        source_locale: { $ref: "#/components/schemas/Locale" }
        settings: { $ref: "#/components/schemas/ProjectSettings" }
        created_at: { $ref: "#/components/schemas/Timestamp" }
        updated_at: { $ref: "#/components/schemas/Timestamp" }
    ProjectList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Project" }
        next_page_token: { type: string }
    CreateProject:
      type: object
      required: [slug, name, source_locale]
      properties:
        slug: { $ref: "#/components/schemas/Slug" }
        name: { type: string, minLength: 1, maxLength: 200 }
        source_locale: { $ref: "#/components/schemas/Locale" }
        settings: { $ref: "#/components/schemas/ProjectSettings" }
    UpdateProject:
      type: object
      properties:
        slug: { $ref: "#/components/schemas/Slug" }
        name: { type: string, minLength: 1, maxLength: 200 }
        settings: { $ref: "#/components/schemas/ProjectSettings" }

    Platform:
      type: string
      enum: [web, api, ios, android, other]
    Application:
      type: object
      required: [id, slug, name, platform, created_at, updated_at]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        slug: { $ref: "#/components/schemas/Slug" }
        name: { type: string }
        platform: { $ref: "#/components/schemas/Platform" }
        created_at: { $ref: "#/components/schemas/Timestamp" }
        updated_at: { $ref: "#/components/schemas/Timestamp" }
    ApplicationList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Application" }
        next_page_token: { type: string }
    CreateApplication:
      type: object
      required: [slug, name, platform]
      properties:
        slug: { $ref: "#/components/schemas/Slug" }
        name: { type: string, minLength: 1, maxLength: 200 }
        platform: { $ref: "#/components/schemas/Platform" }
    UpdateApplication:
      type: object
      properties:
        slug: { $ref: "#/components/schemas/Slug" }
        name: { type: string, minLength: 1, maxLength: 200 }
        platform: { $ref: "#/components/schemas/Platform" }

    MessageKey:
      type: string
      description: A dotted path of `[a-z0-9_-]` segments, unique in the project.
      pattern: "^[a-z0-9_-]+(\\.[a-z0-9_-]+)*$"
      minLength: 1
      maxLength: 200
      examples: [checkout.payment.submit]
    Namespace:
      type: string
      description: Groups messages into separately loadable bundles. Default `default`.
      pattern: "^[a-z0-9][a-z0-9_-]{0,63}$"
    MessageState:
      type: string
      description: |
        `proposed`: new on an open branch; excluded from non-branch
        releases (RFC 0004 §4.1).
      enum: [active, proposed, obsolete]
    MF2Message:
      type: object
      additionalProperties: true
      description: |
        A message in the Unicode MessageFormat 2 data model, exactly as
        messageformat/testdata/unicode/data-model/message.schema.json
        defines it — the canonical form releases ship.
    Argument:
      type: object
      required: [name, type]
      properties:
        name: { type: string }
        type:
          type: string
          enum: [string, number, integer, percent, currency, date, time, datetime, unit, select]
        function: { type: string, description: "The annotating function, if any." }
        selector:
          type: object
          required: [kind, keys]
          properties:
            kind: { type: string, enum: [plural, ordinal, exact, string] }
            keys:
              type: array
              description: Literal variant keys; the catch-all `*` always exists.
              items: { type: string }
    MarkupElement:
      type: object
      required: [name, kind]
      properties:
        name: { type: string }
        kind: { type: string, enum: [open, standalone, close] }
    MessageContent:
      type: object
      required: [text, syntax, model, arguments, markup]
      properties:
        text: { type: string, description: What the author wrote. }
        syntax: { $ref: "#/components/schemas/Syntax" }
        model: { $ref: "#/components/schemas/MF2Message" }
        arguments:
          type: array
          description: Derived from the model on every change.
          items: { $ref: "#/components/schemas/Argument" }
        markup:
          type: array
          items: { $ref: "#/components/schemas/MarkupElement" }
    Message:
      type: object
      required: [id, key, namespace, description, state, source, source_revision, created_at, updated_at]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        key: { $ref: "#/components/schemas/MessageKey" }
        namespace: { $ref: "#/components/schemas/Namespace" }
        description: { type: string }
        max_length: { type: integer, minimum: 1, description: Rendered length limit that translation QA checks. }
        state: { $ref: "#/components/schemas/MessageState" }
        source: { $ref: "#/components/schemas/MessageContent" }
        source_revision: { type: integer, minimum: 1, description: The current source revision. }
        created_at: { $ref: "#/components/schemas/Timestamp" }
        updated_at: { $ref: "#/components/schemas/Timestamp" }
    MessageList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Message" }
        next_page_token: { type: string }
    NamespaceSummary:
      type: object
      required: [name, active_messages, obsolete_messages]
      properties:
        name: { $ref: "#/components/schemas/Namespace" }
        active_messages: { type: integer, description: "Messages in the namespace that are `active`." }
        obsolete_messages: { type: integer, description: "Messages in the namespace that are `obsolete`." }
    NamespaceList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/NamespaceSummary" }
        next_page_token: { type: string }
    CreateMessage:
      type: object
      required: [key, text]
      properties:
        key: { $ref: "#/components/schemas/MessageKey" }
        text: { type: string, maxLength: 20000 }
        syntax: { $ref: "#/components/schemas/Syntax" }
        namespace: { $ref: "#/components/schemas/Namespace" }
        description: { type: string, maxLength: 2000 }
        max_length: { type: integer, minimum: 1, maximum: 100000 }
    UpdateMessage:
      type: object
      properties:
        namespace: { $ref: "#/components/schemas/Namespace" }
        description: { type: string, maxLength: 2000 }
        max_length: { type: integer, minimum: 0, maximum: 100000, description: "`0` removes the limit." }
    ReviseSource:
      type: object
      required: [text]
      properties:
        text: { type: string, maxLength: 20000 }
        syntax: { $ref: "#/components/schemas/Syntax" }
    RenameMessage:
      type: object
      required: [key]
      properties:
        key: { $ref: "#/components/schemas/MessageKey" }
    SourceRevision:
      type: object
      required: [revision, text, syntax, model, author, created_at]
      properties:
        revision: { type: integer, minimum: 1 }
        text: { type: string }
        syntax: { $ref: "#/components/schemas/Syntax" }
        model: { $ref: "#/components/schemas/MF2Message" }
        author: { type: string, description: "`person:<id>` or `token:<id>`." }
        created_at: { $ref: "#/components/schemas/Timestamp" }
    SourceRevisionList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/SourceRevision" }
        next_page_token: { type: string }
    MessagePreviewRequest:
      type: object
      required: [source, locale]
      properties:
        source: { type: string, maxLength: 20000, description: The message as authored. }
        syntax: { $ref: "#/components/schemas/Syntax" }
        locale:
          $ref: "#/components/schemas/Locale"
          description: Decides which plural keys MF1 accepts, and formatting.
        values:
          type: object
          maxProperties: 100
          description: |
            Argument values to format with, by name (without `$`): strings,
            numbers or booleans. Omit to only parse.
          additionalProperties: true
        bidi_isolation:
          type: boolean
          description: Isolate placeholders with Unicode bidi marks (the MF2 default, `true`).
    MessagePreviewError:
      type: object
      required: [stage, code, message]
      properties:
        stage: { type: string, enum: [parse, format] }
        code:
          type: string
          description: "The MessageFormat kernel's stable error code: `mf1-syntax-error`, `syntax-error`, `unresolved-variable`, …"
        message: { type: string, description: For humans; wording may change. }
    MessagePreview:
      type: object
      required: [valid, arguments, markup, errors]
      properties:
        valid: { type: boolean, description: Whether the source parsed into a valid message. }
        message: { $ref: "#/components/schemas/MF2Message" }
        mf2: { type: string, description: The canonical model in MF2 syntax. }
        arguments:
          type: array
          items: { $ref: "#/components/schemas/Argument" }
        markup:
          type: array
          items: { $ref: "#/components/schemas/MarkupElement" }
        formatted: { type: string, description: "The message formatted with `values`, when they were sent and it is valid." }
        errors:
          type: array
          items: { $ref: "#/components/schemas/MessagePreviewError" }
    ItemError:
      type: object
      required: [code, detail]
      properties:
        code: { type: string, pattern: "^[a-z][a-z0-9_]*$", description: Stable machine code. }
        detail: { type: string }
        findings:
          type: array
          items: { $ref: "#/components/schemas/QAFinding" }
    MessageUpsertItem:
      type: object
      required: [key, text]
      properties:
        key: { type: string, maxLength: 256 }
        text: { type: string, maxLength: 20000 }
        syntax: { $ref: "#/components/schemas/Syntax" }
        namespace: { type: string, maxLength: 64, description: "Omitted: keep (new messages: `default`)." }
        description: { type: string, maxLength: 2000, description: "Omitted: keep." }
        max_length: { type: integer, minimum: 1, maximum: 100000, description: "Omitted: keep." }
        base_revision:
          type: integer
          minimum: 0
          description: |
            The source revision the client last saw (0: the message must
            not exist yet). A stale one fails the item with
            `source_revision_conflict` instead of overwriting.
    MessageUpsert:
      type: object
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 500
          items: { $ref: "#/components/schemas/MessageUpsertItem" }
    MessageUpsertItemResult:
      type: object
      required: [key, status]
      properties:
        key: { type: string }
        status: { type: string, enum: [created, revised, updated, unchanged, failed] }
        message: { $ref: "#/components/schemas/Message" }
        error: { $ref: "#/components/schemas/ItemError" }
    MessageUpsertResult:
      type: object
      required: [results]
      properties:
        results:
          type: array
          items: { $ref: "#/components/schemas/MessageUpsertItemResult" }

    # ── catalog: branches ──────────────────────────────────────────────
    BranchName:
      type: string
      minLength: 1
      maxLength: 255
      description: |
        A Git branch name, unique per project (`feature/checkout-copy`).
        It may hold `/`, so URLs address a branch by its `id`, never by
        its name; `listBranches?name=…` finds the `id`.
    BranchState:
      type: string
      enum: [open, merged, closed]
      description: |
        `open` while the branch is being worked on: it has a preview
        environment, and its proposals live. `merged` and `closed` end
        it — the environment is destroyed, and what the default branch
        never brought in becomes obsolete 14 days later.
    Branch:
      type: object
      required: [id, name, state, created_at, updated_at]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        name: { $ref: "#/components/schemas/BranchName" }
        state: { $ref: "#/components/schemas/BranchState" }
        pr_number: { type: integer, minimum: 1, description: "The pull request the branch has, when it has one." }
        head_commit: { type: string, pattern: "^[0-9a-f]{7,64}$", description: The commit last pushed. }
        preview_url: { type: string, maxLength: 2000, description: "Where CI deployed the branch's preview." }
        closed_at:
          $ref: "#/components/schemas/Timestamp"
          description: When the branch was closed or merged; absent while it is open.
        created_at: { $ref: "#/components/schemas/Timestamp" }
        updated_at: { $ref: "#/components/schemas/Timestamp" }
    BranchList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Branch" }
        next_page_token: { type: string }
    UpsertBranch:
      type: object
      required: [name]
      properties:
        name: { $ref: "#/components/schemas/BranchName" }
        pr_number: { type: integer, minimum: 1, description: "Omitted: keep." }
        head_commit: { type: string, pattern: "^[0-9a-f]{7,64}$", description: "Omitted: keep." }
        preview_url: { type: string, maxLength: 2000, description: 'Omitted: keep; "" clears it.' }
    BranchPreview:
      type: object
      required: [url]
      properties:
        url: { type: string, maxLength: 2000, description: 'An absolute http(s) URL; "" clears it.' }
    BranchPush:
      type: object
      required: [branch, items]
      properties:
        branch: { $ref: "#/components/schemas/BranchName" }
        pr_number: { type: integer, minimum: 1, description: "Omitted: keep." }
        head_commit: { type: string, pattern: "^[0-9a-f]{7,64}$", description: "Omitted: keep." }
        complete:
          type: boolean
          default: false
          description: |
            The items are the branch's whole catalog: keys it proposed
            before and no longer has are withdrawn, and the project's
            live keys it lacks are reported in `removed`. A partial push
            only adds.
        items:
          type: array
          minItems: 1
          maxItems: 10000
          description: "`base_revision` is ignored: a branch never overwrites anyone's edit."
          items: { $ref: "#/components/schemas/MessageUpsertItem" }
    BranchItemResult:
      type: object
      required: [key, status]
      properties:
        key: { type: string }
        status:
          type: string
          enum: [new_key, source_proposal, unchanged, key_conflict, failed]
          description: |
            `new_key`: the branch proposes the key's message.
            `source_proposal`: it proposes new source for a live
            message. `unchanged`: the live source already says this.
            `key_conflict`: another open branch proposes the same new
            key with different source.
        message: { $ref: "#/components/schemas/Message" }
        error: { $ref: "#/components/schemas/ItemError" }
    KeyConflict:
      type: object
      required: [key, branches]
      properties:
        key: { $ref: "#/components/schemas/MessageKey" }
        branches:
          type: array
          description: The other open branches proposing this key with different source.
          items: { $ref: "#/components/schemas/BranchName" }
    BranchStatus:
      type: object
      required: [branch, new_keys, source_proposals, removed, conflicts, outdated]
      description: What a branch proposes, and what merging it would do.
      properties:
        branch: { $ref: "#/components/schemas/Branch" }
        new_keys:
          type: array
          description: Keys the project doesn't have; their messages are `proposed`.
          items: { $ref: "#/components/schemas/MessageKey" }
        source_proposals:
          type: array
          description: Live keys whose source the branch changes.
          items: { $ref: "#/components/schemas/MessageKey" }
        removed:
          type: array
          description: Live keys the last complete push lacked. Reported only; nothing is obsoleted.
          items: { $ref: "#/components/schemas/MessageKey" }
        conflicts:
          type: array
          items: { $ref: "#/components/schemas/KeyConflict" }
        outdated:
          type: object
          description: |
            Per locale, how many current translations the branch's
            source proposals will make outdated when it merges. Empty
            without `translations.read`.
          additionalProperties: { type: integer }
    BranchPushResult:
      allOf:
        - $ref: "#/components/schemas/BranchStatus"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              description: One result per pushed item, in request order.
              items: { $ref: "#/components/schemas/BranchItemResult" }
    Proposal:
      type: object
      required: [key, kind, message_id, source, created_at, updated_at]
      description: What one branch proposes for one key.
      properties:
        key: { $ref: "#/components/schemas/MessageKey" }
        kind:
          type: string
          enum: [new_key, source_change]
          description: |
            `new_key`: the branch owns the key's `proposed` message
            (shared with every other branch proposing the same source
            for it). `source_change`: the message is live and the branch
            proposes new source for it, against `base_revision`.
        message_id: { $ref: "#/components/schemas/Id" }
        source: { $ref: "#/components/schemas/MessageContent" }
        base_revision: { type: integer, minimum: 1, description: "For a source change, the revision it was proposed against." }
        author: { type: string, description: "`person:<id>`, `token:<id>` or `system:<name>`." }
        created_at: { $ref: "#/components/schemas/Timestamp" }
        updated_at: { $ref: "#/components/schemas/Timestamp" }
    ProposalList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Proposal" }
        next_page_token: { type: string }

    # ── localization ───────────────────────────────────────────────────
    Direction:
      type: string
      enum: [ltr, rtl]
      description: Derived from the locale's (likely) script.
    ProjectLocale:
      type: object
      required: [code, direction, is_source, created_at]
      properties:
        code: { $ref: "#/components/schemas/Locale" }
        direction: { $ref: "#/components/schemas/Direction" }
        is_source: { type: boolean }
        created_at: { $ref: "#/components/schemas/Timestamp" }
    LocaleList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/ProjectLocale" }
        next_page_token: { type: string }
    AddLocale:
      type: object
      required: [code]
      properties:
        code: { $ref: "#/components/schemas/Locale" }
    FallbackGraph:
      type: object
      required: [fallback]
      properties:
        fallback:
          type: object
          description: 'A locale (or `*`) to its ordered fallback locales: `{"de-AT": ["de"], "*": ["en"]}`.'
          additionalProperties:
            type: array
            items: { $ref: "#/components/schemas/Locale" }
    PutFallbackGraph:
      type: object
      required: [fallback]
      properties:
        fallback:
          type: object
          maxProperties: 500
          additionalProperties:
            type: array
            maxItems: 50
            items: { $ref: "#/components/schemas/Locale" }
    ReviewState:
      type: string
      enum: [draft, needs_review, approved, rejected]
    Origin:
      type: string
      enum: [human, ai, translation_memory, machine_translation, import, adaptation]
    QAFinding:
      type: object
      required: [code, severity, message]
      properties:
        code: { type: string, description: "Stable finding code, e.g. `missing-argument`, `max-length-exceeded`." }
        severity: { type: string, enum: [error, warning] }
        subject: { type: string, description: The argument or markup element concerned. }
        detail: { type: string }
        message: { type: string, description: For humans; wording may change. }
    QAProblem:
      allOf:
        - $ref: "#/components/schemas/Problem"
        - type: object
          properties:
            findings:
              type: array
              items: { $ref: "#/components/schemas/QAFinding" }
    Translation:
      type: object
      required: [id, message_id, locale, text, syntax, model, state, origin, author, source_revision,
                 current_source_revision, outdated, warnings, revision, created_at, updated_at]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        message_id: { $ref: "#/components/schemas/Id" }
        locale: { $ref: "#/components/schemas/Locale" }
        text: { type: string }
        syntax: { $ref: "#/components/schemas/Syntax" }
        model: { $ref: "#/components/schemas/MF2Message" }
        state: { $ref: "#/components/schemas/ReviewState" }
        origin: { $ref: "#/components/schemas/Origin" }
        author: { type: string, description: Who wrote the current text. }
        source_revision: { type: integer, description: The source revision the text was made against. }
        current_source_revision: { type: integer, description: "The message's current source revision as Localization knows it." }
        outdated: { type: boolean, description: "`source_revision < current_source_revision`." }
        warnings:
          type: array
          items: { $ref: "#/components/schemas/QAFinding" }
        revision: { type: integer, minimum: 1 }
        created_at: { $ref: "#/components/schemas/Timestamp" }
        updated_at: { $ref: "#/components/schemas/Timestamp" }
    TranslationList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Translation" }
        next_page_token: { type: string }
    ProjectTranslation:
      description: A translation with the message it belongs to.
      allOf:
        - $ref: "#/components/schemas/Translation"
        - type: object
          required: [key, namespace, message_state]
          properties:
            key: { $ref: "#/components/schemas/MessageKey" }
            namespace: { $ref: "#/components/schemas/Namespace" }
            message_state: { $ref: "#/components/schemas/MessageState" }
    ProjectTranslationList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/ProjectTranslation" }
        next_page_token: { type: string }
    ReviewStateCounts:
      type: object
      required: [draft, needs_review, approved, rejected]
      properties:
        draft: { type: integer, minimum: 0 }
        needs_review: { type: integer, minimum: 0 }
        approved: { type: integer, minimum: 0 }
        rejected: { type: integer, minimum: 0 }
    LocaleStats:
      type: object
      required: [code, direction, is_source, translated, missing, outdated, states]
      properties:
        code: { $ref: "#/components/schemas/Locale" }
        direction: { $ref: "#/components/schemas/Direction" }
        is_source: { type: boolean }
        translated: { type: integer, minimum: 0, description: Active messages with a usable (not rejected) translation. }
        missing: { type: integer, minimum: 0, description: "Active messages without one: untranslated or rejected." }
        outdated: { type: integer, minimum: 0, description: Usable translations made against an older source revision. }
        states:
          $ref: "#/components/schemas/ReviewStateCounts"
          description: Translations of active messages per review state.
    TranslationStats:
      type: object
      required: [messages, locales]
      properties:
        messages: { type: integer, minimum: 0, description: The project's active messages. }
        locales:
          type: array
          items: { $ref: "#/components/schemas/LocaleStats" }
    PutTranslation:
      type: object
      required: [text]
      properties:
        text: { type: string, maxLength: 20000 }
        syntax: { $ref: "#/components/schemas/Syntax" }
        state: { $ref: "#/components/schemas/ReviewState" }
        origin: { $ref: "#/components/schemas/Origin" }
        origin_detail:
          type: object
          additionalProperties: true
          description: Provenance specifics — model, prompt version, TM match, source job…
        source_revision: { type: integer, minimum: 1 }
    ReviewTranslation:
      type: object
      required: [state]
      properties:
        state: { $ref: "#/components/schemas/ReviewState" }
    TranslationRevision:
      type: object
      required: [revision, kind, text, syntax, state, origin, origin_detail, author, source_revision, findings, created_at]
      properties:
        revision: { type: integer, minimum: 1 }
        kind: { type: string, enum: [content, review] }
        text: { type: string }
        syntax: { $ref: "#/components/schemas/Syntax" }
        state: { $ref: "#/components/schemas/ReviewState" }
        origin: { $ref: "#/components/schemas/Origin" }
        origin_detail: { type: object, additionalProperties: true }
        author: { type: string }
        source_revision: { type: integer }
        findings:
          type: array
          items: { $ref: "#/components/schemas/QAFinding" }
        created_at: { $ref: "#/components/schemas/Timestamp" }
    TranslationRevisionList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/TranslationRevision" }
        next_page_token: { type: string }
    TranslationImportItem:
      type: object
      required: [key, locale, text]
      properties:
        key: { type: string, maxLength: 256 }
        locale: { type: string, maxLength: 64 }
        text: { type: string, maxLength: 20000 }
        syntax: { $ref: "#/components/schemas/Syntax" }
        state: { $ref: "#/components/schemas/ReviewState" }
        origin_detail: { type: object, additionalProperties: true }
        source_revision: { type: integer, minimum: 1 }
    TranslationImport:
      type: object
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 500
          items: { $ref: "#/components/schemas/TranslationImportItem" }
    TranslationImportItemResult:
      type: object
      required: [key, locale]
      properties:
        key: { type: string }
        locale: { type: string }
        status: { type: string, enum: [created, revised, reviewed, unchanged] }
        translation: { $ref: "#/components/schemas/Translation" }
        error: { $ref: "#/components/schemas/ItemError" }
    TranslationImportResult:
      type: object
      required: [results]
      properties:
        results:
          type: array
          items: { $ref: "#/components/schemas/TranslationImportItemResult" }

    EnvironmentPolicy:
      type: object
      required: [states, include_outdated]
      description: |
        Which translations ship to an environment: those in `states`
        (never `rejected`), and outdated ones (made against an older
        source revision) only with `include_outdated`. Production and
        staging start with `approved`, the others with everything.
      properties:
        states:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: string, enum: [draft, needs_review, approved] }
        include_outdated: { type: boolean }
    Environment:
      type: object
      required: [name, kind, policy, created_at, updated_at]
      properties:
        name: { $ref: "#/components/schemas/EnvironmentName" }
        kind: { $ref: "#/components/schemas/EnvironmentKind" }
        branch:
          $ref: "#/components/schemas/BranchName"
          description: The branch a `branch` environment previews; absent for a standard one.
        policy: { $ref: "#/components/schemas/EnvironmentPolicy" }
        current_release_id: { $ref: "#/components/schemas/Id" }
        created_at: { $ref: "#/components/schemas/Timestamp" }
        updated_at: { $ref: "#/components/schemas/Timestamp" }
    EnvironmentKind:
      type: string
      enum: [standard, branch]
      description: |
        `standard` serves the main catalog (the default environments and
        custom ones). `branch` is one open branch's preview: the main
        catalog plus that branch's overlay, under a fixed policy
        (everything not rejected, outdated included), published again
        when the branch changes. Its releases can't be promoted
        (`branch_release_not_promotable`), because they hold text that
        exists only on the branch, and a project has at most 50 of them
        (`too_many_branches`). Opening, publishing and destroying one
        follows its branch; nothing creates one by hand.
    EnvironmentName:
      type: string
      pattern: "^[a-z0-9][a-z0-9-]{0,62}$"
      description: |
        `development`, `preview`, `staging`, `production` or a custom
        name (not `a`). `pr-<number>` and `br-<8 hex>` are reserved for
        branch environments.
    EnvironmentList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Environment" }
        next_page_token: { type: string }
    CreateEnvironment:
      type: object
      required: [name]
      properties:
        name: { $ref: "#/components/schemas/EnvironmentName" }
        policy: { $ref: "#/components/schemas/EnvironmentPolicy" }
    UpdateEnvironment:
      type: object
      required: [policy]
      properties:
        policy: { $ref: "#/components/schemas/EnvironmentPolicy" }
    Promotion:
      type: object
      required: [release_id]
      properties:
        release_id: { $ref: "#/components/schemas/Id" }
    Rollback:
      type: object
      properties:
        release_id: { $ref: "#/components/schemas/Id" }
    Deployment:
      type: object
      required: [number, release_id, action, author, created_at]
      properties:
        number: { type: integer, minimum: 1, description: Counts the environment's deployments from 1. }
        release_id: { $ref: "#/components/schemas/Id" }
        previous_release_id: { $ref: "#/components/schemas/Id" }
        action: { type: string, enum: [publish, promote, rollback] }
        author: { type: string, description: "`person:<id>` or `token:<id>`." }
        created_at: { $ref: "#/components/schemas/Timestamp" }
    DeploymentList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Deployment" }
        next_page_token: { type: string }
    PublishRelease:
      type: object
      required: [environment]
      properties:
        environment: { $ref: "#/components/schemas/EnvironmentName" }
        note: { type: string, maxLength: 1000 }
    ReleaseLocale:
      type: object
      required: [code, direction]
      properties:
        code: { $ref: "#/components/schemas/Locale" }
        direction: { $ref: "#/components/schemas/Direction" }
    ReleaseLocaleCounts:
      type: object
      required: [messages, outdated]
      properties:
        messages: { type: integer, minimum: 0 }
        outdated: { type: integer, minimum: 0, description: Outdated translations shipped (the policy allowed them). }
    ReleaseCounts:
      type: object
      required: [messages, artifacts, bytes, new_artifacts, locales]
      properties:
        messages: { type: integer, minimum: 0, description: Source messages. }
        artifacts: { type: integer, minimum: 0 }
        bytes: { type: integer, minimum: 0 }
        new_artifacts:
          type: integer
          minimum: 0
          description: Artifacts this publish uploaded; the rest were already stored.
        locales:
          type: object
          description: Per locale code.
          additionalProperties: { $ref: "#/components/schemas/ReleaseLocaleCounts" }
    Release:
      type: object
      required: [id, version, environment, policy, manifest_digest, source_locale, locales, counts, author, created_at]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        version: { type: integer, minimum: 1, description: Counts the project's releases from 1. }
        parent_id:
          $ref: "#/components/schemas/Id"
          description: What its environment served before it.
        environment: { $ref: "#/components/schemas/EnvironmentName" }
        policy: { $ref: "#/components/schemas/EnvironmentPolicy" }
        manifest_digest:
          type: string
          pattern: "^[0-9a-f]{64}$"
          description: |
            SHA-256 of the RFC 8785 canonical JSON of what every
            environment's manifest of this release carries (`sourceLocale`,
            `locales`, `fallback`, `artifacts`). Equal digests ship
            exactly the same text.
        source_locale: { $ref: "#/components/schemas/Locale" }
        locales:
          type: array
          items: { $ref: "#/components/schemas/ReleaseLocale" }
        counts: { $ref: "#/components/schemas/ReleaseCounts" }
        note: { type: string }
        author: { type: string, description: "`person:<id>` or `token:<id>`." }
        created_at: { $ref: "#/components/schemas/Timestamp" }
    ReleaseList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Release" }
        next_page_token: { type: string }
    LocaleDiff:
      type: object
      required: [locale, added, changed, removed]
      properties:
        locale: { $ref: "#/components/schemas/Locale" }
        added: { type: array, items: { type: string } }
        changed: { type: array, items: { type: string } }
        removed: { type: array, items: { type: string } }
    ReleaseDiff:
      type: object
      required: [release_id, locales]
      properties:
        release_id: { $ref: "#/components/schemas/Id" }
        base_release_id: { $ref: "#/components/schemas/Id" }
        locales:
          type: array
          items: { $ref: "#/components/schemas/LocaleDiff" }
    ReleaseProblem:
      type: object
      required: [code, detail]
      description: One reason the catalog can't be released.
      properties:
        code: { type: string, enum: [not_releasable] }
        detail: { type: string }
        key: { type: string, description: "The message key, when one message is the cause." }
        locale: { type: string, description: "The locale, when one locale or translation is the cause." }
    ReleasePreview:
      type: object
      required: [environment, policy, releasable, problems]
      properties:
        environment: { $ref: "#/components/schemas/EnvironmentName" }
        policy:
          $ref: "#/components/schemas/EnvironmentPolicy"
          description: The environment's policy, which the build used.
        base_release_id:
          $ref: "#/components/schemas/Id"
          description: The release the environment serves now, which `changes` compare with; absent when it serves none (everything is added).
        releasable: { type: boolean, description: "`false` when `problems` lists why publishing would fail." }
        problems:
          type: array
          items: { $ref: "#/components/schemas/ReleaseProblem" }
        manifest_digest:
          type: string
          pattern: "^[0-9a-f]{64}$"
          description: The release's manifest digest; equal to the served release's when nothing would change. Present when releasable.
        source_locale: { $ref: "#/components/schemas/Locale" }
        locales:
          type: array
          items: { $ref: "#/components/schemas/ReleaseLocale" }
        counts:
          $ref: "#/components/schemas/ReleaseCounts"
          description: What the release would ship; `new_artifacts` is what publishing would upload. Present when releasable.
        changes:
          type: array
          description: Per locale, compared with `base_release_id`. Present when releasable.
          items: { $ref: "#/components/schemas/LocaleDiff" }
    ReleaseManifest:
      type: object
      additionalProperties: true
      description: A `glossa.manifest/v1` manifest (runtimes/testdata/schemas/manifest.schema.json), as served.
    ReleaseArtifact:
      type: object
      additionalProperties: true
      description: A `glossa.artifact/v1` artifact (runtimes/testdata/schemas/artifact.schema.json), as stored.
    SigningKey:
      type: object
      required: [key_id, algorithm, public_key, active]
      properties:
        key_id: { type: string, description: "The manifest's `signatures[].keyId`." }
        algorithm: { type: string, enum: [Ed25519] }
        public_key: { type: string, description: "The raw 32-byte public key, base64url without padding." }
        active: { type: boolean, description: Whether it signs new manifests. }
    SigningKeys:
      type: object
      required: [keys]
      properties:
        keys:
          type: array
          items: { $ref: "#/components/schemas/SigningKey" }
    DeliveryKey:
      type: object
      required: [id, name, key, scope, created_by, created_at]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        name: { type: string }
        key:
          type: string
          pattern: "^glossa_pk_[A-Za-z0-9_-]{32}$"
          description: Publishable by design; shown on every read.
        scope: { $ref: "#/components/schemas/DeliveryKeyScope" }
        created_by: { type: string, description: "`person:<id>` or `token:<id>`." }
        created_at: { $ref: "#/components/schemas/Timestamp" }
        revoked_at: { $ref: "#/components/schemas/Timestamp" }
    DeliveryKeyScope:
      type: object
      required: [environments, branches]
      description: |
        What the key reads at the edge: the environments on its
        allowlist and, with `branches`, every branch preview. Anything
        outside it answers 404, exactly like an unknown key. Branch
        previews hold unreleased copy, so a key that ships in a
        production bundle must not reach them.
      properties:
        environments:
          type: array
          maxItems: 50
          uniqueItems: true
          description: |
            Environments by name — never a branch environment
            (`pr-<n>`, `br-<hash>`): those are reached through
            `branches`. Empty only when `branches` is true.
          items: { $ref: "#/components/schemas/EnvironmentName" }
        branches:
          type: boolean
          description: A preview key, for preview deployments only; it reads every branch environment.
    DeliveryKeyList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/DeliveryKey" }
        next_page_token: { type: string }

    # ── in-context editing (RFC 0004 §5.2) ────────────────────────────
    WebOrigin:
      type: string
      maxLength: 255
      description: |
        A web origin: scheme, host and port, with the default port
        dropped and nothing else — no path, query, fragment or
        userinfo. `https` everywhere; `http` only on `localhost`,
        `127.0.0.1`, `[::1]` or a `.localhost` name, which is a
        developer's own machine and never a deployment anyone else
        reaches. Canonicalized on write, so `HTTPS://App.Example.com:443`
        is stored and compared as `https://app.example.com`.
      examples: ["https://preview.example.com", "http://localhost:5173"]
    PreviewOrigin:
      type: object
      required: [id, origin, label, development, created_by, created_at]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        origin: { $ref: "#/components/schemas/WebOrigin" }
        label: { type: string, description: What people call this deployment. }
        development:
          type: boolean
          description: |
            True for a plain-http loopback origin: a developer's local
            run, never a shared deployment.
        created_by: { type: string, description: "`person:<id>` or `token:<id>`." }
        created_at: { $ref: "#/components/schemas/Timestamp" }
    PreviewOriginList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/PreviewOrigin" }
    CreatePreviewOrigin:
      type: object
      required: [origin]
      properties:
        origin: { $ref: "#/components/schemas/WebOrigin" }
        label: { type: string, maxLength: 100 }
    CreateInContextGrant:
      type: object
      required: [origin]
      properties:
        origin:
          allOf: [{ $ref: "#/components/schemas/WebOrigin" }]
          description: |
            The origin the editor runs on. It must be registered for
            this project, and it is the only origin the grant works
            from.
    InContextGrant:
      type: object
      required: [token, expires_at, project_id, origin, person_id, permissions]
      description: |
        The in-product editor's credential. `token` is shown exactly
        once, here; nothing stores it but the page's memory.
      properties:
        token:
          type: string
          pattern: "^glossa_ctx_[A-Za-z0-9_-]{43}$"
          description: The bearer credential. Never put it in `localStorage`.
        expires_at: { $ref: "#/components/schemas/Timestamp" }
        project_id: { $ref: "#/components/schemas/Id" }
        origin: { $ref: "#/components/schemas/WebOrigin" }
        person_id:
          allOf: [{ $ref: "#/components/schemas/Id" }]
          description: Who the editor acts as; every edit names them.
        permissions:
          type: array
          description: |
            What the grant allows: the person's own permissions
            intersected with `catalog.read`, `knowledge.read`,
            `translations.read`, `translations.write`,
            `intelligence.read` and `intelligence.translate`, and never
            more. Studio shows this list before minting.
          items: { $ref: "#/components/schemas/InContextPermission" }
    InContextPermission:
      type: object
      required: [permission]
      properties:
        permission:
          type: string
          enum: [catalog.read, knowledge.read, translations.read, translations.write,
                 intelligence.read, intelligence.translate]
        locales:
          type: array
          description: |
            The locales the permission holds for; absent means every
            locale. A translator limited to some locales in Studio is
            limited to the same ones in the editor.
          items: { $ref: "#/components/schemas/Locale" }
    CreateDeliveryKey:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 200, description: 'What uses it, e.g. "web" or "go-emails".' }
        scope:
          $ref: "#/components/schemas/DeliveryKeyScope"
          description: 'Omitted: `production` only. Change it later with `setDeliveryKeyScope`.'

    # ── knowledge: translation memory ─────────────────────────────────
    TMUnit:
      type: object
      description: |
        A translation-memory unit, derived from an approved translation.
        `source` and `target` are canonical MF2; `source_normalized` is
        what matching compares (placeholders by position, markup as
        tags) and `signature` the placeholders' types by position.
      required: [id, origin, source_locale, target_locale, source, target, target_model, source_normalized,
                 signature, state, hit_count, created_by, created_at, updated_at]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        project_id: { $ref: "#/components/schemas/Id", description: Absent for a tenant-wide unit. }
        origin: { type: string, enum: [translation, import] }
        translation_id: { $ref: "#/components/schemas/Id" }
        translation_revision: { type: integer, minimum: 1, description: The translation revision the unit reflects. }
        message_id: { $ref: "#/components/schemas/Id" }
        message_key: { $ref: "#/components/schemas/MessageKey" }
        namespace: { $ref: "#/components/schemas/Namespace" }
        source_locale: { $ref: "#/components/schemas/Locale" }
        target_locale: { $ref: "#/components/schemas/Locale" }
        source: { type: string }
        target: { type: string }
        target_model: { $ref: "#/components/schemas/MF2Message" }
        source_normalized: { type: string }
        signature: { type: string, examples: ["1:number/plural,2:string"] }
        state: { type: string, enum: [active, retired] }
        hit_count: { type: integer, minimum: 0 }
        last_hit_at: { $ref: "#/components/schemas/Timestamp" }
        created_by: { type: string, description: Who wrote the text. }
        created_at: { $ref: "#/components/schemas/Timestamp" }
        updated_at: { $ref: "#/components/schemas/Timestamp" }
        retired_at: { $ref: "#/components/schemas/Timestamp" }
        retired_reason: { type: string, enum: [superseded, unapproved, overwritten, deleted] }
        retired_by: { type: string }
    TMUnitList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/TMUnit" }
        next_page_token: { type: string }
    TMLookup:
      type: object
      required: [source, source_locale, target_locale]
      properties:
        source: { type: string, maxLength: 20000, description: The source message. }
        syntax: { $ref: "#/components/schemas/Syntax" }
        source_locale: { $ref: "#/components/schemas/Locale" }
        target_locale: { $ref: "#/components/schemas/Locale" }
        project_id: { $ref: "#/components/schemas/Id", description: The project the message belongs to. }
        all_projects: { type: boolean, default: false, description: Also match other projects' units. }
        message_key: { $ref: "#/components/schemas/MessageKey" }
        namespace: { $ref: "#/components/schemas/Namespace" }
        limit: { type: integer, minimum: 1, maximum: 50, default: 5 }
        min_score: { type: integer, minimum: 50, maximum: 101, default: 50 }
        count_hits: { type: boolean, default: false }
        target_syntax:
          $ref: "#/components/schemas/Syntax"
          description: "The syntax of each match's `target_text`; by default the query's `syntax`."
    TMMatch:
      type: object
      required: [score, kind, target, target_text, target_syntax, target_syntax_fallback, target_model, variables_adapted, unit]
      properties:
        score: { type: integer, minimum: 50, maximum: 101 }
        kind: { type: string, enum: [context, exact, fuzzy] }
        target: { type: string, description: "The unit's target in MF2, its variables renamed to the query's by position." }
        target_text:
          type: string
          description: >-
            The same target in the syntax the lookup asked for (`target_syntax`, by default the query's
            `syntax`), written from its model by the MessageFormat kernel. When MF1 was asked for but can't
            express the target (markup, MF2-only options), this is its MF2 and `target_syntax_fallback` is true.
        target_syntax: { $ref: "#/components/schemas/Syntax", description: "The syntax `target_text` is in." }
        target_syntax_fallback: { type: boolean, description: "True when `target_text` is MF2 because MF1 can't express the target." }
        target_model: { $ref: "#/components/schemas/MF2Message" }
        variables_adapted: { type: boolean, description: False when a target variable had no counterpart and kept its name. }
        unit: { $ref: "#/components/schemas/TMUnit" }
    TMLookupResult:
      type: object
      required: [source_normalized, matches]
      properties:
        source_normalized: { type: string }
        matches:
          type: array
          items: { $ref: "#/components/schemas/TMMatch" }
    TMConcordanceMatch:
      type: object
      required: [similarity, unit]
      properties:
        similarity: { type: number, minimum: 0, maximum: 1, description: Trigram word similarity of the phrase to the side searched. }
        unit: { $ref: "#/components/schemas/TMUnit" }
    TMConcordance:
      type: object
      required: [matches]
      properties:
        matches:
          type: array
          items: { $ref: "#/components/schemas/TMConcordanceMatch" }

    # ── knowledge: terminology ────────────────────────────────────────
    TermStatus:
      type: string
      enum: [preferred, admitted, deprecated, forbidden]
    PartOfSpeech:
      type: string
      enum: [noun, verb, adjective, adverb, proper_noun, phrase, other]
    Term:
      type: object
      required: [id, locale, text, status, case_sensitive]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        locale: { $ref: "#/components/schemas/Locale" }
        text: { type: string }
        status: { $ref: "#/components/schemas/TermStatus" }
        part_of_speech: { $ref: "#/components/schemas/PartOfSpeech" }
        case_sensitive: { type: boolean }
        note: { type: string }
    TermInput:
      type: object
      required: [locale, text]
      properties:
        locale: { $ref: "#/components/schemas/Locale" }
        text: { type: string, minLength: 1, maxLength: 200 }
        status: { $ref: "#/components/schemas/TermStatus" }
        part_of_speech: { $ref: "#/components/schemas/PartOfSpeech" }
        case_sensitive: { type: boolean, default: false }
        note: { type: string, maxLength: 4000 }
    TermConcept:
      type: object
      description: A termbase concept (intent §19.2) with its terms per locale.
      required: [id, definition, domain, note, product_ref, terms, version, created_by, created_at, updated_by, updated_at]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        project_id: { $ref: "#/components/schemas/Id", description: Absent for a tenant-wide concept. }
        definition: { type: string }
        domain: { type: string }
        note: { type: string }
        product_ref: { type: string, description: A product concept this concept stands for (opaque). }
        terms:
          type: array
          items: { $ref: "#/components/schemas/Term" }
        version: { type: integer, minimum: 1 }
        created_by: { type: string }
        created_at: { $ref: "#/components/schemas/Timestamp" }
        updated_by: { type: string }
        updated_at: { $ref: "#/components/schemas/Timestamp" }
    TermConceptList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/TermConcept" }
        next_page_token: { type: string }
    CreateTermConcept:
      type: object
      required: [terms]
      properties:
        project_id: { $ref: "#/components/schemas/Id", description: Scopes the concept to one project. }
        definition: { type: string, maxLength: 4000 }
        domain: { type: string, maxLength: 100 }
        note: { type: string, maxLength: 4000 }
        product_ref: { type: string, maxLength: 200 }
        terms:
          type: array
          minItems: 1
          maxItems: 200
          items: { $ref: "#/components/schemas/TermInput" }
    ReplaceTermConcept:
      type: object
      required: [terms]
      properties:
        definition: { type: string, maxLength: 4000 }
        domain: { type: string, maxLength: 100 }
        note: { type: string, maxLength: 4000 }
        product_ref: { type: string, maxLength: 200 }
        terms:
          type: array
          minItems: 1
          maxItems: 200
          items: { $ref: "#/components/schemas/TermInput" }
    RevisionAction:
      type: string
      enum: [created, updated, deleted]
    TermConceptRevision:
      type: object
      required: [version, action, author, created_at, concept]
      properties:
        version: { type: integer, minimum: 1 }
        action: { $ref: "#/components/schemas/RevisionAction" }
        author: { type: string }
        created_at: { $ref: "#/components/schemas/Timestamp" }
        concept: { $ref: "#/components/schemas/TermConcept" }
    TermConceptRevisionList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/TermConceptRevision" }
        next_page_token: { type: string }
    TermRecognitionRequest:
      type: object
      required: [text, locale]
      properties:
        text: { type: string, maxLength: 20000 }
        syntax: { $ref: "#/components/schemas/Syntax", description: "Parse `text` as a message in this syntax and recognize its visible text." }
        locale: { $ref: "#/components/schemas/Locale" }
        target_locale: { $ref: "#/components/schemas/Locale" }
        project_id: { $ref: "#/components/schemas/Id", description: "Adds the project's concepts to the tenant-wide ones." }
    TermHit:
      type: object
      required: [concept_id, definition, term, start, end, text]
      properties:
        concept_id: { $ref: "#/components/schemas/Id" }
        definition: { type: string }
        term: { $ref: "#/components/schemas/Term" }
        start: { type: integer, minimum: 0, description: Code point offset into `analyzed_text`. }
        end: { type: integer, minimum: 0, description: Exclusive. }
        text: { type: string, description: "The words matched, as written." }
        targets:
          type: array
          description: "The concept's terms in `target_locale`, allowed ones first."
          items: { $ref: "#/components/schemas/Term" }
    TermRecognition:
      type: object
      required: [analyzed_text, hits]
      properties:
        analyzed_text: { type: string }
        hits:
          type: array
          items: { $ref: "#/components/schemas/TermHit" }
    TerminologyCheckRequest:
      type: object
      required: [source, source_locale, target, target_locale]
      properties:
        source: { type: string, maxLength: 20000 }
        source_locale: { $ref: "#/components/schemas/Locale" }
        target: { type: string, maxLength: 20000 }
        target_locale: { $ref: "#/components/schemas/Locale" }
        syntax: { $ref: "#/components/schemas/Syntax", description: Parse both texts as messages in this syntax. }
        project_id: { $ref: "#/components/schemas/Id" }
    TermFinding:
      type: object
      required: [code, severity, concept_id, term_id, side, start, end, text, suggestions, message]
      properties:
        code: { type: string, enum: [term_missing, term_forbidden] }
        severity: { type: string, enum: [error, warning] }
        concept_id: { $ref: "#/components/schemas/Id" }
        term_id: { $ref: "#/components/schemas/Id" }
        side: { type: string, enum: [source, target] }
        start: { type: integer, minimum: 0, description: "Code point offset into `source_text` or `target_text`." }
        end: { type: integer, minimum: 0 }
        text: { type: string }
        suggestions:
          type: array
          description: The concept's allowed target terms, preferred first.
          items: { type: string }
        message: { type: string, description: For humans; wording may change. }
    TerminologyCheck:
      type: object
      required: [source_text, target_text, findings]
      properties:
        source_text: { type: string }
        target_text: { type: string }
        findings:
          type: array
          items: { $ref: "#/components/schemas/TermFinding" }
    TranslationTerminologyFindings:
      type: object
      required: [message_id, message_key, namespace, locale, state, source_text, target_text, findings]
      properties:
        message_id: { $ref: "#/components/schemas/Id" }
        message_key: { $ref: "#/components/schemas/MessageKey" }
        namespace: { type: string }
        locale: { $ref: "#/components/schemas/Locale" }
        state: { $ref: "#/components/schemas/ReviewState" }
        source_text: { type: string, description: "The source's visible text, which `source` spans point into." }
        target_text: { type: string, description: "The translation's visible text, which `target` spans point into." }
        findings:
          type: array
          items: { $ref: "#/components/schemas/TermFinding" }
    ProjectTerminologyFindings:
      type: object
      required: [items, checked]
      properties:
        items:
          type: array
          description: The page's translations with findings, by message key and locale.
          items: { $ref: "#/components/schemas/TranslationTerminologyFindings" }
        checked:
          type: object
          description: The translations this page checked, by locale.
          additionalProperties: { type: integer }
        next_page_token: { type: string }

    # ── knowledge: style guides ───────────────────────────────────────
    StyleFormality:
      type: object
      properties:
        register: { type: string, enum: [formal, informal, neutral] }
        pronoun: { type: string, maxLength: 4000, examples: [Sie, du, vous] }
    StylePunctuation:
      type: object
      properties:
        quotes: { type: string, maxLength: 4000, examples: ["„“"] }
        nested_quotes: { type: string, maxLength: 4000 }
        dash: { type: string, enum: [hyphen, en, em] }
        space_before_unit: { type: boolean }
        space_before_punctuation: { type: boolean }
        serial_comma: { type: boolean }
        ellipsis: { type: string, maxLength: 4000 }
    StyleNumbers:
      type: object
      properties:
        decimal_separator: { type: string, maxLength: 4000 }
        grouping_separator: { type: string, maxLength: 4000 }
        notes: { type: string, maxLength: 4000 }
    StyleDates:
      type: object
      properties:
        format: { type: string, maxLength: 4000, description: A CLDR date pattern. }
        notes: { type: string, maxLength: 4000 }
    StyleFields:
      type: object
      description: Structured style. Every leaf is optional; unset inherits from a broader guide.
      properties:
        formality: { $ref: "#/components/schemas/StyleFormality" }
        tone:
          type: array
          maxItems: 20
          description: Tone tags; a narrower guide's list replaces a broader one's.
          items: { type: string, minLength: 1, maxLength: 50 }
        punctuation: { $ref: "#/components/schemas/StylePunctuation" }
        numbers: { $ref: "#/components/schemas/StyleNumbers" }
        dates: { $ref: "#/components/schemas/StyleDates" }
    StyleRule:
      type: object
      required: [id]
      properties:
        id: { type: string, pattern: "^[a-z0-9][a-z0-9_-]{0,63}$", description: Identity across scopes. }
        title: { type: string, maxLength: 200, description: Required unless `disabled`. }
        rationale: { type: string, maxLength: 4000 }
        good:
          type: array
          maxItems: 20
          items: { type: string, maxLength: 4000 }
        bad:
          type: array
          maxItems: 20
          items: { type: string, maxLength: 4000 }
        disabled: { type: boolean, description: Switches off a broader guide's rule with this id. }
    StyleGuide:
      type: object
      required: [id, name, fields, rules, version, created_by, created_at, updated_by, updated_at]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        project_id: { $ref: "#/components/schemas/Id" }
        locale: { $ref: "#/components/schemas/Locale" }
        namespace: { $ref: "#/components/schemas/Namespace" }
        name: { type: string }
        fields: { $ref: "#/components/schemas/StyleFields" }
        rules:
          type: array
          items: { $ref: "#/components/schemas/StyleRule" }
        version: { type: integer, minimum: 1 }
        created_by: { type: string }
        created_at: { $ref: "#/components/schemas/Timestamp" }
        updated_by: { type: string }
        updated_at: { $ref: "#/components/schemas/Timestamp" }
    StyleGuideList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/StyleGuide" }
        next_page_token: { type: string }
    CreateStyleGuide:
      type: object
      properties:
        project_id: { $ref: "#/components/schemas/Id" }
        locale: { $ref: "#/components/schemas/Locale" }
        namespace: { $ref: "#/components/schemas/Namespace" }
        name: { type: string, maxLength: 200 }
        fields: { $ref: "#/components/schemas/StyleFields" }
        rules:
          type: array
          maxItems: 200
          items: { $ref: "#/components/schemas/StyleRule" }
    ReplaceStyleGuide:
      type: object
      properties:
        name: { type: string, maxLength: 200 }
        fields: { $ref: "#/components/schemas/StyleFields" }
        rules:
          type: array
          maxItems: 200
          items: { $ref: "#/components/schemas/StyleRule" }
    StyleGuideVersion:
      type: object
      required: [version, action, author, created_at, style_guide]
      properties:
        version: { type: integer, minimum: 1 }
        action: { $ref: "#/components/schemas/RevisionAction" }
        author: { type: string }
        created_at: { $ref: "#/components/schemas/Timestamp" }
        style_guide: { $ref: "#/components/schemas/StyleGuide" }
    StyleGuideVersionList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/StyleGuideVersion" }
        next_page_token: { type: string }
    StyleGuideSource:
      type: object
      required: [style_guide_id, version]
      properties:
        style_guide_id: { $ref: "#/components/schemas/Id" }
        version: { type: integer, minimum: 1 }
        project_id: { $ref: "#/components/schemas/Id" }
        locale: { $ref: "#/components/schemas/Locale" }
        namespace: { $ref: "#/components/schemas/Namespace" }
    EffectiveStyleGuide:
      type: object
      required: [fields, rules, sources]
      properties:
        fields: { $ref: "#/components/schemas/StyleFields" }
        rules:
          type: array
          items: { $ref: "#/components/schemas/StyleRule" }
        sources:
          type: array
          description: The guide versions merged, broadest first.
          items: { $ref: "#/components/schemas/StyleGuideSource" }
    # ── Intelligence ──────────────────────────────────────────────────
    MicroUSD:
      type: integer
      format: int64
      minimum: 0
      description: Money in millionths of a US dollar (1 USD = 1000000).
    AIProviderKind:
      type: string
      enum: [anthropic, openai_compatible, gemini]
      description: |
        The API a provider speaks: the Anthropic Messages API, an
        OpenAI-compatible `/chat/completions` endpoint (OpenAI, Mistral,
        self-hosted servers) or Gemini.
    AIProviderName:
      type: string
      pattern: "^[a-z][a-z0-9-]{0,62}$"
      description: What routing policies route to, e.g. `anthropic` or `mistral-eu`.
    AIProvider:
      type: object
      required: [id, name, kind, models, enabled, api_key_set, version, created_by, created_at, updated_by, updated_at]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        name: { $ref: "#/components/schemas/AIProviderName" }
        kind: { $ref: "#/components/schemas/AIProviderKind" }
        base_url: { type: string, maxLength: 500, description: The endpoint; absent for the kind's default. }
        models:
          type: array
          description: The model allow-list; empty allows any model.
          items: { type: string, maxLength: 200 }
        enabled: { type: boolean }
        api_key_set: { type: boolean, description: Whether a key is stored. The key itself is never returned. }
        version: { type: integer }
        created_by: { type: string }
        created_at: { $ref: "#/components/schemas/Timestamp" }
        updated_by: { type: string }
        updated_at: { $ref: "#/components/schemas/Timestamp" }
    AIProviderList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/AIProvider" } }
        next_page_token: { type: string }
    CreateAIProvider:
      type: object
      required: [name, kind]
      properties:
        name: { $ref: "#/components/schemas/AIProviderName" }
        kind: { $ref: "#/components/schemas/AIProviderKind" }
        base_url: { type: string, maxLength: 500, description: "Required for `openai_compatible`; https only unless the deployment allows private endpoints." }
        models: { type: array, maxItems: 50, items: { type: string, minLength: 1, maxLength: 200 } }
        enabled: { type: boolean, default: true }
        api_key: { type: string, maxLength: 1000, writeOnly: true, description: Sealed at rest; never returned. }
    UpdateAIProvider:
      type: object
      properties:
        name: { $ref: "#/components/schemas/AIProviderName" }
        base_url: { type: string, maxLength: 500 }
        models: { type: array, maxItems: 50, items: { type: string, minLength: 1, maxLength: 200 } }
        enabled: { type: boolean }
        api_key: { type: string, maxLength: 1000, writeOnly: true, description: Replaces the key. }
        clear_api_key: { type: boolean, description: Removes the key. }
    AISettings:
      type: object
      required: [provider_consent, max_concurrent_jobs, monthly_budget_micro_usd, version]
      properties:
        provider_consent:
          type: boolean
          description: |
            The tenant's explicit permission to send text to AI providers
            (RFC 0003 §7). Off by default; without it only exact
            translation-memory matches are reused.
        consent_changed_by: { type: string }
        consent_changed_at: { $ref: "#/components/schemas/Timestamp" }
        max_concurrent_jobs: { type: integer, minimum: 1, maximum: 64, description: The tenant's running jobs across replicas. }
        monthly_budget_micro_usd:
          allOf: [{ $ref: "#/components/schemas/MicroUSD" }]
          description: Provider spend per calendar month (UTC); 0 allows none.
        version: { type: integer, description: 0 until saved. }
        updated_by: { type: string }
        updated_at: { $ref: "#/components/schemas/Timestamp" }
    UpdateAISettings:
      type: object
      properties:
        provider_consent: { type: boolean }
        max_concurrent_jobs: { type: integer, minimum: 1, maximum: 64 }
        monthly_budget_micro_usd: { $ref: "#/components/schemas/MicroUSD" }
    AIPrice:
      type: object
      required: [input_per_mtok, output_per_mtok]
      properties:
        input_per_mtok: { type: number, format: double, minimum: 0, description: USD per million input tokens. }
        output_per_mtok: { type: number, format: double, minimum: 0 }
        cache_read_per_mtok: { type: number, format: double, minimum: 0 }
        cache_write_per_mtok: { type: number, format: double, minimum: 0 }
    AIPriceTable:
      type: object
      description: "`<provider>/<model>` to its price."
      additionalProperties: { $ref: "#/components/schemas/AIPrice" }
    AIPrices:
      type: object
      required: [defaults, overrides, effective, version]
      properties:
        defaults: { $ref: "#/components/schemas/AIPriceTable" }
        overrides: { $ref: "#/components/schemas/AIPriceTable" }
        effective: { $ref: "#/components/schemas/AIPriceTable" }
        version: { type: integer, description: The settings' version. }
    PutAIPrices:
      type: object
      required: [overrides]
      properties:
        overrides:
          type: object
          maxProperties: 500
          additionalProperties: { $ref: "#/components/schemas/AIPrice" }
    AIProviderSpend:
      type: object
      required: [provider, model, cost_micro_usd, calls, input_tokens, output_tokens]
      properties:
        provider: { type: string }
        model: { type: string }
        cost_micro_usd: { $ref: "#/components/schemas/MicroUSD" }
        calls: { type: integer }
        input_tokens: { type: integer, format: int64 }
        output_tokens: { type: integer, format: int64 }
    AIBudget:
      type: object
      required: [monthly_budget_micro_usd, spent_micro_usd, remaining_micro_usd, calls, month_start, by_provider]
      properties:
        monthly_budget_micro_usd: { $ref: "#/components/schemas/MicroUSD" }
        spent_micro_usd: { $ref: "#/components/schemas/MicroUSD" }
        remaining_micro_usd: { $ref: "#/components/schemas/MicroUSD" }
        calls: { type: integer }
        month_start: { $ref: "#/components/schemas/Timestamp" }
        by_provider: { type: array, items: { $ref: "#/components/schemas/AIProviderSpend" } }
    AIUsage:
      type: object
      required: [input_tokens, output_tokens]
      properties:
        input_tokens: { type: integer, format: int64 }
        output_tokens: { type: integer, format: int64 }
        cache_read_tokens: { type: integer, format: int64 }
        cache_write_tokens: { type: integer, format: int64 }
    AISpendEntry:
      type: object
      required: [id, task, provider, model, usage, cost_micro_usd, priced, occurred_at]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        job_id: { $ref: "#/components/schemas/Id" }
        project_id: { $ref: "#/components/schemas/Id" }
        task: { $ref: "#/components/schemas/AITask" }
        provider: { type: string }
        model: { type: string }
        usage: { $ref: "#/components/schemas/AIUsage" }
        cost_micro_usd: { $ref: "#/components/schemas/MicroUSD" }
        priced: { type: boolean, description: false when the price table has no price for the model (cost 0). }
        occurred_at: { $ref: "#/components/schemas/Timestamp" }
    AISpendList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/AISpendEntry" } }
        next_page_token: { type: string }
    AITask:
      type: string
      enum: [translate, review, explain, assess]
    AIRoute:
      type: object
      required: [provider, model, max_tokens]
      properties:
        provider: { $ref: "#/components/schemas/AIProviderName" }
        model: { type: string, minLength: 1, maxLength: 200 }
        max_tokens: { type: integer, minimum: 1, maximum: 64000 }
        temperature: { type: number, format: double, minimum: 0, maximum: 2 }
        effort: { type: string, enum: [low, medium, high, max] }
    AIRoutingRule:
      type: object
      required: [task, routes]
      properties:
        task: { $ref: "#/components/schemas/AITask" }
        locales:
          type: array
          description: Target locales the rule applies to (a language covers its regions); empty applies to all.
          items: { $ref: "#/components/schemas/Locale" }
        routes:
          type: array
          minItems: 1
          maxItems: 5
          description: The preferred route first, then fallbacks.
          items: { $ref: "#/components/schemas/AIRoute" }
    AIRoutingPolicy:
      type: object
      required: [rules]
      properties:
        rules: { type: array, maxItems: 100, items: { $ref: "#/components/schemas/AIRoutingRule" } }
    AIRoutingPolicyView:
      type: object
      required: [policy, source, version]
      properties:
        policy: { $ref: "#/components/schemas/AIRoutingPolicy" }
        source: { type: string, enum: [default, tenant, project], description: Where the policy in effect comes from. }
        version: { type: integer, description: The stored policy's version; 0 for the default. }
        updated_by: { type: string }
        updated_at: { $ref: "#/components/schemas/Timestamp" }
    AINamespaceTag:
      type: string
      enum: [sensitive, legal, marketing]
    AIReviewPolicy:
      type: object
      required: [auto_approve, auto_approve_min, recommend_min]
      properties:
        auto_approve: { type: boolean, description: Off by default. }
        auto_approve_min: { type: number, format: double, exclusiveMinimum: 0, maximum: 1, description: "Scores at or above it are `auto_approve` (when on)." }
        recommend_min: { type: number, format: double, exclusiveMinimum: 0, maximum: 1, description: "Scores at or above it are `approve_recommended`; below, `review_required`." }
        force_review:
          type: array
          maxItems: 20
          description: Explanation factors that require review whatever the score (`missing_plural_categories` always does).
          items: { type: string }
        auto_approve_environments:
          type: array
          maxItems: 20
          description: The environments auto-approved text ships to; each must ship approved translations.
          items: { $ref: "#/components/schemas/EnvironmentName" }
    AIProjectSettings:
      type: object
      required: [namespace_tags, auto_translate_locales, review, version]
      properties:
        namespace_tags:
          type: object
          description: A namespace to its policy tags.
          additionalProperties: { type: array, items: { $ref: "#/components/schemas/AINamespaceTag" } }
        auto_translate_locales: { type: array, items: { $ref: "#/components/schemas/Locale" } }
        review: { $ref: "#/components/schemas/AIReviewPolicy" }
        version: { type: integer, description: 0 until saved. }
        updated_by: { type: string }
        updated_at: { $ref: "#/components/schemas/Timestamp" }
    UpdateAIProjectSettings:
      type: object
      properties:
        namespace_tags:
          type: object
          maxProperties: 500
          additionalProperties: { type: array, maxItems: 3, items: { $ref: "#/components/schemas/AINamespaceTag" } }
        auto_translate_locales: { type: array, maxItems: 200, items: { $ref: "#/components/schemas/Locale" } }
        review: { $ref: "#/components/schemas/AIReviewPolicy" }
    AIFillSelect:
      type: string
      enum: [missing, outdated, missing_or_outdated]
      description: "Which messages a fill translates, by their translation's state in each locale: `missing` (none, or rejected), `outdated` (made against an older source revision) or either."
    CreateAIFill:
      type: object
      required: [locales]
      properties:
        locales: { type: array, minItems: 1, maxItems: 20, items: { $ref: "#/components/schemas/Locale" } }
        namespace: { $ref: "#/components/schemas/Namespace" }
        key_prefix: { type: string, maxLength: 200 }
        keys: { type: array, maxItems: 500, items: { $ref: "#/components/schemas/MessageKey" } }
        include_outdated: { type: boolean, default: false, description: "The older spelling of `select: missing_or_outdated`." }
        select:
          $ref: "#/components/schemas/AIFillSelect"
          description: "Default `missing`; `missing_or_outdated` with `include_outdated` or listed `keys`."
        force:
          type: boolean
          default: false
          description: |
            Translate the listed `keys` even where the translation is
            already current, instead of skipping them as
            `skipped.up_to_date`. Someone looking at a message in the
            in-product editor wants a second opinion on the text that is
            there, which is the one case a selection can't express. It
            needs `keys` (never a whole project), queues the job again
            when one exists for the same message, locale, source
            revision and knowledge, and is ignored by auto-translate.
    AIJobState:
      type: string
      enum: [queued, running, succeeded, skipped, failed, dead, cancelled]
    AITrigger:
      type: string
      enum: [message_created, translation_outdated, locale_added, fill]
    AIFill:
      type: object
      required: [id, project_id, trigger, locales, select, jobs_created, jobs_existing, skipped, job_states, warnings, requested_by, created_at]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        project_id: { $ref: "#/components/schemas/Id" }
        trigger: { type: string, enum: [fill, locale_added] }
        locales: { type: array, items: { $ref: "#/components/schemas/Locale" } }
        namespace: { type: string }
        key_prefix: { type: string }
        keys: { type: array, items: { type: string } }
        include_outdated: { type: boolean }
        select: { $ref: "#/components/schemas/AIFillSelect", description: The effective selection. }
        jobs_created: { type: integer, description: "Jobs queued, new or queued again." }
        jobs_existing: { type: integer, description: "Jobs that already existed for the same message, locale, source revision and knowledge." }
        job_ids:
          type: array
          maxItems: 200
          description: |
            The jobs this fill queued or reused, so a client can follow
            them with `GET …/ai-jobs/{ai_job}` instead of watching the
            whole list. Present only on the fill's own response, and
            only for a small fill (at most 200 jobs); a bigger one is
            followed with `GET …/ai-jobs?fill=<id>`.
          items: { $ref: "#/components/schemas/Id" }
        skipped:
          type: object
          description: "Messages left out, by reason: `sensitive`, `up_to_date`, `not_selected`, `limit`."
          additionalProperties: { type: integer }
        job_states:
          type: object
          description: The fill's jobs by state.
          additionalProperties: { type: integer }
        warnings:
          type: array
          description: "`provider_consent_off`, `no_budget`, `no_provider`."
          items: { type: string }
        requested_by: { type: string }
        created_at: { $ref: "#/components/schemas/Timestamp" }
    AICostEstimate:
      type: object
      required: [estimated_micro_usd, max_micro_usd, unpriced]
      properties:
        estimated_micro_usd: { $ref: "#/components/schemas/MicroUSD" }
        max_micro_usd: { $ref: "#/components/schemas/MicroUSD" }
        unpriced: { type: boolean, description: "A route's model has no price; its calls count as 0." }
    AIFillPreviewLocale:
      type: object
      required: [locale, keys, existing, tm_exact, provider, refused, skipped, cost]
      properties:
        locale: { $ref: "#/components/schemas/Locale" }
        keys:
          type: array
          description: The messages a fill would queue (or reuse) a job for, in key order.
          items: { $ref: "#/components/schemas/MessageKey" }
        existing: { type: integer, description: "Jobs that exist and would be reused, not run again." }
        tm_exact: { type: integer, description: "Messages an exact translation-memory match covers: no provider call." }
        provider: { type: integer, description: Messages that would call a provider. }
        refused:
          type: object
          description: "Messages that would not reach a provider, by reason: `sensitive` (never queued), `provider_consent`, `no_route`, `budget_exceeded` (queued, then failing)."
          additionalProperties: { type: integer }
        skipped:
          type: object
          description: "Messages left out, by reason: `up_to_date`, `not_selected`, `limit`."
          additionalProperties: { type: integer }
        cost: { $ref: "#/components/schemas/AICostEstimate" }
    AIFillPreview:
      type: object
      required: [project_id, select, locales, warnings, cost]
      properties:
        project_id: { $ref: "#/components/schemas/Id" }
        select: { $ref: "#/components/schemas/AIFillSelect", description: The effective selection. }
        locales: { type: array, items: { $ref: "#/components/schemas/AIFillPreviewLocale" } }
        warnings:
          type: array
          description: "As a fill's: `provider_consent_off`, `no_budget`, `no_provider`."
          items: { type: string }
        cost: { $ref: "#/components/schemas/AICostEstimate" }
    AIAuditEntry:
      type: object
      required: [tool, output, at]
      properties:
        tool: { type: string, description: "`tm_lookup`, `term_lookup`, `style_rules`, `message_context`, `validate`, `draft`, `assess`." }
        output: { description: "The tool's result, as recorded." }
        at: { $ref: "#/components/schemas/Timestamp" }
    AIJob:
      type: object
      required: [id, project_id, message_id, message_key, namespace, locale, source_revision, knowledge_fingerprint, trigger, state,
                 attempts, max_attempts, available_at, created_by, created_at, updated_at]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        project_id: { $ref: "#/components/schemas/Id" }
        message_id: { $ref: "#/components/schemas/Id" }
        message_key: { $ref: "#/components/schemas/MessageKey" }
        namespace: { type: string }
        locale: { $ref: "#/components/schemas/Locale" }
        source_revision: { type: integer }
        knowledge_fingerprint: { type: string, description: "Digest of the prompts, style guides and termbase the job was queued against." }
        trigger: { $ref: "#/components/schemas/AITrigger" }
        fill_id: { $ref: "#/components/schemas/Id" }
        state: { $ref: "#/components/schemas/AIJobState" }
        attempts: { type: integer }
        max_attempts: { type: integer }
        available_at: { $ref: "#/components/schemas/Timestamp" }
        failure_code: { type: string, description: "Why it failed, was skipped or died (see the listing)." }
        last_error: { type: string }
        suggestion_id: { $ref: "#/components/schemas/Id" }
        audit: { type: array, items: { $ref: "#/components/schemas/AIAuditEntry" } }
        created_by: { type: string }
        created_at: { $ref: "#/components/schemas/Timestamp" }
        started_at: { $ref: "#/components/schemas/Timestamp" }
        finished_at: { $ref: "#/components/schemas/Timestamp" }
        updated_at: { $ref: "#/components/schemas/Timestamp" }
    AIJobList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/AIJob" } }
        next_page_token: { type: string }
    AIAction:
      type: string
      enum: [auto_approve, approve_recommended, review_required]
    AISuggestionStatus:
      type: string
      enum: [pending, accepted, rejected, auto_applied, superseded]
    AIConfidenceFactor:
      type: object
      required: [factor, value, contribution, reason]
      properties:
        factor: { type: string, description: "`origin`, `tm_match`, `term_forbidden`, `term_missing`, `repairs`, `qa_warnings`, `self_assessment`, `formality`, `max_length`, `length_ratio`, `risk_tag`, `markup_density`, `missing_plural_categories`." }
        value: { type: number, format: double }
        contribution: { type: number, format: double, description: How much it moved the score (negative lowers it). }
        reason: { type: string }
    AITermFinding:
      type: object
      required: [code, concept_id, term, message]
      properties:
        code: { type: string, enum: [term_missing, term_forbidden] }
        concept_id: { type: string }
        term_id: { type: string }
        term: { type: string }
        message: { type: string }
    AIProvenance:
      type: object
      required: [origin, repairs]
      properties:
        origin: { type: string, enum: [ai, translation_memory] }
        provider: { type: string }
        model: { type: string }
        prompt_version: { type: string }
        tm_unit_ids: { type: array, items: { type: string } }
        term_ids: { type: array, items: { type: string } }
        style_version: { type: string }
        repairs: { type: integer }
    AICall:
      type: object
      required: [task, provider, model, prompt_version, usage, cost_micro_usd]
      properties:
        task: { $ref: "#/components/schemas/AITask" }
        provider: { type: string }
        model: { type: string }
        prompt_version: { type: string }
        usage: { $ref: "#/components/schemas/AIUsage" }
        cost_micro_usd: { $ref: "#/components/schemas/MicroUSD" }
    AIEditDiff:
      type: object
      required: [distance, ratio]
      properties:
        distance: { type: integer, description: Character edit distance of the visible text. }
        ratio: { type: number, format: double, description: The distance over the longer text's length. }
        terms_added: { type: array, items: { type: string } }
        terms_removed: { type: array, items: { type: string } }
        style_fields: { type: array, description: "Style fields whose use changed: `quotes`, `dash`, `ellipsis`, `space_before_punctuation`, `pronoun`.", items: { type: string } }
    AIDecision:
      type: object
      properties:
        edit: { $ref: "#/components/schemas/AIEditDiff" }
        reason: { type: string }
    AISuggestion:
      type: object
      required: [id, job_id, project_id, message_id, message_key, namespace, locale, source_revision, message, model, findings,
                 term_findings, provenance, score, explanation, action, risk_tags, calls, usage, cost_micro_usd, status, version, created_at]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        job_id: { $ref: "#/components/schemas/Id" }
        project_id: { $ref: "#/components/schemas/Id" }
        message_id: { $ref: "#/components/schemas/Id" }
        message_key: { $ref: "#/components/schemas/MessageKey" }
        namespace: { type: string }
        locale: { $ref: "#/components/schemas/Locale" }
        source_revision: { type: integer }
        message: { type: string, description: The translation in canonical MF2 syntax. }
        model: { $ref: "#/components/schemas/MF2Message" }
        findings: { type: array, description: Structural warnings (errors never reach a suggestion)., items: { $ref: "#/components/schemas/QAFinding" } }
        term_findings: { type: array, items: { $ref: "#/components/schemas/AITermFinding" } }
        provenance: { $ref: "#/components/schemas/AIProvenance" }
        score: { type: number, format: double, minimum: 0, maximum: 1 }
        explanation: { type: array, items: { $ref: "#/components/schemas/AIConfidenceFactor" } }
        action: { $ref: "#/components/schemas/AIAction" }
        action_note: { type: string, description: Why the routed action differs from what the bands alone say. }
        risk_tags: { type: array, items: { type: string } }
        calls: { type: array, items: { $ref: "#/components/schemas/AICall" } }
        usage: { $ref: "#/components/schemas/AIUsage" }
        cost_micro_usd: { $ref: "#/components/schemas/MicroUSD" }
        status: { $ref: "#/components/schemas/AISuggestionStatus" }
        translation_revision: { type: integer, description: "The revision it became, once accepted or auto-applied." }
        decided_by: { type: string }
        decided_at: { $ref: "#/components/schemas/Timestamp" }
        decision: { $ref: "#/components/schemas/AIDecision" }
        version: { type: integer }
        created_at: { $ref: "#/components/schemas/Timestamp" }
        source: { $ref: "#/components/schemas/AISuggestionSource" }
    AISuggestionSource:
      type: object
      description: >-
        The suggestion's message as it is now (omitted once the message no longer exists): what a reviewer
        compares the suggestion with. `message_key` and `namespace` are current (a rename shows here, not in the
        suggestion's own); the suggestion is outdated when its `source_revision` is older than this one.
      required: [message_key, namespace, state, source_revision, text, syntax, mf2, model]
      properties:
        message_key: { $ref: "#/components/schemas/MessageKey" }
        namespace: { type: string }
        state: { type: string, enum: [active, obsolete] }
        source_revision: { type: integer }
        text: { type: string, description: The source as authored. }
        syntax: { $ref: "#/components/schemas/Syntax" }
        mf2: { type: string, description: The source in canonical MF2 syntax. }
        model: { $ref: "#/components/schemas/MF2Message" }
    AISuggestionList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/AISuggestion" } }
        next_page_token: { type: string }
    AcceptAISuggestion:
      type: object
      properties:
        text: { type: string, minLength: 1, maxLength: 20000, description: An edit to accept instead of the suggestion. }
        syntax: { $ref: "#/components/schemas/Syntax" }
        in_context:
          allOf: [{ $ref: "#/components/schemas/InContextProvenance" }]
          description: |
            Where the person was looking when they accepted. Recorded
            as `origin_detail.in_context` on the revision, beside what
            the suggestion itself contributed, so history can say the
            edit was made in the running product and on which route
            (RFC 0004 §5.3). Only the in-product editor sends it.
    InContextProvenance:
      type: object
      required: [route]
      description: |
        An edit made in the running product: the route pattern the page
        was on and the viewport it was seen at.
      properties:
        route:
          type: string
          maxLength: 500
          description: "The route pattern, not the URL: `/orders/:id`, never `/orders/8123`."
        viewport:
          type: object
          required: [width, height]
          properties:
            width: { type: integer, minimum: 1, maximum: 100000 }
            height: { type: integer, minimum: 1, maximum: 100000 }
    RejectAISuggestion:
      type: object
      properties:
        reason: { type: string, maxLength: 2000 }
    AISentMessage:
      type: object
      required: [role, text]
      properties:
        role: { type: string, enum: [user, assistant] }
        text: { type: string }
    AIDisclosure:
      type: object
      required: [id, job_id, project_id, message_id, locale, task, provider, model, system_sha256, sent, occurred_at]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        job_id: { $ref: "#/components/schemas/Id" }
        project_id: { $ref: "#/components/schemas/Id" }
        message_id: { $ref: "#/components/schemas/Id" }
        locale: { $ref: "#/components/schemas/Locale" }
        task: { $ref: "#/components/schemas/AITask" }
        provider: { type: string }
        model: { type: string }
        system_sha256: { type: string, description: "Identifies the (versioned, data-free) system prompt." }
        sent: { type: array, description: Exactly what the provider received., items: { $ref: "#/components/schemas/AISentMessage" } }
        occurred_at: { $ref: "#/components/schemas/Timestamp" }
    AIDisclosureList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/AIDisclosure" } }
        next_page_token: { type: string }
    AILocaleMetrics:
      type: object
      required: [locale, accepted, edited, rejected, acceptance_rate, mean_edit_distance, mean_edit_ratio]
      properties:
        locale: { $ref: "#/components/schemas/Locale" }
        accepted: { type: integer }
        edited: { type: integer, description: Accepted after an edit. }
        rejected: { type: integer }
        acceptance_rate: { type: number, format: double, description: accepted / (accepted + rejected). }
        mean_edit_distance: { type: number, format: double }
        mean_edit_ratio: { type: number, format: double }
    AIMetrics:
      type: object
      required: [since, locales]
      properties:
        since: { $ref: "#/components/schemas/Timestamp" }
        locales: { type: array, items: { $ref: "#/components/schemas/AILocaleMetrics" } }
    AIEvalMetrics:
      type: object
      required: [cases, structural_pass_rate, terminology_compliance, formality_compliance, mean_edit_ratio, origin_accuracy]
      properties:
        cases: { type: integer }
        structural_pass_rate: { type: number, format: double }
        terminology_compliance: { type: number, format: double }
        formality_compliance: { type: number, format: double }
        mean_edit_ratio: { type: number, format: double }
        origin_accuracy: { type: number, format: double }
    AIEvalBaseline:
      type: object
      required: [pairs]
      properties:
        pairs:
          type: object
          description: A locale pair (`en-de`) or `all` to its tracked metrics.
          additionalProperties: { $ref: "#/components/schemas/AIEvalMetrics" }

    # ── integration ──────────────────────────────────────────────────
    IntegrationFormat:
      type: string
      enum: [xliff, json, po, tmx, tbx]
      description: |
        `xliff` XLIFF 2.1, `json` flat or nested `{key: message}`, `po`
        gettext (import only), `tmx` TMX 1.4b, `tbx` TBX-Basic.
    IntegrationKind:
      type: string
      enum: [catalog, tm, termbase]
      description: What the job moves; follows from the format.
    ImportMode:
      type: string
      enum: [dry_run, merge, overwrite]
    IntegrationJobState:
      type: string
      enum: [awaiting_upload, queued, running, succeeded, failed, cancelled]
    ImportOptions:
      type: object
      description: |
        How the file is read; options a format doesn't take are refused
        (`invalid_options`).
      properties:
        locale:
          $ref: "#/components/schemas/Locale"
          description: |
            JSON: the file's locale (default the project's source
            locale, making it a source catalog). PO: the translations'
            locale (default the file's `Language` header). XLIFF: the
            translations' locale (default the file's `trgLang`) — it
            names the locale of a file without `trgLang`, or imports a
            file as another locale than it names (`de` into `de-AT`).
            It must be one of the project's locales (a target locale;
            for JSON also the source locale): `locale_not_found` (404)
            otherwise.
        namespace: { type: string, maxLength: 64, description: "JSON and PO: every message's namespace (default `default`)." }
        syntax:
          $ref: "#/components/schemas/Syntax"
          description: |
            JSON: the messages' syntax (default mf1). XLIFF (`mf1` only):
            read units from other tools that carry plain text as ICU
            MessageFormat instead of literally.
        state:
          $ref: "#/components/schemas/ReviewState"
          description: |
            The review state of translations the file doesn't state:
            JSON (default needs_review), PO entries without the fuzzy
            flag (default approved). Capped like the file's own states.
        plural_variable: { type: string, maxLength: 64, description: "PO: the count variable of plurals (default `count`)." }
    ImportJobRequest:
      type: object
      required: [format]
      properties:
        project_id:
          $ref: "#/components/schemas/Id"
          description: Required for catalog formats; without it TMX and TBX import tenant-wide.
        format: { $ref: "#/components/schemas/IntegrationFormat" }
        mode: { $ref: "#/components/schemas/ImportMode" }
        file_name: { type: string, maxLength: 255, description: "The file's name, for people." }
        options: { $ref: "#/components/schemas/ImportOptions" }
    IntegrationFile:
      type: object
      required: [size, sha256, content_type]
      properties:
        size: { type: integer, format: int64 }
        sha256: { type: string, pattern: "^[0-9a-f]{64}$" }
        content_type: { type: string }
    ImportCounts:
      type: object
      required: [created, updated, unchanged, conflict, invalid]
      properties:
        created: { type: integer }
        updated: { type: integer }
        unchanged: { type: integer }
        conflict: { type: integer }
        invalid: { type: integer }
    ImportSummary:
      type: object
      required: [created, updated, unchanged, conflict, invalid, by_kind]
      properties:
        created: { type: integer }
        updated: { type: integer }
        unchanged: { type: integer }
        conflict: { type: integer }
        invalid: { type: integer }
        by_kind:
          type: object
          description: The same counts per kind of result (`message`, `translation`, `tm_unit`, `concept`).
          additionalProperties: { $ref: "#/components/schemas/ImportCounts" }
    ImportJob:
      type: object
      required: [id, kind, format, mode, options, state, file_name, summary, total_items, processed_items,
                 cancel_requested, attempts, created_by, created_at, updated_at, expires_at]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        project_id: { $ref: "#/components/schemas/Id" }
        kind: { $ref: "#/components/schemas/IntegrationKind" }
        format: { $ref: "#/components/schemas/IntegrationFormat" }
        mode: { $ref: "#/components/schemas/ImportMode" }
        options: { $ref: "#/components/schemas/ImportOptions" }
        state: { $ref: "#/components/schemas/IntegrationJobState" }
        file_name: { type: string }
        upload_url:
          type: string
          description: Where to `PUT` the file; present while the job is `awaiting_upload`.
        file: { $ref: "#/components/schemas/IntegrationFile" }
        reused_job_id:
          $ref: "#/components/schemas/Id"
          description: The earlier import of the same file and options whose result this job reuses.
        summary: { $ref: "#/components/schemas/ImportSummary" }
        total_items: { type: integer, description: "Entries, units or concepts in the file; 0 until known." }
        processed_items: { type: integer }
        failure_code: { type: string }
        failure_message: { type: string }
        cancel_requested: { type: boolean }
        attempts: { type: integer }
        created_by: { type: string }
        created_at: { $ref: "#/components/schemas/Timestamp" }
        started_at: { $ref: "#/components/schemas/Timestamp" }
        finished_at: { $ref: "#/components/schemas/Timestamp" }
        updated_at: { $ref: "#/components/schemas/Timestamp" }
        expires_at:
          $ref: "#/components/schemas/Timestamp"
          description: When retention deletes the uploaded file (the job and its results stay).
        files_deleted_at: { $ref: "#/components/schemas/Timestamp" }
    ImportJobList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/ImportJob" }
        next_page_token: { type: string }
    ImportResultKind:
      type: string
      enum: [message, translation, tm_unit, concept]
    ImportResultStatus:
      type: string
      enum: [created, updated, unchanged, conflict, invalid]
    ImportResult:
      type: object
      required: [seq, kind, key, status]
      properties:
        seq: { type: integer, description: Position in the job's results (file order). }
        kind: { $ref: "#/components/schemas/ImportResultKind" }
        key: { type: string, description: "The message key, the TMX unit's `tuid` or the TBX concept's id." }
        locale: { $ref: "#/components/schemas/Locale" }
        status: { $ref: "#/components/schemas/ImportResultStatus" }
        code: { type: string, description: Why a result is a conflict or invalid. }
        detail: { type: string }
        line:
          type: integer
          description: |
            Where the item is in the file (1-based): the XLIFF `<unit>` or
            `<target>`, the JSON member, the PO `msgid`/`msgctxt` or
            `msgstr`, the TMX `<tuv>`, the TBX concept entry — for every
            item of a file, not only the problem that fails it.
        column: { type: integer, description: "The byte column on that line (1-based)." }
        ref:
          type: string
          description: |
            The item in the format's own terms: an XLIFF 2 fragment
            identifier (`#/f=checkout/u=pay`), a JSON pointer
            (`/checkout/pay`), a PO entry's `msgctxt` and `msgid`
            (`msgctxt "menu" msgid "Open"`), a TMX `tu[12]` or TBX
            `conceptEntry[3]` by its place in the file.
    ImportResultList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/ImportResult" }
        next_page_token: { type: string }
    ExportOptions:
      type: object
      description: |
        What is written; options a format doesn't take are refused
        (`invalid_options`).
      properties:
        locales:
          type: array
          maxItems: 50
          items: { $ref: "#/components/schemas/Locale" }
          description: |
            Catalogs: one file per locale (XLIFF targets; JSON any locale,
            default the source). TMX: keep units with these targets.
        source_locale:
          $ref: "#/components/schemas/Locale"
          description: "TMX: keep units with this source locale."
        namespaces:
          type: array
          maxItems: 100
          items: { type: string, maxLength: 64 }
          description: "Catalogs: only these namespaces (default all)."
        states:
          type: array
          items: { $ref: "#/components/schemas/ReviewState" }
          description: "Catalogs: translations in these review states (default approved)."
        layout: { type: string, enum: [flat, nested], description: "JSON: default flat." }
        syntax: { $ref: "#/components/schemas/Syntax" }
    ExportJobRequest:
      type: object
      required: [format]
      properties:
        project_id:
          $ref: "#/components/schemas/Id"
          description: Required for catalogs; without it TMX and TBX export the whole tenant's.
        format: { $ref: "#/components/schemas/IntegrationFormat" }
        options: { $ref: "#/components/schemas/ExportOptions" }
    ExportJob:
      type: object
      required: [id, kind, format, options, state, file_name, written, cancel_requested, attempts, created_by,
                 created_at, updated_at, expires_at]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        project_id: { $ref: "#/components/schemas/Id" }
        kind: { $ref: "#/components/schemas/IntegrationKind" }
        format: { $ref: "#/components/schemas/IntegrationFormat" }
        options: { $ref: "#/components/schemas/ExportOptions" }
        state: { $ref: "#/components/schemas/IntegrationJobState" }
        file_name: { type: string, description: "The file's name once written (`shop.de.xlf`, `shop.json.zip`)." }
        file: { $ref: "#/components/schemas/IntegrationFile" }
        download_url:
          type: string
          description: Where to download the file; present while it is kept.
        written: { type: integer, description: "Messages, units or concepts written." }
        failure_code: { type: string }
        failure_message: { type: string }
        cancel_requested: { type: boolean }
        attempts: { type: integer }
        created_by: { type: string }
        created_at: { $ref: "#/components/schemas/Timestamp" }
        started_at: { $ref: "#/components/schemas/Timestamp" }
        finished_at: { $ref: "#/components/schemas/Timestamp" }
        updated_at: { $ref: "#/components/schemas/Timestamp" }
        expires_at:
          $ref: "#/components/schemas/Timestamp"
          description: When retention deletes the file.
        files_deleted_at: { $ref: "#/components/schemas/Timestamp" }
    ExportJobList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/ExportJob" }
        next_page_token: { type: string }
    KnowledgeImportJobRequest:
      type: object
      description: A tenant-wide TMX or TBX import; the route says which.
      properties:
        mode: { $ref: "#/components/schemas/ImportMode" }
        file_name: { type: string, maxLength: 255, description: "The file's name, for people." }
    KnowledgeExportJobRequest:
      type: object
      description: A tenant-wide TMX or TBX export; the route says which.
      properties:
        options:
          $ref: "#/components/schemas/ExportOptions"
          description: "TMX: `locales` (targets) and `source_locale`. TBX takes none."

    # ── github ───────────────────────────────────────────────────────
    WebhookAck:
      type: object
      required: [accepted]
      properties:
        accepted:
          type: boolean
          description: |
            `false` when the delivery id was already in the inbox. The
            answer is `202` either way: a duplicate is a no-op.
    GitHubInstallIntent:
      type: object
      required: [state, install_url, expires_at]
      properties:
        state:
          type: string
          description: |
            The single-use value to carry through GitHub and hand back
            on the callback. Already on `install_url`.
        install_url:
          type: string
          description: Where to send the person to authorize the App.
        expires_at: { $ref: "#/components/schemas/Timestamp" }
    GitHubInstallCallback:
      type: object
      required: [state, installation_id, code]
      properties:
        state:
          type: string
          maxLength: 256
          description: The `state` GitHub handed back.
        installation_id:
          type: integer
          format: int64
          minimum: 1
          description: GitHub's installation number.
        code:
          type: string
          maxLength: 512
          description: |
            GitHub's one-time authorization code. It is redeemed for the
            person's own token, used once to check that they can see the
            installation, and never stored.
        setup_action:
          type: string
          maxLength: 32
          description: |
            GitHub's `setup_action`. `install` means an installation was
            made; `request` means the person could only ask their
            organization for one, and there is nothing to claim yet.
    GitHubInstallationState:
      type: string
      description: |
        `active`; `suspended` when the account suspended the App;
        `revoked` when it was uninstalled on GitHub, which leaves the
        row so Studio can say what happened.
      enum: [active, suspended, revoked]
    GitHubRepository:
      type: object
      required: [repository_id, name, full_name, private, default_branch]
      properties:
        repository_id:
          type: integer
          format: int64
          description: GitHub's numeric id, which a rename does not change.
        name: { type: string }
        full_name:
          type: string
          description: "`owner/name`, a label only."
        private: { type: boolean }
        default_branch: { type: string }
    GitHubInstallation:
      type: object
      required: [id, installation_id, account_login, account_type, state, connected_at, repositories_unavailable]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        installation_id:
          type: integer
          format: int64
          description: GitHub's installation number.
        account_login: { type: string }
        account_type:
          type: string
          enum: [User, Organization]
        state: { $ref: "#/components/schemas/GitHubInstallationState" }
        connected_by: { type: string }
        connected_at: { $ref: "#/components/schemas/Timestamp" }
        repositories:
          type: array
          description: The repositories the App can see through this installation.
          items: { $ref: "#/components/schemas/GitHubRepository" }
        repositories_unavailable:
          type: boolean
          description: |
            GitHub could not be reached for this installation, so
            `repositories` is empty and says nothing about what it
            covers. It is also `true` for a suspended or revoked
            installation, whose repositories GitHub would refuse.
    GitHubInstallationList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/GitHubInstallation" }
        next_page_token: { type: string }
    GitConnection:
      type: object
      required: [id, installation_id, repository_id, repository_name, project_id, application_id, default_branch, path, created_at, version]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        installation_id:
          $ref: "#/components/schemas/Id"
          description: Glossa's installation `id`, not GitHub's number.
        repository_id:
          type: integer
          format: int64
          description: GitHub's numeric repository id.
        repository_name:
          type: string
          description: "`owner/name` as GitHub last reported it; a label, never a key."
        project_id: { $ref: "#/components/schemas/Id" }
        application_id: { $ref: "#/components/schemas/Id" }
        default_branch: { type: string }
        path:
          type: string
          description: |
            The monorepo subdirectory this connection covers, without
            leading or trailing slashes. Empty is the whole repository.
        created_by: { type: string }
        created_at: { $ref: "#/components/schemas/Timestamp" }
        updated_at: { $ref: "#/components/schemas/Timestamp" }
        version:
          type: integer
          description: The `If-Match` value for a change. A connection has no history, so it is always `0`.
    GitConnectionList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/GitConnection" }
        next_page_token: { type: string }
    GitConnectionRequest:
      type: object
      required: [installation_id, repository_id, project_id, application_id]
      properties:
        installation_id:
          $ref: "#/components/schemas/Id"
          description: Glossa's installation `id`.
        repository_id:
          type: integer
          format: int64
          minimum: 1
          description: GitHub's numeric repository id, from the installation's `repositories`.
        project_id: { $ref: "#/components/schemas/Id" }
        application_id: { $ref: "#/components/schemas/Id" }
        default_branch:
          type: string
          maxLength: 255
          description: Left out, GitHub's default branch for the repository is used.
        path:
          type: string
          maxLength: 512
          description: |
            A monorepo subdirectory (`apps/web`). Left out, the
            connection covers the whole repository. One repository can
            feed several projects, one per path.
    GitConnectionChange:
      type: object
      required: [project_id, application_id, default_branch]
      properties:
        project_id: { $ref: "#/components/schemas/Id" }
        application_id: { $ref: "#/components/schemas/Id" }
        default_branch: { type: string, maxLength: 255 }
        path: { type: string, maxLength: 512 }

    # ── context ──────────────────────────────────────────────────────
    ContextSource:
      type: string
      enum: [plugin, extract, runtime, capture]
    UsageKind:
      type: string
      description: |
        The call shape: `t` (t()/$t(), Go's T), `component` (<GlossaText
        id>, <T id>), `element` (<glossa-text key> and its siblings),
        `accessor` (typed accessors from `glossa generate`), `template`
        ({{t}}, {{td}}, {{th}} in Go templates).
      enum: [t, component, element, accessor, template]
    UsagesTool:
      type: object
      required: [name, version]
      properties:
        name: { type: string, maxLength: 214, description: "A package name: `@glossa/unplugin`, `glossa`." }
        version: { type: string, maxLength: 256, description: A semantic version. }
    UsagesDocument:
      type: object
      description: |
        A `glossa.usages/v1` document (RFC 0004 §2.2): one build, one
        application at one commit. Its JSON Schema,
        `runtimes/testdata/schemas/usages.v1.schema.json`, has every rule;
        the ones below are the shape.
      required: [schema, application, commit, branch, tool, usages]
      properties:
        schema: { type: string, enum: [glossa.usages/v1] }
        application:
          type: string
          description: The application's slug in the project.
          pattern: "^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?$"
        commit:
          type: string
          description: The full commit ID in lowercase hex (SHA-1 or SHA-256).
          pattern: "^(?:[0-9a-f]{40}|[0-9a-f]{64})$"
        branch:
          type: string
          description: The short branch name (`feat/checkout-copy`).
          minLength: 1
          maxLength: 255
        tool: { $ref: "#/components/schemas/UsagesTool" }
        usages:
          type: array
          maxItems: 100000
          items: { $ref: "#/components/schemas/UsagesDocumentUsage" }
    UsagesDocumentUsage:
      type: object
      required: [key, file, line, column, kind]
      properties:
        key: { $ref: "#/components/schemas/MessageKey" }
        file:
          type: string
          description: A path relative to the project root, with `/` and no `.` or `..` segments.
          minLength: 1
          maxLength: 1024
        line: { type: integer, minimum: 1 }
        column: { type: integer, minimum: 1, description: "1-based, in Unicode code points." }
        component: { type: string, minLength: 1, maxLength: 512 }
        route: { type: string, maxLength: 1024, description: "A route pattern: `/checkout/[step]`." }
        kind: { $ref: "#/components/schemas/UsageKind" }
    ContextBuild:
      type: object
      description: One upload of usages for one application at one commit.
      required: [id, application_id, commit, branch, on_default_branch, source, tool, digest, usages, unknown_keys,
                 created_by, created_at]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        application_id: { $ref: "#/components/schemas/Id" }
        commit: { type: string }
        branch: { type: string }
        on_default_branch:
          type: boolean
          description: The branch was the project's default branch at upload.
        source: { $ref: "#/components/schemas/ContextSource" }
        tool: { $ref: "#/components/schemas/UsagesTool" }
        digest:
          type: string
          description: SHA-256 (hex) of the document's RFC 8785 canonical form.
        usages: { type: integer, minimum: 0 }
        unknown_keys:
          type: integer
          minimum: 0
          description: Usages whose key the catalog didn't know at upload.
        created_by: { type: string }
        created_at: { $ref: "#/components/schemas/Timestamp" }
    ContextBuildList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/ContextBuild" }
        next_page_token: { type: string }
    ContextUsage:
      type: object
      description: Where a message's key is used, in a build.
      required: [key, file, line, kind, build_id, application_id, commit, branch, on_default_branch, source]
      properties:
        key: { $ref: "#/components/schemas/MessageKey" }
        message_id:
          $ref: "#/components/schemas/Id"
          description: The message the key named at upload; absent for an unknown key.
        file: { type: string }
        line: { type: integer }
        column: { type: integer }
        component: { type: string }
        route: { type: string }
        kind: { $ref: "#/components/schemas/UsageKind" }
        build_id: { $ref: "#/components/schemas/Id" }
        application_id: { $ref: "#/components/schemas/Id" }
        commit: { type: string }
        branch: { type: string }
        on_default_branch: { type: boolean }
        source: { $ref: "#/components/schemas/ContextSource" }
    ContextUsageList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/ContextUsage" }
        next_page_token: { type: string }
    MessageUsages:
      type: object
      required: [message_id, key, usages, truncated]
      properties:
        message_id: { $ref: "#/components/schemas/Id" }
        key: { $ref: "#/components/schemas/MessageKey" }
        usages:
          type: array
          items: { $ref: "#/components/schemas/ContextUsage" }
        truncated:
          type: boolean
          description: More usages exist than `limit`.
    UnusedMessage:
      type: object
      required: [id, key]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        key: { $ref: "#/components/schemas/MessageKey" }
    UnusedMessageList:
      type: object
      required: [items, current_builds, active_messages, unused_messages]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/UnusedMessage" }
        next_page_token: { type: string }
        current_builds:
          type: integer
          minimum: 0
          description: The builds considered; 0 means nothing was uploaded yet.
        active_messages: { type: integer, minimum: 0 }
        unused_messages: { type: integer, minimum: 0 }
    CapturesManifest:
      type: object
      description: |
        A `glossa.captures/v1` manifest (RFC 0004 §3.1–§3.3), the
        `manifest` part of a capture upload: one application at one
        commit, one capture per route, viewport and locale. Its JSON
        Schema, `runtimes/testdata/schemas/captures.v1.schema.json`, has
        every rule and is the published contract, so its member names
        are kept as they are (`deviceScaleFactor`).
      required: [schema, application, commit, branch, tool, captures]
      properties:
        schema: { type: string, enum: [glossa.captures/v1] }
        application:
          type: string
          description: The application's slug in the project.
          pattern: "^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?$"
        commit:
          type: string
          description: The full commit ID in lowercase hex (SHA-1 or SHA-256).
          pattern: "^(?:[0-9a-f]{40}|[0-9a-f]{64})$"
        branch: { type: string, minLength: 1, maxLength: 255, description: The short branch name. }
        tool: { $ref: "#/components/schemas/UsagesTool" }
        captures:
          type: array
          minItems: 1
          maxItems: 500
          items: { $ref: "#/components/schemas/CapturesManifestCapture" }
    CapturesManifestCapture:
      type: object
      required: [route, url, viewport, locale, image, renders, regions]
      properties:
        route: { type: string, maxLength: 1024, description: "The route pattern from the capture plan: `/checkout/[step]`." }
        url: { type: string, maxLength: 2048, description: "The concrete URL navigated to; informational, never fetched." }
        viewport:
          type: object
          required: [width, height]
          properties:
            width: { type: integer, minimum: 1, maximum: 10000 }
            height: { type: integer, minimum: 1, maximum: 10000 }
            deviceScaleFactor: { type: number, exclusiveMinimum: 0, maximum: 4, description: Defaults to 1. }
        locale: { type: string, maxLength: 35, description: The locale the page was rendered in (BCP 47). }
        image:
          type: object
          required: [sha256, width, height]
          properties:
            sha256:
              type: string
              pattern: "^[0-9a-f]{64}$"
              description: Lowercase hex SHA-256 of the uploaded PNG; the name of its part.
            width: { type: integer, minimum: 1, maximum: 65535 }
            height: { type: integer, minimum: 1, maximum: 65535 }
        renders:
          type: array
          description: The session's render log; every region `index` names one entry.
          items: { $ref: "#/components/schemas/CapturesManifestRender" }
        regions:
          type: array
          maxItems: 10000
          items: { $ref: "#/components/schemas/CapturesManifestRegion" }
    CapturesManifestRender:
      type: object
      required: [index, key, locale]
      properties:
        index: { type: integer, minimum: 0 }
        key: { $ref: "#/components/schemas/MessageKey" }
        locale: { type: string, maxLength: 35, description: The locale the message resolved from. }
    CapturesManifestRegion:
      type: object
      description: Where a rendered message is, by `key` (a component's host element) or by `index` into `renders` (a marked t() string); exactly one of them.
      required: [kind, box, visible]
      properties:
        key: { $ref: "#/components/schemas/MessageKey" }
        index: { type: integer, minimum: 0 }
        kind: { $ref: "#/components/schemas/CaptureRegionKind" }
        attribute: { type: string, maxLength: 64, description: "For kind `attribute`: the attribute's name (`placeholder`, `title`, `aria-label`)." }
        box:
          type: object
          description: CSS pixels from the page's top left, fractional as measured.
          required: [x, y, width, height]
          properties:
            x: { type: number }
            y: { type: number }
            width: { type: number, minimum: 0 }
            height: { type: number, minimum: 0 }
        visible: { type: boolean, description: false when the message rendered zero-size or off-screen. }
    CaptureRegionKind:
      type: string
      description: |
        How the box was found: `element` (a component-rendered message:
        its host element), `text` (a marked t() string: its text's
        rects), `attribute` (a message in an attribute: its element).
      enum: [element, text, attribute]
    CaptureUpload:
      type: object
      description: What a capture upload stored.
      required: [build, captures, images_stored, images_deduplicated, unknown_keys]
      properties:
        build: { $ref: "#/components/schemas/ContextBuild" }
        captures: { type: integer, minimum: 0, description: The build's captures. }
        images_stored:
          type: integer
          minimum: 0
          description: Images written to storage (0 on a replay).
        images_deduplicated:
          type: integer
          minimum: 0
          description: Images whose pixels the project had stored already (0 on a replay).
        unknown_keys:
          type: array
          description: The region keys the catalog doesn't know, in order (stored without a message).
          items: { type: string }
    CaptureViewport:
      type: object
      required: [width, height]
      properties:
        width: { type: integer, description: CSS pixels. }
        height: { type: integer, description: CSS pixels. }
    CaptureImage:
      type: object
      required: [digest, width, height, url]
      properties:
        digest: { type: string, description: SHA-256 (hex) of the stored (re-encoded) PNG; its `ETag`. }
        width: { type: integer, description: Pixels. }
        height: { type: integer, description: Pixels. }
        url: { type: string, description: "The image's API path (`getCaptureImage`), relative to the server." }
    CaptureBox:
      type: object
      description: Whole CSS pixels from the page's top left (covering the measured box); off-screen boxes may be negative.
      required: [x, y, width, height]
      properties:
        x: { type: integer }
        y: { type: integer }
        width: { type: integer, minimum: 0 }
        height: { type: integer, minimum: 0 }
    CaptureRegion:
      type: object
      required: [kind, box, visible]
      properties:
        kind: { $ref: "#/components/schemas/CaptureRegionKind" }
        box: { $ref: "#/components/schemas/CaptureBox" }
        visible:
          type: boolean
          description: false when the message rendered zero-size or off-screen.
    MessageCapture:
      type: object
      description: A capture that shows a message, with the message's regions on it.
      required: [id, build_id, application_id, commit, branch, on_default_branch, route, viewport, locale, image,
                 regions, created_at]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        build_id: { $ref: "#/components/schemas/Id" }
        application_id: { $ref: "#/components/schemas/Id" }
        commit: { type: string }
        branch: { type: string }
        on_default_branch: { type: boolean }
        route: { type: string }
        viewport: { $ref: "#/components/schemas/CaptureViewport" }
        locale: { type: string }
        image: { $ref: "#/components/schemas/CaptureImage" }
        regions:
          type: array
          items: { $ref: "#/components/schemas/CaptureRegion" }
        created_at: { $ref: "#/components/schemas/Timestamp" }
    MessageCaptures:
      type: object
      required: [message_id, key, captures, truncated]
      properties:
        message_id: { $ref: "#/components/schemas/Id" }
        key: { $ref: "#/components/schemas/MessageKey" }
        captures:
          type: array
          items: { $ref: "#/components/schemas/MessageCapture" }
        truncated:
          type: boolean
          description: More captures exist than `limit`.

      security:
        - session: []
          csrf: []
        - bearer: []
      responses:
        "200":
          description: The fill.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AIFill" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/tenants/{tenant}/ai-jobs:
    parameters:
      - $ref: "#/components/parameters/TenantPath"
    get:
      operationId: listAIJobs
      tags: [ai-jobs]
      summary: AI translation jobs
      description: |
        Newest first. A job is `queued` → `running` → `succeeded`
        (with a suggestion), `skipped` (the message changed, was
        translated meanwhile or is gone), `failed` (for good:
        `failure_code` says why — `provider_consent`, `sensitive`,
        `invalid_output`, `budget_exceeded`, `no_route`,
        `provider_error`, `invalid_source`), `dead` (transient failures
        exhausted its attempts) or `cancelled`. Needs
        `intelligence.read`.
      security:
        - session: []
        - bearer: []
      parameters:
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/PageToken"
        - { name: project, in: query, required: false, description: A project `id`., schema: { $ref: "#/components/schemas/Id" } }
        - { name: state, in: query, required: false, schema: { $ref: "#/components/schemas/AIJobState" } }
        - { name: locale, in: query, required: false, schema: { $ref: "#/components/schemas/Locale" } }
        - { name: fill, in: query, required: false, description: A fill `id`., schema: { $ref: "#/components/schemas/Id" } }
        - { name: message, in: query, required: false, description: A message `id`., schema: { $ref: "#/components/schemas/Id" } }
      responses:
        "200":
          description: A page of jobs.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AIJobList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/tenants/{tenant}/ai-jobs/{ai_job}:
    parameters:
      - $ref: "#/components/parameters/TenantPath"
      - $ref: "#/components/parameters/AIJobPath"
    get:
      operationId: getAIJob
      tags: [ai-jobs]
      summary: A job with its audit ledger
      description: |
        `audit` is the agent's ledger: every tool result in order — what
        it looked up, what it sent and what came back. Needs
        `intelligence.read`.
      security:
        - session: []
        - bearer: []
      responses:
        "200":
          description: The job.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AIJob" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/tenants/{tenant}/ai-jobs/{ai_job}/cancellation:
    parameters:
      - $ref: "#/components/parameters/TenantPath"
      - $ref: "#/components/parameters/AIJobPath"
    post:
      operationId: cancelAIJob
      tags: [ai-jobs]
      summary: Cancel a queued job
      description: |
        Only queued jobs can be cancelled; cancelling a cancelled job
        changes nothing. Needs `intelligence.translate` for its locale.
        Problem code: `job_not_cancellable` (409).
      security:
        - session: []
          csrf: []
        - bearer: []
      responses:
        "200":
          description: The job.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AIJob" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  # ── AI suggestions ──────────────────────────────────────────────────

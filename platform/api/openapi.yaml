  # ── tenants ─────────────────────────────────────────────────────────
  /v1/tenants:
    get:
      operationId: listTenants
      tags: [tenants]
      summary: Tenants the caller can act in
      description: |
        A person's active memberships; an API token's own tenant.
      security:
        - session: []
        - bearer: []
      parameters:
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/PageToken"
      responses:
        "200":
          description: A page of tenants.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TenantList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
    post:
      operationId: createTenant
      tags: [tenants]
      summary: Create an organization
      description: |
        The caller becomes its owner. Only people create organizations.
        Problem codes: `slug_taken` (409).
      security:
        - session: []
          csrf: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateTenant" }
      responses:
        "201":
          description: The organization.
          headers:
            Location: { $ref: "#/components/headers/Location" }
            Idempotent-Replayed: { $ref: "#/components/headers/IdempotentReplayed" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Tenant" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /v1/tenants/{tenant}:
    parameters:
      - $ref: "#/components/parameters/TenantPath"
    get:
      operationId: getTenant
      tags: [tenants]
      summary: A tenant
      description: Needs `tenant.read`.
      security:
        - session: []
        - bearer: []
      responses:
        "200":
          description: The tenant.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Tenant" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }

  # ── members ─────────────────────────────────────────────────────────
  /v1/tenants/{tenant}/members:
    parameters:
      - $ref: "#/components/parameters/TenantPath"
    get:
      operationId: listMembers
      tags: [members]
      summary: Members and open invitations
      description: Needs `members.read`.
      security:
        - session: []
        - bearer: []
      parameters:
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/PageToken"
      responses:
        "200":
          description: A page of members.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MemberList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: addMember
      tags: [members]
      summary: Invite someone by email
      description: |
        Opens an invitation that becomes an active membership when the
        address's owner signs in. Needs `members.manage`; the `owner`
        role needs `owners.manage`. Problem codes: `already_member`
        (409), `individual_tenant` (409), `owner_change_forbidden`

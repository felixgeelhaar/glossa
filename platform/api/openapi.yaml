      responses:
        "204": { description: Removed. }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "412": { $ref: "#/components/responses/PreconditionFailed" }

  # ── tokens ──────────────────────────────────────────────────────────
  /v1/tenants/{tenant}/tokens:
    parameters:
      - $ref: "#/components/parameters/TenantPath"
    get:
      operationId: listTokens
      tags: [tokens]
      summary: API tokens, including revoked ones
      description: Needs `tokens.read`.
      security:
        - session: []
        - bearer: []
      parameters:
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/PageToken"
      responses:
        "200":
          description: A page of tokens.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: createToken
      tags: [tokens]
      summary: Create an API token
      description: |
        The response is the only time the secret is shown. A token's
        scopes can't exceed what its creator may do. Needs
        `tokens.manage`. Problem codes: `scope_exceeds_grant` (403).
      security:
        - session: []
          csrf: []
        - bearer: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateToken" }
      responses:
        "201":
          description: |
            The token and its secret. A replayed request returns the token
            without `secret`.
          headers:
            Location: { $ref: "#/components/headers/Location" }
            Idempotent-Replayed: { $ref: "#/components/headers/IdempotentReplayed" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreatedToken" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /v1/tenants/{tenant}/tokens/{token}:
    parameters:
      - $ref: "#/components/parameters/TenantPath"
      - $ref: "#/components/parameters/TokenPath"
    get:
      operationId: getToken
      tags: [tokens]
      summary: An API token (never its secret)
      description: Needs `tokens.read`.
      security:
        - session: []
        - bearer: []
      responses:
        "200":
          description: The token.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Token" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: revokeToken
      tags: [tokens]
      summary: Revoke an API token
      description: |
        The token stops working at once and stays listed as revoked.
        Needs `tokens.manage`. Problem codes: `token_revoked` (409).
      security:
        - session: []
          csrf: []
        - bearer: []
      responses:
        "204": { description: Revoked. }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  # ── projects ────────────────────────────────────────────────────────
  /v1/tenants/{tenant}/projects:

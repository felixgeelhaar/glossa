  # ── locales ─────────────────────────────────────────────────────────
  /v1/tenants/{tenant}/projects/{project}/locales:
    parameters:
      - $ref: "#/components/parameters/TenantPath"
      - $ref: "#/components/parameters/ProjectPath"
    get:
      operationId: listLocales
      tags: [locales]
      summary: A project's locales, the source locale included
      description: Needs `translations.read`.
      security:
        - session: []
        - bearer: []
      parameters:
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/PageToken"
      responses:
        "200":
          description: A page of locales, by code.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LocaleList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      operationId: addLocale
      tags: [locales]
      summary: Add a locale to a project
      description: |
        The code is canonicalized (`de_de` → `de-DE`); extensions and
        private use are refused. Adding an existing locale returns it
        with `200`. Needs `catalog.write`. Problem codes: `invalid_locale`
        (400).
      x-glossa-idempotency: A locale's identity is its canonical code within the project, so repeating the request returns the same locale.
      security:
        - session: []
          csrf: []
        - bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AddLocale" }
      responses:
        "200":
          description: The locale already existed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectLocale" }
        "201":
          description: The locale.
          headers:
            Location: { $ref: "#/components/headers/Location" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectLocale" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/tenants/{tenant}/projects/{project}/locales/{locale}:
    parameters:
      - $ref: "#/components/parameters/TenantPath"
      - $ref: "#/components/parameters/ProjectPath"
      - $ref: "#/components/parameters/LocalePath"
    get:
      operationId: getLocale
      tags: [locales]
      summary: A locale of a project
      description: "Needs `translations.read`. Problem codes: `locale_not_found` (404)."
      security:
        - session: []
        - bearer: []
      responses:
        "200":
          description: The locale.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectLocale" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: removeLocale
      tags: [locales]
      summary: Remove a locale from a project
      description: |
        Its translations and their history are kept and come back if the
        locale is added again. Needs `catalog.write`. Problem codes:
        `source_locale` (409), `locale_in_fallback` (409, remove it from
        the fallback graph first), `locale_not_found` (404).
      security:
        - session: []
          csrf: []
        - bearer: []
      responses:
        "204": { description: Removed. }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/tenants/{tenant}/projects/{project}/fallback-graph:
    parameters:
      - $ref: "#/components/parameters/TenantPath"
      - $ref: "#/components/parameters/ProjectPath"
    get:
      operationId: getFallbackGraph
      tags: [locales]
      summary: A project's fallback graph
      description: |
        Exactly the `fallback` member releases publish
        (runtimes/SPEC.md §1.1). Empty until set. Needs
        `translations.read`.
      security:
        - session: []
        - bearer: []
      responses:
        "200":
          description: The fallback graph.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FallbackGraph" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      operationId: putFallbackGraph
      tags: [locales]
      summary: Replace a project's fallback graph
      description: |
        Keys are project locales or `*` (every locale without its own
        entry); chains name project locales, in order. Cycles are
        refused. The first write takes no `If-Match`; later ones need the
        current `ETag` (`428` without it). Needs `catalog.write`. Problem
        codes (400): `fallback_unknown_locale`, `fallback_self_reference`,
        `fallback_duplicate`, `fallback_cycle`, `fallback_invalid_locale`.
      security:
        - session: []
          csrf: []
        - bearer: []
      parameters:
        - $ref: "#/components/parameters/IfMatchOptional"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PutFallbackGraph" }
      responses:
        "200":
          description: The fallback graph.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FallbackGraph" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "412": { $ref: "#/components/responses/PreconditionFailed" }
        "428": { $ref: "#/components/responses/PreconditionRequired" }

  # ── translations ────────────────────────────────────────────────────
  /v1/tenants/{tenant}/projects/{project}/messages/{message}/translations:
    parameters:
      - $ref: "#/components/parameters/TenantPath"
      - $ref: "#/components/parameters/ProjectPath"
      - $ref: "#/components/parameters/MessagePath"
    get:
      operationId: listMessageTranslations
      tags: [translations]
      summary: A message's translations, by locale
      description: Needs `translations.read`.
      security:
        - session: []
        - bearer: []
      parameters:
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/PageToken"
      responses:
        "200":
          description: A page of translations.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TranslationList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/tenants/{tenant}/projects/{project}/messages/{message}/translations/{locale}:
    parameters:
      - $ref: "#/components/parameters/TenantPath"
      - $ref: "#/components/parameters/ProjectPath"
      - $ref: "#/components/parameters/MessagePath"
      - $ref: "#/components/parameters/LocalePath"
    get:
      operationId: getTranslation
      tags: [translations]
      summary: A message's translation in a locale
      description: Needs `translations.read`.
      security:
        - session: []
        - bearer: []
      responses:
        "200":
          description: The translation.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Translation" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      operationId: putTranslation
      tags: [translations]
      summary: Write a message's translation in a locale
      description: |
        Parses the text for the locale, checks it structurally against
        the source revision it was made from (`source_revision`, default
        the current one) and appends a revision with provenance
        (`origin`, default `human`, and `origin_detail`). Error findings
        reject the write with `422 structural_qa_failed` and the
        `findings`; warnings are stored and returned. New text gets the
        project's review policy (`needs_review` when review is required,
        else `approved`) unless `state` asks otherwise; approving needs
        `translations.review` for the locale. Unchanged text is no new
        revision. Creating takes no `If-Match`; changing needs the
        current `ETag` (`428` without it). Needs `translations.write` for
        the locale. Problem codes: `locale_not_found` (404),
        `source_locale` (409), `invalid_message`, `invalid_state`,
        `invalid_origin`, `invalid_origin_detail`,
        `invalid_source_revision`, `write_cannot_reject` (400),
        `review_forbidden` (403), `translation_conflict` (409).
      security:
        - session: []
          csrf: []
        - bearer: []
      parameters:
        - $ref: "#/components/parameters/IfMatchOptional"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PutTranslation" }
      responses:
        "200":
          description: The revised (or unchanged) translation.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Translation" }
        "201":
          description: The new translation.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
            Location: { $ref: "#/components/headers/Location" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Translation" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "412": { $ref: "#/components/responses/PreconditionFailed" }
        "422": { $ref: "#/components/responses/StructuralQAFailed" }
        "428": { $ref: "#/components/responses/PreconditionRequired" }

  /v1/tenants/{tenant}/projects/{project}/messages/{message}/translations/{locale}/revisions:
    parameters:
      - $ref: "#/components/parameters/TenantPath"
      - $ref: "#/components/parameters/ProjectPath"
      - $ref: "#/components/parameters/MessagePath"
      - $ref: "#/components/parameters/LocalePath"
    get:
      operationId: listTranslationRevisions
      tags: [translations]
      summary: A translation's history with provenance, newest first
      description: Needs `translations.read`.
      security:
        - session: []
        - bearer: []
      parameters:
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/PageToken"
      responses:
        "200":
          description: A page of revisions.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TranslationRevisionList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/tenants/{tenant}/projects/{project}/messages/{message}/translations/{locale}/reviews:
    parameters:
      - $ref: "#/components/parameters/TenantPath"
      - $ref: "#/components/parameters/ProjectPath"
      - $ref: "#/components/parameters/MessagePath"
      - $ref: "#/components/parameters/LocalePath"
    post:
      operationId: reviewTranslation
      tags: [translations]
      summary: Record a review decision
      description: |
        Moves the translation to `state` and appends a `review` revision
        naming the reviewer; the text and its provenance stay. Approving
        and rejecting need `translations.review` for the locale, other
        states `translations.write`. Problem codes: `review_forbidden`
        (403), `invalid_transition` (409), `invalid_state` (400).
      security:
        - session: []
          csrf: []
        - bearer: []
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReviewTranslation" }
      responses:
        "200":
          description: The reviewed translation.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Translation" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "412": { $ref: "#/components/responses/PreconditionFailed" }
        "428": { $ref: "#/components/responses/PreconditionRequired" }

  /v1/tenants/{tenant}/projects/{project}/translations:
    parameters:
      - $ref: "#/components/parameters/TenantPath"
      - $ref: "#/components/parameters/ProjectPath"
    get:
      operationId: listProjectTranslations
      tags: [translations]
      summary: A project's translations in one or more locales, by key
      description: |
        Every translation in the given locales (`locale`, repeatable, 1
        to 20), across messages, ordered by message key and then locale,
        with the message's `key`, `namespace` and `message_state`, the
        `source_revision` it was made against and the derived `outdated`.
        Filters combine: `state` (repeatable review states), `outdated`,
        `namespace`, `key_prefix` and `message_state`. Locales the
        project no longer has list nothing. Keys and namespaces come
        from Localization's view of the catalog, current once Catalog's
        events are processed (usually within a second). One query per
        page. Needs `translations.read`. Problem codes: `invalid_locale`,
        `too_many_locales`, `invalid_state`, `invalid_message_state`
        (400).
      security:
        - session: []
        - bearer: []
      parameters:
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/PageToken"
        - name: locale
          in: query
          required: true
          description: A locale to list; repeat for several (`locale=de&locale=fr`).
          style: form
          explode: true
          schema:
            type: array
            minItems: 1
            maxItems: 20
            items: { $ref: "#/components/schemas/Locale" }
        - name: state
          in: query
          required: false
          description: Only translations in these review states; repeatable.
          style: form
          explode: true
          schema:
            type: array
            maxItems: 4
            items: { $ref: "#/components/schemas/ReviewState" }
        - name: outdated
          in: query
          required: false
          description: "`true`: only outdated translations; `false`: only current ones."
          schema: { type: boolean }
        - name: namespace
          in: query
          required: false
          schema: { $ref: "#/components/schemas/Namespace" }
        - name: key_prefix
          in: query
          required: false
          description: Keys starting with this, e.g. `checkout.`.
          schema: { type: string, maxLength: 200 }
        - name: message_state
          in: query
          required: false
          description: Only translations of `active` (or `obsolete`) messages.
          schema: { $ref: "#/components/schemas/MessageState" }
      responses:
        "200":
          description: A page of translations.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectTranslationList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/tenants/{tenant}/projects/{project}/translation-stats:
    parameters:
      - $ref: "#/components/parameters/TenantPath"
      - $ref: "#/components/parameters/ProjectPath"
    get:
      operationId: getTranslationStats
      tags: [translations]
      summary: Per-locale status of a project's translations
      description: |
        For every locale of the project (the source included, by code):
        how many of its active messages are translated (a usable — not
        rejected — translation exists), missing (none, or rejected) and
        outdated (usable but made against an older source revision), and
        its translations of active messages per review state. The source
        locale counts every active message as translated and approved.
        Computed in one query on each request, from Localization's view
        of the catalog. Needs `translations.read`.
      security:
        - session: []
        - bearer: []
      responses:
        "200":
          description: The summary.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TranslationStats" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/tenants/{tenant}/projects/{project}/translation-imports:
    parameters:
      - $ref: "#/components/parameters/TenantPath"
      - $ref: "#/components/parameters/ProjectPath"
    post:
      operationId: importTranslations
      tags: [translations]
      summary: Import translations in bulk
      description: |
        Up to 500 translations by message key and locale, written with
        provenance `import` (put the job and source system in
        `origin_detail`) in one transaction. Re-importing unchanged text
        is `unchanged`. Items fail on their own (`results[].error.code`:
        `message_not_found`, `locale_not_found`, `invalid_locale`,
        `forbidden` for a locale outside the caller's scope,
        `source_locale`, `structural_qa_failed` with `findings`,
        `invalid_message`, `review_forbidden`, `duplicate_item`, …)
        without failing the batch. Needs `translations.write` per
        locale. Problem codes: `too_many_items` (400).
      security:
        - session: []
          csrf: []
        - bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TranslationImport" }
      responses:
        "200":
          description: One result per item, in request order.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TranslationImportResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ── environments ────────────────────────────────────────────────────
  /v1/tenants/{tenant}/projects/{project}/environments:
    parameters:
      - $ref: "#/components/parameters/TenantPath"
      - $ref: "#/components/parameters/ProjectPath"
    get:
      operationId: listEnvironments
      tags: [environments]
      summary: Environments of a project
      description: |
        By name. Every project has `development`, `preview`, `staging`
        and `production`; they are created on first use. Needs
        `releases.read`.
      security:
        - session: []
        - bearer: []
      parameters:
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/PageToken"
      responses:
        "200":
          description: A page of environments.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnvironmentList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      operationId: createEnvironment
      tags: [environments]
      summary: Add a custom environment
      description: |
        A branch preview, a QA stage. Without `policy` it ships
        everything not rejected. Needs `releases.publish`. Problem codes:
        `environment_exists` (409), `invalid_environment`,
        `invalid_policy` (400).
      x-glossa-idempotency: The name is the environment's identity; a retry answers 409 environment_exists.
      security:
        - session: []
          csrf: []
        - bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateEnvironment" }
      responses:
        "201":
          description: The environment.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
            Location: { $ref: "#/components/headers/Location" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Environment" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/tenants/{tenant}/projects/{project}/environments/{environment}:
    parameters:
      - $ref: "#/components/parameters/TenantPath"
      - $ref: "#/components/parameters/ProjectPath"
      - $ref: "#/components/parameters/EnvironmentPath"
    get:
      operationId: getEnvironment
      tags: [environments]
      summary: An environment, its policy and the release it serves
      description: Needs `releases.read`.
      security:
        - session: []
        - bearer: []
      responses:
        "200":
          description: The environment.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Environment" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      operationId: updateEnvironment
      tags: [environments]
      summary: Change an environment's eligibility policy
      description: |
        The policy decides what the next publish ships and which
        releases may be promoted here; the release served keeps serving.
        Needs `releases.publish`. Problem codes: `invalid_policy` (400).
      security:
        - session: []
          csrf: []
        - bearer: []
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateEnvironment" }
      responses:
        "200":
          description: The updated environment.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Environment" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "412": { $ref: "#/components/responses/PreconditionFailed" }
        "428": { $ref: "#/components/responses/PreconditionRequired" }

  /v1/tenants/{tenant}/projects/{project}/environments/{environment}/promotions:
    parameters:
      - $ref: "#/components/parameters/TenantPath"
      - $ref: "#/components/parameters/ProjectPath"
      - $ref: "#/components/parameters/EnvironmentPath"
    post:
      operationId: promoteRelease
      tags: [environments]
      summary: Point the environment at an existing release
      description: |
        Moves the pointer; nothing is rebuilt. The environment's policy
        must cover the policy the release was built under, so a preview
        release with drafts can't reach production. Promoting the
        release already served changes nothing, so a retry is safe.
        Needs `releases.publish`. Problem codes: `release_not_found`
        (404), `release_ineligible` (409), `storage_unavailable` (503).
      security:
        - session: []
          csrf: []
        - bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Promotion" }
      responses:
        "200":
          description: The environment, now serving the release.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Environment" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/tenants/{tenant}/projects/{project}/environments/{environment}/rollbacks:
    parameters:
      - $ref: "#/components/parameters/TenantPath"
      - $ref: "#/components/parameters/ProjectPath"
      - $ref: "#/components/parameters/EnvironmentPath"
    post:
      operationId: rollbackEnvironment
      tags: [environments]
      summary: Point the environment back at a release it served before
      description: |
        Without `release_id`, the newest release the environment served
        that is older than the current one: rolling back twice goes two
        steps back, so send `release_id` when a retry must not. Moves
        the pointer only. Needs `releases.publish`. Problem codes:
        `release_not_found` (404), `no_rollback_target`,
        `not_in_history` (409).
      security:
        - session: []
          csrf: []
        - bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Rollback" }
      responses:
        "200":
          description: The environment, now serving the earlier release.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Environment" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/tenants/{tenant}/projects/{project}/environments/{environment}/deployments:
    parameters:
      - $ref: "#/components/parameters/TenantPath"
      - $ref: "#/components/parameters/ProjectPath"
      - $ref: "#/components/parameters/EnvironmentPath"
    get:
      operationId: listDeployments
      tags: [environments]
      summary: The environment's history of pointer moves
      description: Newest first. Needs `releases.read`.
      security:
        - session: []
        - bearer: []
      parameters:
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/PageToken"
      responses:
        "200":
          description: A page of deployments.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeploymentList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ── releases ────────────────────────────────────────────────────────
  /v1/tenants/{tenant}/projects/{project}/releases:
    parameters:
      - $ref: "#/components/parameters/TenantPath"
      - $ref: "#/components/parameters/ProjectPath"
    get:
      operationId: listReleases
      tags: [releases]
      summary: Releases of a project
      description: Newest first. Needs `releases.read`.
      security:
        - session: []
        - bearer: []
      parameters:
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/PageToken"
      responses:
        "200":
          description: A page of releases.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReleaseList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      operationId: publishRelease
      tags: [releases]
      summary: Publish a release to an environment
      description: |
        Builds one artifact per locale and namespace from the active
        messages and the translations the environment's policy makes
        eligible, stores the ones storage doesn't have yet, records the
        immutable release and points the environment at it; the edge
        serves it within seconds. Publishing an unchanged catalog
        uploads nothing. Needs `releases.publish`. Problem codes:
        `invalid_environment`, `invalid_note` (400),
        `not_releasable` (422), `storage_unavailable` (503).
      security:
        - session: []
          csrf: []
        - bearer: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PublishRelease" }
      responses:
        "201":
          description: The release.
          headers:
            Location: { $ref: "#/components/headers/Location" }
            Idempotent-Replayed: { $ref: "#/components/headers/IdempotentReplayed" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Release" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /v1/tenants/{tenant}/projects/{project}/releases/{release}:
    parameters:
      - $ref: "#/components/parameters/TenantPath"
      - $ref: "#/components/parameters/ProjectPath"
      - $ref: "#/components/parameters/ReleasePath"
    get:
      operationId: getRelease
      tags: [releases]
      summary: A release, its counts and manifest digest
      description: Needs `releases.read`.
      security:
        - session: []
        - bearer: []
      responses:
        "200":
          description: The release.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Release" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/tenants/{tenant}/projects/{project}/releases/{release}/diff:
    parameters:
      - $ref: "#/components/parameters/TenantPath"
      - $ref: "#/components/parameters/ProjectPath"
      - $ref: "#/components/parameters/ReleasePath"
    get:
      operationId: getReleaseDiff
      tags: [releases]
      summary: What changed since another release, per locale
      description: |
        Message IDs added, changed and removed in each locale, compared
        with `base` (default: the release's parent, what its environment
        served before it; without one, everything is added). Needs
        `releases.read`. Problem codes: `release_not_found` (404),
        `storage_unavailable` (503).
      security:
        - session: []
        - bearer: []
      parameters:
        - name: base
          in: query
          required: false
          description: The release `id` to compare with.
          schema: { $ref: "#/components/schemas/Id" }
      responses:
        "200":
          description: The diff.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReleaseDiff" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /v1/tenants/{tenant}/projects/{project}/releases/{release}/manifest:
    parameters:
      - $ref: "#/components/parameters/TenantPath"
      - $ref: "#/components/parameters/ProjectPath"
      - $ref: "#/components/parameters/ReleasePath"
    get:
      operationId: getReleaseManifest
      tags: [releases]
      summary: The signed manifest of a release for an environment
      description: |
        Byte for byte what glossa-edge serves when `environment` serves
        this release (runtimes/SPEC.md §1.1): what `glossa pull
        --release` writes as a bundle's `manifest.json`. Needs
        `releases.read`.
      security:
        - session: []
        - bearer: []
      parameters:
        - name: environment
          in: query
          required: true
          schema: { type: string, pattern: "^[a-z0-9][a-z0-9-]{0,62}$" }
      responses:
        "200":
          description: The manifest (`glossa.manifest/v1`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReleaseManifest" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/tenants/{tenant}/projects/{project}/releases/{release}/artifacts/{digest}:
    parameters:
      - $ref: "#/components/parameters/TenantPath"
      - $ref: "#/components/parameters/ProjectPath"
      - $ref: "#/components/parameters/ReleasePath"
      - name: digest
        in: path
        required: true
        description: The artifact's SHA-256, as the manifest names it.
        schema: { type: string, pattern: "^[0-9a-f]{64}$" }
    get:
      operationId: getReleaseArtifact
      tags: [releases]
      summary: One artifact of a release, as stored
      description: |
        The exact bytes the manifest's `sha256` covers
        (runtimes/SPEC.md §1.2), for bundling
        (`glossa pull --release` writes `a/<sha256>.json`). Needs
        `releases.read`. Problem codes: `storage_unavailable` (503).
      security:
        - session: []
        - bearer: []
      responses:
        "200":
          description: The artifact (`glossa.artifact/v1`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReleaseArtifact" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /v1/tenants/{tenant}/projects/{project}/release-signing-keys:
    parameters:
      - $ref: "#/components/parameters/TenantPath"
      - $ref: "#/components/parameters/ProjectPath"
    get:
      operationId: listReleaseSigningKeys
      tags: [releases]
      summary: The public keys manifests are signed with
      description: |
        Configure runtimes with these (runtimes/SPEC.md §1.3). Active
        keys sign every new manifest; retired ones are still listed
        while runtimes may hold manifests only they signed. Rotation:
        a new key is added (manifests carry both signatures), runtimes
        move to it, the old one is retired. Needs `releases.read`.
      security:
        - session: []
        - bearer: []
      responses:
        "200":
          description: The keys, active first.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SigningKeys" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ── delivery keys ───────────────────────────────────────────────────
  /v1/tenants/{tenant}/projects/{project}/delivery-keys:
    parameters:
      - $ref: "#/components/parameters/TenantPath"
      - $ref: "#/components/parameters/ProjectPath"
    get:
      operationId: listDeliveryKeys
      tags: [delivery-keys]
      summary: Publishable delivery keys, including revoked ones
      description: Needs `releases.read`.
      security:
        - session: []
        - bearer: []
      parameters:
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/PageToken"
      responses:
        "200":
          description: A page of keys.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeliveryKeyList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      operationId: createDeliveryKey
      tags: [delivery-keys]
      summary: Create a publishable delivery key
      description: |
        The key runtimes fetch releases from glossa-edge with
        (`/v1/{key}/{environment}/manifest.json`). It is public by
        design — it ships in browser bundles — scoped to this project,
        read-only, and grants nothing on this API. Needs
        `releases.publish`. Problem codes: `invalid_key_name` (400).
      security:
        - session: []
          csrf: []
        - bearer: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateDeliveryKey" }
      responses:
        "201":
          description: The key.
          headers:
            Location: { $ref: "#/components/headers/Location" }
            Idempotent-Replayed: { $ref: "#/components/headers/IdempotentReplayed" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeliveryKey" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /v1/tenants/{tenant}/projects/{project}/delivery-keys/{delivery_key}:
    parameters:
      - $ref: "#/components/parameters/TenantPath"
      - $ref: "#/components/parameters/ProjectPath"
      - $ref: "#/components/parameters/DeliveryKeyPath"
    delete:
      operationId: revokeDeliveryKey
      tags: [delivery-keys]
      summary: Revoke a delivery key
      description: |
        The edge answers 404 for it within its key cache TTL (30 s by
        default) plus any CDN max-age. It stays listed as revoked.
        Needs `releases.publish`. Problem codes: `key_revoked` (409).
      security:
        - session: []
          csrf: []
        - bearer: []
      responses:
        "204": { description: Revoked. }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: __Host-glossa_session
      description: |
        Session cookie set by the sign-in operations: HttpOnly, Secure,
        SameSite=Lax, Path=/. Revocable server-side.
    csrf:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: |
        Required with the session cookie on unsafe methods. Its value is
        the `csrf_token` of the session.
    bearer:
      type: http
      scheme: bearer
      bearerFormat: glossa_api_…
      description: |
        A tenant API token, `glossa_api_` followed by 43 base64url
        characters. Acts only in its own tenant, within its scopes.

  parameters:
    TenantPath:
      name: tenant
      in: path
      required: true
      description: A tenant `id`.
      schema: { $ref: "#/components/schemas/Id" }
    MemberPath:
      name: member
      in: path
      required: true
      description: A member `id`.
      schema: { $ref: "#/components/schemas/Id" }
    TokenPath:
      name: token
      in: path
      required: true
      description: An API token `id` (never its secret).
      schema: { $ref: "#/components/schemas/Id" }
    ProjectPath:
      name: project
      in: path
      required: true
      description: A project `id`.
      schema: { $ref: "#/components/schemas/Id" }
    ApplicationPath:
      name: application
      in: path
      required: true
      description: An application `id`.
      schema: { $ref: "#/components/schemas/Id" }
    MessagePath:
      name: message
      in: path
      required: true
      description: A message `key` (`checkout.pay`). Keys are URL-safe as they are.
      schema: { $ref: "#/components/schemas/MessageKey" }
    LocalePath:
      name: locale
      in: path
      required: true
      description: A locale code; canonicalized before use.
      schema: { $ref: "#/components/schemas/Locale" }
    EnvironmentPath:
      name: environment
      in: path
      required: true
      description: An environment `name`.
      schema: { $ref: "#/components/schemas/EnvironmentName" }
    ReleasePath:
      name: release
      in: path
      required: true
      description: A release `id`.
      schema: { $ref: "#/components/schemas/Id" }
    PasskeyPath:
      name: passkey
      in: path
      required: true
      description: A passkey `id` (its credential ID, base64url).
      schema: { type: string, minLength: 1, maxLength: 1400, pattern: "^[A-Za-z0-9_-]+$" }
    DeliveryKeyPath:
      name: delivery_key
      in: path
      required: true
      description: A delivery key `id` (not the key itself).
      schema: { $ref: "#/components/schemas/Id" }
    PageSize:
      name: page_size
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
    PageToken:
      name: page_token
      in: query
      required: false
      description: The `next_page_token` of the previous page.
      schema: { type: string, maxLength: 512 }
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: The `ETag` the change is based on.
      schema: { type: string, maxLength: 64 }
    IfMatchOptional:
      name: If-Match
      in: header
      required: false
      description: When sent, the `ETag` the change is based on.
      schema: { type: string, maxLength: 64 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema: { type: string, minLength: 1, maxLength: 255, pattern: "^[\\x21-\\x7E]+$" }
    CeremonyCookie:
      name: __Host-glossa_webauthn
      in: cookie
      required: false
      description: WebAuthn ceremony state set by the matching challenge operation.
      schema: { type: string, maxLength: 8192 }

  headers:
    ETag:
      description: Opaque version of the resource, for `If-Match`.
      schema: { type: string }
    Location:
      description: URL of the created resource.
      schema: { type: string }
    IdempotentReplayed:
      description: "`true` when this response replays an earlier request with the same `Idempotency-Key`."
      schema: { type: string, enum: ["true"] }
    SessionCookie:
      description: "`__Host-glossa_session=…; Path=/; HttpOnly; Secure; SameSite=Lax`"
      schema: { type: string }
    ClearedSessionCookie:
      description: Expires the session cookie.
      schema: { type: string }
    CeremonyCookie:
      description: "`__Host-glossa_webauthn=…; Path=/; HttpOnly; Secure; SameSite=Strict; Max-Age=300`"
      schema: { type: string }

  responses:
    SessionStarted:
      description: Signed in. The session cookie is set.
      headers:
        Set-Cookie: { $ref: "#/components/headers/SessionCookie" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Session" }
    BadRequest:
      description: The request is malformed or invalid.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Unauthenticated:
      description: No valid credentials.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Forbidden:
      description: Authenticated, but not allowed (or missing the CSRF token).
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    NotFound:
      description: No such resource in this tenant.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Conflict:
      description: The request conflicts with the resource's state.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    PreconditionFailed:
      description: "`If-Match` doesn't match the current `ETag`."
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    PreconditionRequired:
      description: "`If-Match` is required."
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    UnprocessableEntity:
      description: The `Idempotency-Key` was used for a different request.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    TooManyRequests:
      description: Slow down.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Unavailable:
      description: A dependency (object storage) is unavailable; retry.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    StructuralQAFailed:
      description: |
        `structural_qa_failed`: the translation is structurally
        incompatible with its source (`findings`, errors first).
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/QAProblem" }

  schemas:
    Id:
      type: string
      description: An opaque identifier.
      minLength: 1
      maxLength: 64
    Timestamp:
      type: string
      format: date-time
      description: RFC 3339, UTC.
    Email:
      type: string
      format: email
      maxLength: 254
    Locale:
      type: string
      description: |
        A BCP 47 language tag. Stored and returned canonicalized
        (`en_us` → `en-US`, `iw` → `he`).
      minLength: 2
      maxLength: 64
      examples: [de, pt-BR, zh-Hant-TW]
    Role:
      type: string
      enum: [owner, admin, developer, translator, reviewer]
      description: |
        `owner` everything; `admin` everything except owner changes;
        `developer` catalog, translations, releases, tokens;
        `translator` translates; `reviewer` translates and reviews.
        Translators and reviewers can be limited to `locales`.
    Scope:
      type: string
      enum: [read, write, publish, admin]
      description: |
        `read` reads the tenant; `write` pushes messages and
        translations; `publish` creates releases; `admin` manages the
        tenant, members and tokens (never owners). Every scope implies
        `read`.
    Problem:
      type: object
      description: RFC 9457 problem details.
      required: [type, title, status, code]
      properties:
        type: { type: string, format: uri, examples: ["urn:glossa:problem:slug_taken"] }
        title: { type: string }
        status: { type: integer }
        code: { type: string, pattern: "^[a-z][a-z0-9_]*$", description: Stable machine-readable code. }
        detail: { type: string }
        instance: { type: string }
        errors:
          type: array
          items: { $ref: "#/components/schemas/FieldError" }
    FieldError:
      type: object
      required: [pointer, detail]
      properties:
        pointer: { type: string, description: JSON Pointer into the request body. }
        detail: { type: string }

    EmailRequest:
      type: object
      required: [email]
      properties:
        email: { $ref: "#/components/schemas/Email" }
    TokenRedemption:
      type: object
      required: [token]
      properties:
        token: { type: string, minLength: 1, maxLength: 256, description: The token from the emailed link. }
    Registration:
      type: object
      required: [email, password]
      properties:
        email: { $ref: "#/components/schemas/Email" }
        password: { type: string, minLength: 12, maxLength: 1024 }
        display_name: { type: string, maxLength: 200 }
    PasswordSignIn:
      type: object
      required: [email, password]
      properties:
        email: { $ref: "#/components/schemas/Email" }
        password: { type: string, minLength: 1, maxLength: 1024 }
        totp_code: { type: string, pattern: "^[0-9]{6}$" }
    PasswordReset:
      type: object
      required: [token, password]
      properties:
        token: { type: string, minLength: 1, maxLength: 256 }
        password: { type: string, minLength: 12, maxLength: 1024 }
    WebAuthnResponse:
      type: object
      description: The `PublicKeyCredential` from the browser, serialized as JSON.
      additionalProperties: true
    PasskeyRegistration:
      type: object
      required: [credential]
      properties:
        name: { type: string, maxLength: 100, description: A label such as "MacBook Touch ID". }
        credential: { $ref: "#/components/schemas/WebAuthnResponse" }
    PasskeyOptions:
      type: object
      required: [options]
      properties:
        options:
          type: object
          description: WebAuthn options to pass to `navigator.credentials`.
          additionalProperties: true
    Passkey:
      type: object
      required: [id, name, created_at]
      properties:
        id: { type: string, description: "The credential ID, base64url." }
        name: { type: string }
        created_at: { $ref: "#/components/schemas/Timestamp" }
        last_used_at:
          $ref: "#/components/schemas/Timestamp"
          description: The last sign-in with it; absent until it signs in.
    PasskeyList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Passkey" }
        next_page_token: { type: string }
    TotpEnrollment:
      type: object
      required: [secret, otpauth_uri]
      properties:
        secret: { type: string, description: "Base32 secret, for manual entry." }
        otpauth_uri: { type: string, description: "`otpauth://` URI, for a QR code." }
    TotpCode:
      type: object
      required: [code]
      properties:
        code: { type: string, pattern: "^[0-9]{6}$" }

    Person:
      type: object
      required: [id, email, email_verified, totp_enabled, individual_tenant_id, created_at]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        email: { $ref: "#/components/schemas/Email" }
        display_name: { type: string }
        email_verified: { type: boolean }
        totp_enabled: { type: boolean }
        individual_tenant_id: { $ref: "#/components/schemas/Id" }
        created_at: { $ref: "#/components/schemas/Timestamp" }
    Session:
      type: object
      required: [person, csrf_token, expires_at]
      properties:
        person: { $ref: "#/components/schemas/Person" }
        csrf_token: { type: string, description: Send as `X-CSRF-Token` on unsafe requests. }
        expires_at: { $ref: "#/components/schemas/Timestamp" }
    Me:
      type: object
      required: [person, memberships, csrf_token]
      properties:
        person: { $ref: "#/components/schemas/Person" }
        csrf_token: { type: string }
        memberships:
          type: array
          items: { $ref: "#/components/schemas/Membership" }
    Membership:
      type: object
      required: [member_id, tenant, roles, locales]
      properties:
        member_id: { $ref: "#/components/schemas/Id" }
        tenant: { $ref: "#/components/schemas/Tenant" }
        roles:
          type: array
          items: { $ref: "#/components/schemas/Role" }
        locales:
          type: array
          items: { $ref: "#/components/schemas/Locale" }

    Tenant:
      type: object
      required: [id, kind, slug, name, created_at]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        kind: { type: string, enum: [individual, organization] }
        slug: { type: string, pattern: "^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$" }
        name: { type: string, minLength: 1, maxLength: 200 }
        created_at: { $ref: "#/components/schemas/Timestamp" }
    TenantList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Tenant" }
        next_page_token: { type: string }
    CreateTenant:
      type: object
      required: [slug, name]
      properties:
        slug: { type: string, pattern: "^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$" }
        name: { type: string, minLength: 1, maxLength: 200 }

    Member:
      type: object
      required: [id, email, status, roles, locales, created_at, updated_at]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        email: { $ref: "#/components/schemas/Email" }
        person_id:
          $ref: "#/components/schemas/Id"
          description: Set once the invitation is accepted.
        display_name: { type: string }
        status: { type: string, enum: [invited, active] }
        roles:
          type: array
          items: { $ref: "#/components/schemas/Role" }
        locales:
          type: array
          description: Locales a translator or reviewer works on; empty means all.
          items: { $ref: "#/components/schemas/Locale" }
        created_at: { $ref: "#/components/schemas/Timestamp" }
        updated_at: { $ref: "#/components/schemas/Timestamp" }
    MemberList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Member" }
        next_page_token: { type: string }
    AddMember:
      type: object
      required: [email, roles]
      properties:
        email: { $ref: "#/components/schemas/Email" }
        roles:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/Role" }
        locales:
          type: array
          maxItems: 200
          items: { $ref: "#/components/schemas/Locale" }
    UpdateMember:
      type: object
      properties:
        roles:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/Role" }
        locales:
          type: array
          maxItems: 200
          items: { $ref: "#/components/schemas/Locale" }

    Token:
      type: object
      required: [id, name, hint, scopes, created_by, created_at]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        name: { type: string }
        hint: { type: string, description: "The first characters of the secret, e.g. `glossa_api_Ab3x`." }
        scopes:
          type: array
          items: { $ref: "#/components/schemas/Scope" }
        created_by: { type: string, description: "`person:<id>` or `token:<id>`." }
        created_at: { $ref: "#/components/schemas/Timestamp" }
        expires_at: { $ref: "#/components/schemas/Timestamp" }
        last_used_at: { $ref: "#/components/schemas/Timestamp" }
        revoked_at: { $ref: "#/components/schemas/Timestamp" }
    TokenList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Token" }
        next_page_token: { type: string }
    CreateToken:
      type: object
      required: [name, scopes]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        scopes:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/Scope" }
        expires_at: { $ref: "#/components/schemas/Timestamp" }
    CreatedToken:
      type: object
      required: [token]
      properties:
        token: { $ref: "#/components/schemas/Token" }
        secret:
          type: string
          description: "The token value (`glossa_api_…`). Shown only in the first response."

    # ── catalog ────────────────────────────────────────────────────────
    Slug:
      type: string
      pattern: "^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$"
    Syntax:
      type: string
      enum: [mf1, mf2]
      description: "Authoring syntax: ICU MessageFormat 1 or Unicode MessageFormat 2."
    ProjectSettings:
      type: object
      required: [default_syntax, review_required]
      properties:
        default_syntax: { $ref: "#/components/schemas/Syntax" }
        review_required:
          type: boolean
          description: |
            New translations wait for review (`needs_review`) unless a
            reviewer approves them as they write. When false, new text is
            `approved` on write.
    Project:
      type: object
      required: [id, slug, name, source_locale, settings, created_at, updated_at]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        slug: { $ref: "#/components/schemas/Slug" }
        name: { type: string }
        source_locale: { $ref: "#/components/schemas/Locale" }
        settings: { $ref: "#/components/schemas/ProjectSettings" }
        created_at: { $ref: "#/components/schemas/Timestamp" }
        updated_at: { $ref: "#/components/schemas/Timestamp" }
    ProjectList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Project" }
        next_page_token: { type: string }
    CreateProject:
      type: object
      required: [slug, name, source_locale]
      properties:
        slug: { $ref: "#/components/schemas/Slug" }
        name: { type: string, minLength: 1, maxLength: 200 }
        source_locale: { $ref: "#/components/schemas/Locale" }
        settings: { $ref: "#/components/schemas/ProjectSettings" }
    UpdateProject:
      type: object
      properties:
        slug: { $ref: "#/components/schemas/Slug" }
        name: { type: string, minLength: 1, maxLength: 200 }
        settings: { $ref: "#/components/schemas/ProjectSettings" }

    Platform:
      type: string
      enum: [web, api, ios, android, other]
    Application:
      type: object
      required: [id, slug, name, platform, created_at, updated_at]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        slug: { $ref: "#/components/schemas/Slug" }
        name: { type: string }
        platform: { $ref: "#/components/schemas/Platform" }
        created_at: { $ref: "#/components/schemas/Timestamp" }
        updated_at: { $ref: "#/components/schemas/Timestamp" }
    ApplicationList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Application" }
        next_page_token: { type: string }
    CreateApplication:
      type: object
      required: [slug, name, platform]
      properties:
        slug: { $ref: "#/components/schemas/Slug" }
        name: { type: string, minLength: 1, maxLength: 200 }
        platform: { $ref: "#/components/schemas/Platform" }
    UpdateApplication:
      type: object
      properties:
        slug: { $ref: "#/components/schemas/Slug" }
        name: { type: string, minLength: 1, maxLength: 200 }
        platform: { $ref: "#/components/schemas/Platform" }

    MessageKey:
      type: string
      description: A dotted path of `[a-z0-9_-]` segments, unique in the project.
      pattern: "^[a-z0-9_-]+(\\.[a-z0-9_-]+)*$"
      minLength: 1
      maxLength: 200
      examples: [checkout.payment.submit]
    Namespace:
      type: string
      description: Groups messages into separately loadable bundles. Default `default`.
      pattern: "^[a-z0-9][a-z0-9_-]{0,63}$"
    MessageState:
      type: string
      enum: [active, obsolete]
    MF2Message:
      type: object
      additionalProperties: true
      description: |
        A message in the Unicode MessageFormat 2 data model, exactly as
        messageformat/testdata/unicode/data-model/message.schema.json
        defines it — the canonical form releases ship.
    Argument:
      type: object
      required: [name, type]
      properties:
        name: { type: string }
        type:
          type: string
          enum: [string, number, integer, percent, currency, date, time, datetime, unit, select]
        function: { type: string, description: "The annotating function, if any." }
        selector:
          type: object
          required: [kind, keys]
          properties:
            kind: { type: string, enum: [plural, ordinal, exact, string] }
            keys:
              type: array
              description: Literal variant keys; the catch-all `*` always exists.
              items: { type: string }
    MarkupElement:
      type: object
      required: [name, kind]
      properties:
        name: { type: string }
        kind: { type: string, enum: [open, standalone, close] }
    MessageContent:
      type: object
      required: [text, syntax, model, arguments, markup]
      properties:
        text: { type: string, description: What the author wrote. }
        syntax: { $ref: "#/components/schemas/Syntax" }
        model: { $ref: "#/components/schemas/MF2Message" }
        arguments:
          type: array
          description: Derived from the model on every change.
          items: { $ref: "#/components/schemas/Argument" }
        markup:
          type: array
          items: { $ref: "#/components/schemas/MarkupElement" }
    Message:
      type: object
      required: [id, key, namespace, description, state, source, source_revision, created_at, updated_at]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        key: { $ref: "#/components/schemas/MessageKey" }
        namespace: { $ref: "#/components/schemas/Namespace" }
        description: { type: string }
        max_length: { type: integer, minimum: 1, description: Rendered length limit that translation QA checks. }
        state: { $ref: "#/components/schemas/MessageState" }
        source: { $ref: "#/components/schemas/MessageContent" }
        source_revision: { type: integer, minimum: 1, description: The current source revision. }
        created_at: { $ref: "#/components/schemas/Timestamp" }
        updated_at: { $ref: "#/components/schemas/Timestamp" }
    MessageList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Message" }
        next_page_token: { type: string }
    CreateMessage:
      type: object
      required: [key, text]
      properties:
        key: { $ref: "#/components/schemas/MessageKey" }
        text: { type: string, maxLength: 20000 }
        syntax: { $ref: "#/components/schemas/Syntax" }
        namespace: { $ref: "#/components/schemas/Namespace" }
        description: { type: string, maxLength: 2000 }
        max_length: { type: integer, minimum: 1, maximum: 100000 }
    UpdateMessage:
      type: object
      properties:
        namespace: { $ref: "#/components/schemas/Namespace" }
        description: { type: string, maxLength: 2000 }
        max_length: { type: integer, minimum: 0, maximum: 100000, description: "`0` removes the limit." }
    ReviseSource:
      type: object
      required: [text]
      properties:
        text: { type: string, maxLength: 20000 }
        syntax: { $ref: "#/components/schemas/Syntax" }
    RenameMessage:
      type: object
      required: [key]
      properties:
        key: { $ref: "#/components/schemas/MessageKey" }
    SourceRevision:
      type: object
      required: [revision, text, syntax, model, author, created_at]
      properties:
        revision: { type: integer, minimum: 1 }
        text: { type: string }
        syntax: { $ref: "#/components/schemas/Syntax" }
        model: { $ref: "#/components/schemas/MF2Message" }
        author: { type: string, description: "`person:<id>` or `token:<id>`." }
        created_at: { $ref: "#/components/schemas/Timestamp" }
    SourceRevisionList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/SourceRevision" }
        next_page_token: { type: string }
    MessagePreviewRequest:
      type: object
      required: [source, locale]
      properties:
        source: { type: string, maxLength: 20000, description: The message as authored. }
        syntax: { $ref: "#/components/schemas/Syntax" }
        locale:
          $ref: "#/components/schemas/Locale"
          description: Decides which plural keys MF1 accepts, and formatting.
        values:
          type: object
          maxProperties: 100
          description: |
            Argument values to format with, by name (without `$`): strings,
            numbers or booleans. Omit to only parse.
          additionalProperties: true
        bidi_isolation:
          type: boolean
          description: Isolate placeholders with Unicode bidi marks (the MF2 default, `true`).
    MessagePreviewError:
      type: object
      required: [stage, code, message]
      properties:
        stage: { type: string, enum: [parse, format] }
        code:
          type: string
          description: "The MessageFormat kernel's stable error code: `mf1-syntax-error`, `syntax-error`, `unresolved-variable`, …"
        message: { type: string, description: For humans; wording may change. }
    MessagePreview:
      type: object
      required: [valid, arguments, markup, errors]
      properties:
        valid: { type: boolean, description: Whether the source parsed into a valid message. }
        message: { $ref: "#/components/schemas/MF2Message" }
        mf2: { type: string, description: The canonical model in MF2 syntax. }
        arguments:
          type: array
          items: { $ref: "#/components/schemas/Argument" }
        markup:
          type: array
          items: { $ref: "#/components/schemas/MarkupElement" }
        formatted: { type: string, description: "The message formatted with `values`, when they were sent and it is valid." }
        errors:
          type: array
          items: { $ref: "#/components/schemas/MessagePreviewError" }
    ItemError:
      type: object
      required: [code, detail]
      properties:
        code: { type: string, pattern: "^[a-z][a-z0-9_]*$", description: Stable machine code. }
        detail: { type: string }
        findings:
          type: array
          items: { $ref: "#/components/schemas/QAFinding" }
    MessageUpsertItem:
      type: object
      required: [key, text]
      properties:
        key: { type: string, maxLength: 256 }
        text: { type: string, maxLength: 20000 }
        syntax: { $ref: "#/components/schemas/Syntax" }
        namespace: { type: string, maxLength: 64, description: "Omitted: keep (new messages: `default`)." }
        description: { type: string, maxLength: 2000, description: "Omitted: keep." }
        max_length: { type: integer, minimum: 1, maximum: 100000, description: "Omitted: keep." }
        base_revision:
          type: integer
          minimum: 0
          description: |
            The source revision the client last saw (0: the message must
            not exist yet). A stale one fails the item with
            `source_revision_conflict` instead of overwriting.
    MessageUpsert:
      type: object
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 500
          items: { $ref: "#/components/schemas/MessageUpsertItem" }
    MessageUpsertItemResult:
      type: object
      required: [key, status]
      properties:
        key: { type: string }
        status: { type: string, enum: [created, revised, updated, unchanged, failed] }
        message: { $ref: "#/components/schemas/Message" }
        error: { $ref: "#/components/schemas/ItemError" }
    MessageUpsertResult:
      type: object
      required: [results]
      properties:
        results:
          type: array
          items: { $ref: "#/components/schemas/MessageUpsertItemResult" }

    # ── localization ───────────────────────────────────────────────────
    Direction:
      type: string
      enum: [ltr, rtl]
      description: Derived from the locale's (likely) script.
    ProjectLocale:
      type: object
      required: [code, direction, is_source, created_at]
      properties:
        code: { $ref: "#/components/schemas/Locale" }
        direction: { $ref: "#/components/schemas/Direction" }
        is_source: { type: boolean }
        created_at: { $ref: "#/components/schemas/Timestamp" }
    LocaleList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/ProjectLocale" }
        next_page_token: { type: string }
    AddLocale:
      type: object
      required: [code]
      properties:
        code: { $ref: "#/components/schemas/Locale" }
    FallbackGraph:
      type: object
      required: [fallback]
      properties:
        fallback:
          type: object
          description: 'A locale (or `*`) to its ordered fallback locales: `{"de-AT": ["de"], "*": ["en"]}`.'
          additionalProperties:
            type: array
            items: { $ref: "#/components/schemas/Locale" }
    PutFallbackGraph:
      type: object
      required: [fallback]
      properties:
        fallback:
          type: object
          maxProperties: 500
          additionalProperties:
            type: array
            maxItems: 50
            items: { $ref: "#/components/schemas/Locale" }
    ReviewState:
      type: string
      enum: [draft, needs_review, approved, rejected]
    Origin:
      type: string
      enum: [human, ai, translation_memory, machine_translation, import, adaptation]
    QAFinding:
      type: object
      required: [code, severity, message]
      properties:
        code: { type: string, description: "Stable finding code, e.g. `missing-argument`, `max-length-exceeded`." }
        severity: { type: string, enum: [error, warning] }
        subject: { type: string, description: The argument or markup element concerned. }
        detail: { type: string }
        message: { type: string, description: For humans; wording may change. }
    QAProblem:
      allOf:
        - $ref: "#/components/schemas/Problem"
        - type: object
          properties:
            findings:
              type: array
              items: { $ref: "#/components/schemas/QAFinding" }
    Translation:
      type: object
      required: [id, message_id, locale, text, syntax, model, state, origin, author, source_revision,
                 current_source_revision, outdated, warnings, revision, created_at, updated_at]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        message_id: { $ref: "#/components/schemas/Id" }
        locale: { $ref: "#/components/schemas/Locale" }
        text: { type: string }
        syntax: { $ref: "#/components/schemas/Syntax" }
        model: { $ref: "#/components/schemas/MF2Message" }
        state: { $ref: "#/components/schemas/ReviewState" }
        origin: { $ref: "#/components/schemas/Origin" }
        author: { type: string, description: Who wrote the current text. }
        source_revision: { type: integer, description: The source revision the text was made against. }
        current_source_revision: { type: integer, description: "The message's current source revision as Localization knows it." }
        outdated: { type: boolean, description: "`source_revision < current_source_revision`." }
        warnings:
          type: array
          items: { $ref: "#/components/schemas/QAFinding" }
        revision: { type: integer, minimum: 1 }
        created_at: { $ref: "#/components/schemas/Timestamp" }
        updated_at: { $ref: "#/components/schemas/Timestamp" }
    TranslationList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Translation" }
        next_page_token: { type: string }
    ProjectTranslation:
      description: A translation with the message it belongs to.
      allOf:
        - $ref: "#/components/schemas/Translation"
        - type: object
          required: [key, namespace, message_state]
          properties:
            key: { $ref: "#/components/schemas/MessageKey" }
            namespace: { $ref: "#/components/schemas/Namespace" }
            message_state: { $ref: "#/components/schemas/MessageState" }
    ProjectTranslationList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/ProjectTranslation" }
        next_page_token: { type: string }
    ReviewStateCounts:
      type: object
      required: [draft, needs_review, approved, rejected]
      properties:
        draft: { type: integer, minimum: 0 }
        needs_review: { type: integer, minimum: 0 }
        approved: { type: integer, minimum: 0 }
        rejected: { type: integer, minimum: 0 }
    LocaleStats:
      type: object
      required: [code, direction, is_source, translated, missing, outdated, states]
      properties:
        code: { $ref: "#/components/schemas/Locale" }
        direction: { $ref: "#/components/schemas/Direction" }
        is_source: { type: boolean }
        translated: { type: integer, minimum: 0, description: Active messages with a usable (not rejected) translation. }
        missing: { type: integer, minimum: 0, description: "Active messages without one: untranslated or rejected." }
        outdated: { type: integer, minimum: 0, description: Usable translations made against an older source revision. }
        states:
          $ref: "#/components/schemas/ReviewStateCounts"
          description: Translations of active messages per review state.
    TranslationStats:
      type: object
      required: [messages, locales]
      properties:
        messages: { type: integer, minimum: 0, description: The project's active messages. }
        locales:
          type: array
          items: { $ref: "#/components/schemas/LocaleStats" }
    PutTranslation:
      type: object
      required: [text]
      properties:
        text: { type: string, maxLength: 20000 }
        syntax: { $ref: "#/components/schemas/Syntax" }
        state: { $ref: "#/components/schemas/ReviewState" }
        origin: { $ref: "#/components/schemas/Origin" }
        origin_detail:
          type: object
          additionalProperties: true
          description: Provenance specifics — model, prompt version, TM match, source job…
        source_revision: { type: integer, minimum: 1 }
    ReviewTranslation:
      type: object
      required: [state]
      properties:
        state: { $ref: "#/components/schemas/ReviewState" }
    TranslationRevision:
      type: object
      required: [revision, kind, text, syntax, state, origin, origin_detail, author, source_revision, findings, created_at]
      properties:
        revision: { type: integer, minimum: 1 }
        kind: { type: string, enum: [content, review] }
        text: { type: string }
        syntax: { $ref: "#/components/schemas/Syntax" }
        state: { $ref: "#/components/schemas/ReviewState" }
        origin: { $ref: "#/components/schemas/Origin" }
        origin_detail: { type: object, additionalProperties: true }
        author: { type: string }
        source_revision: { type: integer }
        findings:
          type: array
          items: { $ref: "#/components/schemas/QAFinding" }
        created_at: { $ref: "#/components/schemas/Timestamp" }
    TranslationRevisionList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/TranslationRevision" }
        next_page_token: { type: string }
    TranslationImportItem:
      type: object
      required: [key, locale, text]
      properties:
        key: { type: string, maxLength: 256 }
        locale: { type: string, maxLength: 64 }
        text: { type: string, maxLength: 20000 }
        syntax: { $ref: "#/components/schemas/Syntax" }
        state: { $ref: "#/components/schemas/ReviewState" }
        origin_detail: { type: object, additionalProperties: true }
        source_revision: { type: integer, minimum: 1 }
    TranslationImport:
      type: object
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 500
          items: { $ref: "#/components/schemas/TranslationImportItem" }
    TranslationImportItemResult:
      type: object
      required: [key, locale]
      properties:
        key: { type: string }
        locale: { type: string }
        status: { type: string, enum: [created, revised, reviewed, unchanged] }
        translation: { $ref: "#/components/schemas/Translation" }
        error: { $ref: "#/components/schemas/ItemError" }
    TranslationImportResult:
      type: object
      required: [results]
      properties:
        results:
          type: array
          items: { $ref: "#/components/schemas/TranslationImportItemResult" }

    EnvironmentPolicy:
      type: object
      required: [states, include_outdated]
      description: |
        Which translations ship to an environment: those in `states`
        (never `rejected`), and outdated ones (made against an older
        source revision) only with `include_outdated`. Production and
        staging start with `approved`, the others with everything.
      properties:
        states:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: string, enum: [draft, needs_review, approved] }
        include_outdated: { type: boolean }
    Environment:
      type: object
      required: [name, policy, created_at, updated_at]
      properties:
        name: { $ref: "#/components/schemas/EnvironmentName" }
        policy: { $ref: "#/components/schemas/EnvironmentPolicy" }
        current_release_id: { $ref: "#/components/schemas/Id" }
        created_at: { $ref: "#/components/schemas/Timestamp" }
        updated_at: { $ref: "#/components/schemas/Timestamp" }
    EnvironmentName:
      type: string
      pattern: "^[a-z0-9][a-z0-9-]{0,62}$"
      description: '`development`, `preview`, `staging`, `production` or a custom name (not `a`).'
    EnvironmentList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Environment" }
        next_page_token: { type: string }
    CreateEnvironment:
      type: object
      required: [name]
      properties:
        name: { $ref: "#/components/schemas/EnvironmentName" }
        policy: { $ref: "#/components/schemas/EnvironmentPolicy" }
    UpdateEnvironment:
      type: object
      required: [policy]
      properties:
        policy: { $ref: "#/components/schemas/EnvironmentPolicy" }
    Promotion:
      type: object
      required: [release_id]
      properties:
        release_id: { $ref: "#/components/schemas/Id" }
    Rollback:
      type: object
      properties:
        release_id: { $ref: "#/components/schemas/Id" }
    Deployment:
      type: object
      required: [number, release_id, action, author, created_at]
      properties:
        number: { type: integer, minimum: 1, description: Counts the environment's deployments from 1. }
        release_id: { $ref: "#/components/schemas/Id" }
        previous_release_id: { $ref: "#/components/schemas/Id" }
        action: { type: string, enum: [publish, promote, rollback] }
        author: { type: string, description: "`person:<id>` or `token:<id>`." }
        created_at: { $ref: "#/components/schemas/Timestamp" }
    DeploymentList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Deployment" }
        next_page_token: { type: string }
    PublishRelease:
      type: object
      required: [environment]
      properties:
        environment: { $ref: "#/components/schemas/EnvironmentName" }
        note: { type: string, maxLength: 1000 }
    ReleaseLocale:
      type: object
      required: [code, direction]
      properties:
        code: { $ref: "#/components/schemas/Locale" }
        direction: { $ref: "#/components/schemas/Direction" }
    ReleaseLocaleCounts:
      type: object
      required: [messages, outdated]
      properties:
        messages: { type: integer, minimum: 0 }
        outdated: { type: integer, minimum: 0, description: Outdated translations shipped (the policy allowed them). }
    ReleaseCounts:
      type: object
      required: [messages, artifacts, bytes, new_artifacts, locales]
      properties:
        messages: { type: integer, minimum: 0, description: Source messages. }
        artifacts: { type: integer, minimum: 0 }
        bytes: { type: integer, minimum: 0 }
        new_artifacts:
          type: integer
          minimum: 0
          description: Artifacts this publish uploaded; the rest were already stored.
        locales:
          type: object
          description: Per locale code.
          additionalProperties: { $ref: "#/components/schemas/ReleaseLocaleCounts" }
    Release:
      type: object
      required: [id, version, environment, policy, manifest_digest, source_locale, locales, counts, author, created_at]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        version: { type: integer, minimum: 1, description: Counts the project's releases from 1. }
        parent_id:
          $ref: "#/components/schemas/Id"
          description: What its environment served before it.
        environment: { $ref: "#/components/schemas/EnvironmentName" }
        policy: { $ref: "#/components/schemas/EnvironmentPolicy" }
        manifest_digest:
          type: string
          pattern: "^[0-9a-f]{64}$"
          description: |
            SHA-256 of the RFC 8785 canonical JSON of what every
            environment's manifest of this release carries (`sourceLocale`,
            `locales`, `fallback`, `artifacts`). Equal digests ship
            exactly the same text.
        source_locale: { $ref: "#/components/schemas/Locale" }
        locales:
          type: array
          items: { $ref: "#/components/schemas/ReleaseLocale" }
        counts: { $ref: "#/components/schemas/ReleaseCounts" }
        note: { type: string }
        author: { type: string, description: "`person:<id>` or `token:<id>`." }
        created_at: { $ref: "#/components/schemas/Timestamp" }
    ReleaseList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Release" }
        next_page_token: { type: string }
    LocaleDiff:
      type: object
      required: [locale, added, changed, removed]
      properties:
        locale: { $ref: "#/components/schemas/Locale" }
        added: { type: array, items: { type: string } }
        changed: { type: array, items: { type: string } }
        removed: { type: array, items: { type: string } }
    ReleaseDiff:
      type: object
      required: [release_id, locales]
      properties:
        release_id: { $ref: "#/components/schemas/Id" }
        base_release_id: { $ref: "#/components/schemas/Id" }
        locales:
          type: array
          items: { $ref: "#/components/schemas/LocaleDiff" }
    ReleaseManifest:
      type: object
      additionalProperties: true
      description: A `glossa.manifest/v1` manifest (runtimes/testdata/schemas/manifest.schema.json), as served.
    ReleaseArtifact:
      type: object
      additionalProperties: true
      description: A `glossa.artifact/v1` artifact (runtimes/testdata/schemas/artifact.schema.json), as stored.
    SigningKey:
      type: object
      required: [key_id, algorithm, public_key, active]
      properties:
        key_id: { type: string, description: "The manifest's `signatures[].keyId`." }
        algorithm: { type: string, enum: [Ed25519] }
        public_key: { type: string, description: "The raw 32-byte public key, base64url without padding." }
        active: { type: boolean, description: Whether it signs new manifests. }
    SigningKeys:
      type: object
      required: [keys]
      properties:
        keys:
          type: array
          items: { $ref: "#/components/schemas/SigningKey" }
    DeliveryKey:
      type: object
      required: [id, name, key, created_by, created_at]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        name: { type: string }
        key:
          type: string
          pattern: "^glossa_pk_[A-Za-z0-9_-]{32}$"
          description: Publishable by design; shown on every read.
        created_by: { type: string, description: "`person:<id>` or `token:<id>`." }
        created_at: { $ref: "#/components/schemas/Timestamp" }
        revoked_at: { $ref: "#/components/schemas/Timestamp" }
    DeliveryKeyList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/DeliveryKey" }
        next_page_token: { type: string }
    CreateDeliveryKey:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 200, description: 'What uses it, e.g. "web" or "go-emails".' }

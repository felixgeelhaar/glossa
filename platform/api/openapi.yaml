        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ── locales ─────────────────────────────────────────────────────────
  /v1/tenants/{tenant}/projects/{project}/locales:
    parameters:
      - $ref: "#/components/parameters/TenantPath"
      - $ref: "#/components/parameters/ProjectPath"
    get:
      operationId: listLocales
      tags: [locales]
      summary: A project's locales, the source locale included
      description: Needs `translations.read`.
      security:
        - session: []
        - bearer: []
      parameters:
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/PageToken"
      responses:
        "200":
          description: A page of locales, by code.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LocaleList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      operationId: addLocale
      tags: [locales]
      summary: Add a locale to a project
      description: |
        The code is canonicalized (`de_de` → `de-DE`); extensions and
        private use are refused. Adding an existing locale returns it
        with `200`. Needs `catalog.write`. Problem codes: `invalid_locale`
        (400).
      x-glossa-idempotency: A locale's identity is its canonical code within the project, so repeating the request returns the same locale.
      security:
        - session: []
          csrf: []
        - bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AddLocale" }
      responses:
        "200":
          description: The locale already existed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectLocale" }
        "201":
          description: The locale.
          headers:
            Location: { $ref: "#/components/headers/Location" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectLocale" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/tenants/{tenant}/projects/{project}/locales/{locale}:
    parameters:
      - $ref: "#/components/parameters/TenantPath"
      - $ref: "#/components/parameters/ProjectPath"
      - $ref: "#/components/parameters/LocalePath"
    get:
      operationId: getLocale
      tags: [locales]
      summary: A locale of a project
      description: "Needs `translations.read`. Problem codes: `locale_not_found` (404)."
      security:
        - session: []
        - bearer: []
      responses:
        "200":
          description: The locale.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectLocale" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: removeLocale
      tags: [locales]
      summary: Remove a locale from a project
      description: |
        Its translations and their history are kept and come back if the
        locale is added again. Needs `catalog.write`. Problem codes:
        `source_locale` (409), `locale_in_fallback` (409, remove it from
        the fallback graph first), `locale_not_found` (404).
      security:
        - session: []
          csrf: []
        - bearer: []
      responses:
        "204": { description: Removed. }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/tenants/{tenant}/projects/{project}/fallback-graph:
    parameters:
      - $ref: "#/components/parameters/TenantPath"
      - $ref: "#/components/parameters/ProjectPath"
    get:
      operationId: getFallbackGraph
      tags: [locales]
      summary: A project's fallback graph
      description: |
        Exactly the `fallback` member releases publish
        (runtimes/SPEC.md §1.1). Empty until set. Needs
        `translations.read`.
      security:
        - session: []
        - bearer: []
      responses:
        "200":
          description: The fallback graph.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FallbackGraph" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      operationId: putFallbackGraph
      tags: [locales]
      summary: Replace a project's fallback graph
      description: |
        Keys are project locales or `*` (every locale without its own
        entry); chains name project locales, in order. Cycles are
        refused. The first write takes no `If-Match`; later ones need the
        current `ETag` (`428` without it). Needs `catalog.write`. Problem
        codes (400): `fallback_unknown_locale`, `fallback_self_reference`,
        `fallback_duplicate`, `fallback_cycle`, `fallback_invalid_locale`.
      security:
        - session: []
          csrf: []
        - bearer: []
      parameters:
        - $ref: "#/components/parameters/IfMatchOptional"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PutFallbackGraph" }
      responses:
        "200":
          description: The fallback graph.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FallbackGraph" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "412": { $ref: "#/components/responses/PreconditionFailed" }
        "428": { $ref: "#/components/responses/PreconditionRequired" }

  # ── translations ────────────────────────────────────────────────────
  /v1/tenants/{tenant}/projects/{project}/messages/{message}/translations:
    parameters:
      - $ref: "#/components/parameters/TenantPath"
      - $ref: "#/components/parameters/ProjectPath"
      - $ref: "#/components/parameters/MessagePath"
    get:
      operationId: listMessageTranslations
      tags: [translations]
      summary: A message's translations, by locale
      description: Needs `translations.read`.
      security:
        - session: []
        - bearer: []
      parameters:
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/PageToken"
      responses:
        "200":
          description: A page of translations.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TranslationList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/tenants/{tenant}/projects/{project}/messages/{message}/translations/{locale}:
    parameters:
      - $ref: "#/components/parameters/TenantPath"
      - $ref: "#/components/parameters/ProjectPath"
      - $ref: "#/components/parameters/MessagePath"
      - $ref: "#/components/parameters/LocalePath"
    get:
      operationId: getTranslation
      tags: [translations]
      summary: A message's translation in a locale
      description: Needs `translations.read`.
      security:
        - session: []
        - bearer: []
        - in_context: []
      responses:
        "200":
          description: The translation.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Translation" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      operationId: putTranslation
      tags: [translations]
      summary: Write a message's translation in a locale
      description: |
        Parses the text for the locale, checks it structurally against
        the source revision it was made from (`source_revision`, default
        the current one) and appends a revision with provenance
        (`origin`, default `human`, and `origin_detail`). Error findings
        reject the write with `422 structural_qa_failed` and the
        `findings`; warnings are stored and returned. New text gets the
        project's review policy (`needs_review` when review is required,
        else `approved`) unless `state` asks otherwise; approving needs
        `translations.review` for the locale. Unchanged text is no new
        revision. Creating takes no `If-Match`; changing needs the
        current `ETag` (`428` without it). Needs `translations.write` for
        the locale. Problem codes: `locale_not_found` (404),
        `source_locale` (409), `invalid_message`, `invalid_state`,
        `invalid_origin`, `invalid_origin_detail`,
        `invalid_source_revision`, `write_cannot_reject` (400),
        `review_forbidden` (403), `translation_conflict` (409).
      security:
        - session: []
          csrf: []
        - bearer: []
        - in_context: []
      parameters:
        - $ref: "#/components/parameters/IfMatchOptional"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PutTranslation" }
      responses:
        "200":
          description: The revised (or unchanged) translation.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Translation" }
        "201":
          description: The new translation.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
            Location: { $ref: "#/components/headers/Location" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Translation" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "412": { $ref: "#/components/responses/PreconditionFailed" }
        "422": { $ref: "#/components/responses/StructuralQAFailed" }
        "428": { $ref: "#/components/responses/PreconditionRequired" }

  /v1/tenants/{tenant}/projects/{project}/messages/{message}/translations/{locale}/revisions:
    parameters:
      - $ref: "#/components/parameters/TenantPath"
      - $ref: "#/components/parameters/ProjectPath"
      - $ref: "#/components/parameters/MessagePath"
      - $ref: "#/components/parameters/LocalePath"
    get:
      operationId: listTranslationRevisions
      tags: [translations]
      summary: A translation's history with provenance, newest first
      description: Needs `translations.read`.
      security:
        - session: []
        - bearer: []
        - in_context: []
      parameters:
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/PageToken"
      responses:
        "200":
          description: A page of revisions.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TranslationRevisionList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/tenants/{tenant}/projects/{project}/messages/{message}/translations/{locale}/reviews:
    parameters:
      - $ref: "#/components/parameters/TenantPath"
      - $ref: "#/components/parameters/ProjectPath"
      - $ref: "#/components/parameters/MessagePath"
      - $ref: "#/components/parameters/LocalePath"
    post:
      operationId: reviewTranslation
      tags: [translations]
      summary: Record a review decision
      description: |
        Moves the translation to `state` and appends a `review` revision
        naming the reviewer; the text and its provenance stay. Approving
        and rejecting need `translations.review` for the locale, other
        states `translations.write`. Problem codes: `review_forbidden`
        (403), `invalid_transition` (409), `invalid_state` (400).
      security:
        - session: []
          csrf: []
        - bearer: []
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReviewTranslation" }
      responses:
        "200":
          description: The reviewed translation.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Translation" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "412": { $ref: "#/components/responses/PreconditionFailed" }
        "428": { $ref: "#/components/responses/PreconditionRequired" }

  /v1/tenants/{tenant}/projects/{project}/translations:
    parameters:
      - $ref: "#/components/parameters/TenantPath"
      - $ref: "#/components/parameters/ProjectPath"
    get:
      operationId: listProjectTranslations
      tags: [translations]
      summary: A project's translations in one or more locales, by key
      description: |
        Every translation in the given locales (`locale`, repeatable, 1
        to 20), across messages, ordered by message key and then locale,
        with the message's `key`, `namespace` and `message_state`, the
        `source_revision` it was made against and the derived `outdated`.
        Filters combine: `state` (repeatable review states), `outdated`,
        `namespace`, `key_prefix` and `message_state`. Locales the
        project no longer has list nothing. Keys and namespaces come
        from Localization's view of the catalog: current when a bulk
        upsert returns, and after other message writes once their events
        are processed (usually within a second). One query per
        page. Needs `translations.read`. Problem codes: `invalid_locale`,
        `too_many_locales`, `invalid_state`, `invalid_message_state`
        (400).
      security:
        - session: []
        - bearer: []
      parameters:
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/PageToken"
        - name: locale
          in: query
          required: true
          description: A locale to list; repeat for several (`locale=de&locale=fr`).
          style: form
          explode: true
          schema:
            type: array
            minItems: 1
            maxItems: 20
            items: { $ref: "#/components/schemas/Locale" }
        - name: state
          in: query
          required: false
          description: Only translations in these review states; repeatable.
          style: form
          explode: true
          schema:
            type: array
            maxItems: 4
            items: { $ref: "#/components/schemas/ReviewState" }
        - name: outdated
          in: query
          required: false
          description: "`true`: only outdated translations; `false`: only current ones."
          schema: { type: boolean }
        - name: namespace
          in: query
          required: false
          schema: { $ref: "#/components/schemas/Namespace" }
        - name: key_prefix
          in: query
          required: false
          description: Keys starting with this, e.g. `checkout.`.
          schema: { type: string, maxLength: 200 }
        - name: message_state
          in: query
          required: false
          description: Only translations of `active` (or `obsolete`) messages.
          schema: { $ref: "#/components/schemas/MessageState" }
      responses:
        "200":
          description: A page of translations.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectTranslationList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/tenants/{tenant}/projects/{project}/translation-stats:
    parameters:
      - $ref: "#/components/parameters/TenantPath"
      - $ref: "#/components/parameters/ProjectPath"
    get:
      operationId: getTranslationStats
      tags: [translations]
      summary: Per-locale status of a project's translations
      description: |
        For every locale of the project (the source included, by code):
        how many of its active messages are translated (a usable — not
        rejected — translation exists), missing (none, or rejected) and
        outdated (usable but made against an older source revision), and
        its translations of active messages per review state. The source
        locale counts every active message as translated and approved.
        Computed in one query on each request, from Localization's view
        of the catalog. Needs `translations.read`.
      security:
        - session: []
        - bearer: []
      responses:
        "200":
          description: The summary.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TranslationStats" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/tenants/{tenant}/projects/{project}/translation-imports:
    parameters:
      - $ref: "#/components/parameters/TenantPath"
      - $ref: "#/components/parameters/ProjectPath"
    post:
      operationId: importTranslations
      tags: [translations]
      summary: Import translations in bulk
      description: |
        Up to 500 translations by message key and locale, written with
        provenance `import` (put the job and source system in
        `origin_detail`) in one transaction. Re-importing unchanged text
        is `unchanged`. Items fail on their own (`results[].error.code`:
        `message_not_found`, `locale_not_found`, `invalid_locale`,
        `forbidden` for a locale outside the caller's scope,
        `source_locale`, `structural_qa_failed` with `findings`,
        `invalid_message`, `review_forbidden`, `duplicate_item`, …)
        without failing the batch. Needs `translations.write` per
        locale. Problem codes: `too_many_items` (400).
      security:
        - session: []
          csrf: []
        - bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TranslationImport" }
      responses:
        "200":
          description: One result per item, in request order.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TranslationImportResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ── environments ────────────────────────────────────────────────────
  /v1/tenants/{tenant}/projects/{project}/environments:
    parameters:
      - $ref: "#/components/parameters/TenantPath"
      - $ref: "#/components/parameters/ProjectPath"
    get:
      operationId: listEnvironments
      tags: [environments]
      summary: Environments of a project
      description: |
        By name. Every project has `development`, `preview`, `staging`
        and `production`; they are created on first use. Needs
        `releases.read`.
      security:
        - session: []
        - bearer: []
      parameters:
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/PageToken"
      responses:
        "200":
          description: A page of environments.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnvironmentList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      operationId: createEnvironment
      tags: [environments]
      summary: Add a custom environment
      description: |
        A QA stage of your own. Without `policy` it ships everything not
        rejected. Branch previews are not created here: they follow
        their branch, and their names (`pr-<n>`, `br-<hash>`) are
        reserved. Needs `releases.publish`. Problem codes:
        `environment_exists`, `too_many_branches` (409),
        `invalid_environment`, `invalid_policy` (400).
      x-glossa-idempotency: The name is the environment's identity; a retry answers 409 environment_exists.
      security:
        - session: []
          csrf: []
        - bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateEnvironment" }
      responses:
        "201":
          description: The environment.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
            Location: { $ref: "#/components/headers/Location" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Environment" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/tenants/{tenant}/projects/{project}/environments/{environment}:
    parameters:
      - $ref: "#/components/parameters/TenantPath"
      - $ref: "#/components/parameters/ProjectPath"
      - $ref: "#/components/parameters/EnvironmentPath"
    get:
      operationId: getEnvironment
      tags: [environments]
      summary: An environment, its policy and the release it serves
      description: Needs `releases.read`.
      security:
        - session: []
        - bearer: []
      responses:
        "200":
          description: The environment.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Environment" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      operationId: updateEnvironment
      tags: [environments]
      summary: Change an environment's eligibility policy
      description: |
        The policy decides what the next publish ships and which
        releases may be promoted here; the release served keeps serving.
        Needs `releases.publish`. Problem codes: `invalid_policy` (400).
      security:
        - session: []
          csrf: []
        - bearer: []
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateEnvironment" }
      responses:
        "200":
          description: The updated environment.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Environment" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "412": { $ref: "#/components/responses/PreconditionFailed" }
        "428": { $ref: "#/components/responses/PreconditionRequired" }

  /v1/tenants/{tenant}/projects/{project}/environments/{environment}/promotions:
    parameters:
      - $ref: "#/components/parameters/TenantPath"
      - $ref: "#/components/parameters/ProjectPath"
      - $ref: "#/components/parameters/EnvironmentPath"
    post:
      operationId: promoteRelease
      tags: [environments]
      summary: Point the environment at an existing release
      description: |
        Moves the pointer; nothing is rebuilt. The environment's policy
        must cover the policy the release was built under, so a
        development or preview release (which ships drafts) can't reach
        production; the default path is to publish to `staging` (approved
        text, like production) and promote that release to `production`.
        `release_ineligible`'s detail names both policies and what
        differs. Promoting the release already served changes nothing,
        so a retry is safe. A branch release is never promoted
        (`branch_release_not_promotable`): it holds text that exists only
        on its branch. Needs `releases.publish`. Problem codes:
        `release_not_found` (404), `release_ineligible`,
        `branch_release_not_promotable` (409), `storage_unavailable`
        (503).
      security:
        - session: []
          csrf: []
        - bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Promotion" }
      responses:
        "200":
          description: The environment, now serving the release.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Environment" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/tenants/{tenant}/projects/{project}/environments/{environment}/release-previews:
    parameters:
      - $ref: "#/components/parameters/TenantPath"
      - $ref: "#/components/parameters/ProjectPath"
      - $ref: "#/components/parameters/EnvironmentPath"
    post:
      operationId: previewRelease
      tags: [releases]
      summary: What publishing to the environment would ship now (dry run)
      description: |
        Runs the build `publishRelease` runs, under the environment's
        policy, and stores nothing: no release, no artifacts, no
        deployment, no events (a default environment the project hasn't
        used yet is shown as it will be created). Returns per-locale
        message counts, the per-locale message IDs added, changed and
        removed compared with the release the environment serves now,
        and `new_artifacts`, what the publish would upload. A catalog
        that can't be released is a `200` with `releasable: false` and
        every `not_releasable` problem found (publishing would fail with
        `422 not_releasable`). The answer is only as current as the
        request: a translation saved in between changes what a publish
        ships. Needs `releases.read`. Problem codes:
        `storage_unavailable` (503).
      security:
        - session: []
          csrf: []
        - bearer: []
      responses:
        "200":
          description: The preview.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReleasePreview" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /v1/tenants/{tenant}/projects/{project}/environments/{environment}/rollbacks:
    parameters:
      - $ref: "#/components/parameters/TenantPath"
      - $ref: "#/components/parameters/ProjectPath"
      - $ref: "#/components/parameters/EnvironmentPath"
    post:
      operationId: rollbackEnvironment
      tags: [environments]
      summary: Point the environment back at a release it served before
      description: |
        Without `release_id`, the newest release the environment served
        that is older than the current one: rolling back twice goes two
        steps back, so send `release_id` when a retry must not. Moves
        the pointer only. Needs `releases.publish`. Problem codes:
        `release_not_found` (404), `no_rollback_target`,
        `not_in_history` (409).
      security:
        - session: []
          csrf: []
        - bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Rollback" }
      responses:
        "200":
          description: The environment, now serving the earlier release.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Environment" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/tenants/{tenant}/projects/{project}/environments/{environment}/deployments:
    parameters:
      - $ref: "#/components/parameters/TenantPath"
      - $ref: "#/components/parameters/ProjectPath"
      - $ref: "#/components/parameters/EnvironmentPath"
    get:
      operationId: listDeployments
      tags: [environments]
      summary: The environment's history of pointer moves
      description: Newest first. Needs `releases.read`.
      security:
        - session: []
        - bearer: []
      parameters:
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/PageToken"
      responses:
        "200":
          description: A page of deployments.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeploymentList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ── releases ────────────────────────────────────────────────────────
  /v1/tenants/{tenant}/projects/{project}/releases:
    parameters:
      - $ref: "#/components/parameters/TenantPath"
      - $ref: "#/components/parameters/ProjectPath"
    get:
      operationId: listReleases
      tags: [releases]
      summary: Releases of a project
      description: Newest first. Needs `releases.read`.
      security:
        - session: []
        - bearer: []
      parameters:
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/PageToken"
      responses:
        "200":
          description: A page of releases.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReleaseList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      operationId: publishRelease
      tags: [releases]
      summary: Publish a release to an environment
      description: |
        Builds one artifact per locale and namespace from the active
        messages and the translations the environment's policy makes
        eligible, stores the ones storage doesn't have yet, records the
        immutable release and points the environment at it; the edge
        serves it within seconds. Publishing an unchanged catalog
        uploads nothing. A branch environment (`kind: branch`) is built
        from the main catalog plus its branch's overlay; it publishes
        itself when the branch changes, so publishing one by hand is
        rarely needed. Needs `releases.publish`. Problem codes:
        `invalid_environment`, `invalid_note` (400), `not_releasable`
        (422), `storage_unavailable` (503).
      security:
        - session: []
          csrf: []
        - bearer: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PublishRelease" }
      responses:
        "201":
          description: The release.
          headers:
            Location: { $ref: "#/components/headers/Location" }
            Idempotent-Replayed: { $ref: "#/components/headers/IdempotentReplayed" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Release" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /v1/tenants/{tenant}/projects/{project}/releases/{release}:
    parameters:
      - $ref: "#/components/parameters/TenantPath"
      - $ref: "#/components/parameters/ProjectPath"
      - $ref: "#/components/parameters/ReleasePath"
    get:
      operationId: getRelease
      tags: [releases]
      summary: A release, its counts and manifest digest
      description: Needs `releases.read`.
      security:
        - session: []
        - bearer: []
      responses:
        "200":
          description: The release.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Release" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/tenants/{tenant}/projects/{project}/releases/{release}/diff:
    parameters:
      - $ref: "#/components/parameters/TenantPath"
      - $ref: "#/components/parameters/ProjectPath"
      - $ref: "#/components/parameters/ReleasePath"
    get:
      operationId: getReleaseDiff
      tags: [releases]
      summary: What changed since another release, per locale
      description: |
        Message IDs added, changed and removed in each locale, compared
        with `base` (default: the release's parent, what its environment
        served before it; without one, everything is added). Needs
        `releases.read`. Problem codes: `release_not_found` (404),
        `storage_unavailable` (503).
      security:
        - session: []
        - bearer: []
      parameters:
        - name: base
          in: query
          required: false
          description: The release `id` to compare with.
          schema: { $ref: "#/components/schemas/Id" }
      responses:
        "200":
          description: The diff.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReleaseDiff" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /v1/tenants/{tenant}/projects/{project}/releases/{release}/manifest:
    parameters:
      - $ref: "#/components/parameters/TenantPath"
      - $ref: "#/components/parameters/ProjectPath"
      - $ref: "#/components/parameters/ReleasePath"
    get:
      operationId: getReleaseManifest
      tags: [releases]
      summary: The signed manifest of a release for an environment
      description: |
        Byte for byte what glossa-edge serves when `environment` serves
        this release (runtimes/SPEC.md §1.1): what `glossa pull
        --release` writes as a bundle's `manifest.json`. Needs
        `releases.read`.
      security:
        - session: []
        - bearer: []
      parameters:
        - name: environment
          in: query
          required: true
          schema: { type: string, pattern: "^[a-z0-9][a-z0-9-]{0,62}$" }
      responses:
        "200":
          description: The manifest (`glossa.manifest/v1`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReleaseManifest" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/tenants/{tenant}/projects/{project}/releases/{release}/artifacts/{digest}:
    parameters:
      - $ref: "#/components/parameters/TenantPath"
      - $ref: "#/components/parameters/ProjectPath"
      - $ref: "#/components/parameters/ReleasePath"
      - name: digest
        in: path
        required: true
        description: The artifact's SHA-256, as the manifest names it.
        schema: { type: string, pattern: "^[0-9a-f]{64}$" }
    get:
      operationId: getReleaseArtifact
      tags: [releases]
      summary: One artifact of a release, as stored
      description: |
        The exact bytes the manifest's `sha256` covers
        (runtimes/SPEC.md §1.2), for bundling
        (`glossa pull --release` writes `a/<sha256>.json`). Needs
        `releases.read`. Problem codes: `storage_unavailable` (503).
      security:
        - session: []
        - bearer: []
      responses:
        "200":
          description: The artifact (`glossa.artifact/v1`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReleaseArtifact" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /v1/tenants/{tenant}/projects/{project}/release-signing-keys:
    parameters:
      - $ref: "#/components/parameters/TenantPath"
      - $ref: "#/components/parameters/ProjectPath"
    get:
      operationId: listReleaseSigningKeys
      tags: [releases]
      summary: The public keys manifests are signed with
      description: |
        Configure runtimes with these (runtimes/SPEC.md §1.3). Active
        keys sign every new manifest; retired ones are still listed
        while runtimes may hold manifests only they signed. Rotation:
        a new key is added (manifests carry both signatures), runtimes
        move to it, the old one is retired. Needs `releases.read`.
      security:
        - session: []
        - bearer: []
      responses:
        "200":
          description: The keys, active first.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SigningKeys" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ── delivery keys ───────────────────────────────────────────────────
  /v1/tenants/{tenant}/projects/{project}/delivery-keys:
    parameters:
      - $ref: "#/components/parameters/TenantPath"
      - $ref: "#/components/parameters/ProjectPath"
    get:
      operationId: listDeliveryKeys
      tags: [delivery-keys]
      summary: Publishable delivery keys, including revoked ones
      description: Needs `releases.read`.
      security:
        - session: []
        - bearer: []
      parameters:
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/PageToken"
      responses:
        "200":
          description: A page of keys.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeliveryKeyList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      operationId: createDeliveryKey
      tags: [delivery-keys]
      summary: Create a publishable delivery key
      description: |
        The key runtimes fetch releases from glossa-edge with
        (`/v1/{key}/{environment}/manifest.json`). It is public by
        design — it ships in browser bundles — scoped to this project,
        read-only, and grants nothing on this API. Needs
        `releases.publish`. Problem codes: `invalid_key_name` (400).
      security:
        - session: []
          csrf: []
        - bearer: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateDeliveryKey" }
      responses:
        "201":
          description: The key.
          headers:
            Location: { $ref: "#/components/headers/Location" }
            Idempotent-Replayed: { $ref: "#/components/headers/IdempotentReplayed" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeliveryKey" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /v1/tenants/{tenant}/projects/{project}/delivery-keys/{delivery_key}/scope:
    parameters:
      - $ref: "#/components/parameters/TenantPath"
      - $ref: "#/components/parameters/ProjectPath"
      - $ref: "#/components/parameters/DeliveryKeyPath"
    put:
      operationId: setDeliveryKeyScope
      tags: [delivery-keys]
      summary: Change what a delivery key may read
      description: |
        Replaces the key's scope: the `environments` it reads and
        whether it reads branch previews. The key itself never changes,
        so a bundle that ships it keeps working; the edge follows within
        its key cache TTL (30 s by default) plus any CDN max-age. A
        revoked key takes no scope. Needs `releases.publish`. Problem
        codes: `invalid_key_scope` (400), `key_revoked` (409).
      security:
        - session: []
          csrf: []
        - bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeliveryKeyScope" }
      responses:
        "200":
          description: The key with its new scope.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeliveryKey" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/tenants/{tenant}/projects/{project}/delivery-keys/{delivery_key}:
    parameters:
      - $ref: "#/components/parameters/TenantPath"
      - $ref: "#/components/parameters/ProjectPath"
      - $ref: "#/components/parameters/DeliveryKeyPath"
    delete:
      operationId: revokeDeliveryKey
      tags: [delivery-keys]
      summary: Revoke a delivery key
      description: |
        The edge answers 404 for it within its key cache TTL (30 s by
        default) plus any CDN max-age. It stays listed as revoked.
        Needs `releases.publish`. Problem codes: `key_revoked` (409).
      security:
        - session: []
          csrf: []
        - bearer: []
      responses:
        "204": { description: Revoked. }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  # ── in-context editing ──────────────────────────────────────────────
  /v1/tenants/{tenant}/projects/{project}/preview-origins:
    parameters:
      - $ref: "#/components/parameters/TenantPath"
      - $ref: "#/components/parameters/ProjectPath"
    get:
      operationId: listPreviewOrigins
      tags: [in-context]
      summary: Where the in-product editor may run
      description: |
        The origins of this project's preview deployments (RFC 0004
        §5.2). The list is short by design and never paged. Needs
        `catalog.read`: the authorize popup has to say where the editor
        may run, so everyone who can see the project can see it.
      security:
        - session: []
        - bearer: []
      x-glossa-unpaged: |
        A project keeps at most 20 preview origins, and the server
        refuses the 21st. A cap is a stronger promise than a cursor, and
        the authorize popup wants the whole list at once.
      responses:
        "200":
          description: The registered origins, in origin order.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PreviewOriginList" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      operationId: registerPreviewOrigin
      tags: [in-context]
      summary: Register a preview origin
      description: |
        Says that the in-product editor may run on a page served from
        `origin`, and that CORS may answer it on the operations the
        overlay uses. Registering one is the decision that a person's
        permissions may be borrowed by a page served from there, so it
        needs `tokens.manage` — credential surface, not content — and
        a project keeps at most 20. `http` is accepted on loopback only,
        for a developer's own run. Problem codes: `invalid_origin` (400),
        `origin_registered`, `too_many_preview_origins` (409).
      security:
        - session: []
          csrf: []
        - bearer: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreatePreviewOrigin" }
      responses:
        "201":
          description: The registration.
          headers:
            Location: { $ref: "#/components/headers/Location" }
            Idempotent-Replayed: { $ref: "#/components/headers/IdempotentReplayed" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PreviewOrigin" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /v1/tenants/{tenant}/projects/{project}/preview-origins/{preview_origin}:
    parameters:
      - $ref: "#/components/parameters/TenantPath"
      - $ref: "#/components/parameters/ProjectPath"
      - $ref: "#/components/parameters/PreviewOriginPath"
    delete:
      operationId: unregisterPreviewOrigin
      tags: [in-context]
      summary: Stop allowing the editor on an origin
      description: |
        Removes the registration and, with it, every in-context grant
        minted for that origin: editor sessions on it end now, not when
        the last 15-minute grant expires. CORS stops answering the
        origin with the same request. Needs `tokens.manage`.
      security:
        - session: []
          csrf: []
        - bearer: []
      responses:
        "204": { description: Unregistered. }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/tenants/{tenant}/projects/{project}/in-context-grants:
    parameters:
      - $ref: "#/components/parameters/TenantPath"
      - $ref: "#/components/parameters/ProjectPath"
    post:
      operationId: createInContextGrant
      tags: [in-context]
      summary: Mint the in-product editor's credential
      description: |
        Called by Studio's `/in-context/authorize` popup, with the
        person's session (RFC 0004 §5.2). It checks that `origin` is a
        registered preview origin of this project and mints a bearer
        token that:

        - acts as the person, so every edit the editor makes names them;
        - allows the person's own permissions intersected with
          `catalog.read`, `knowledge.read`, `translations.read`,
          `translations.write`, `intelligence.read` and
          `intelligence.translate`, locale scopes intact, and never more;
        - is bound to this project and to `origin`: a request from any
          other origin is refused;
        - lives 15 minutes and cannot be refreshed. The overlay keeps it
          in memory and renews it by opening the popup again.

        Only a signed-in person may mint one — an API token doing so
        would launder a tenant credential into a person's — so this
        operation takes no bearer. `token` is returned once and never
        again. Problem codes: `invalid_origin` (400),
        `origin_not_registered` (403), `person_grant_only` (403),
        `no_in_context_permissions` (403).
      security:
        - session: []
          csrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateInContextGrant" }
      x-glossa-idempotency: |
        A grant is a credential with a 15-minute life, like a session:
        replaying a key would hand back a secret a second time, which
        the API never does (see Idempotency in the conventions). Minting
        another one is harmless and is what a retry should do.
      responses:
        "201":
          description: The grant, with its secret shown once.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InContextGrant" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ── translation memory ──────────────────────────────────────────────
  /v1/tenants/{tenant}/tm-lookups:
    parameters:
      - $ref: "#/components/parameters/TenantPath"
    post:
      operationId: lookupTranslationMemory
      tags: [translation-memory]
      summary: Find translation-memory matches for a message
      description: |
        Parses `source` (MF1 by default) and matches its normalized form —
        placeholders by position, markup as tags — against active units
        of the locale pair: exact matches (same text and placeholder
        types) score 100, or 101 when the unit was approved for the same
        `message_key` in the same `namespace` of `project_id`; fuzzy
        matches (trigram similarity) score 50–99. Each target is renamed
        to the query's variable names. By default a lookup sees
        tenant-wide units and `project_id`'s; `all_projects` widens it to
        the tenant. `count_hits` records the lookup in each returned
        unit's `hit_count`. Each match carries its target in MF2
        (`target`) and in the syntax asked for (`target_text`: MF1 by
        default for an MF1 query, falling back to MF2 with
        `target_syntax_fallback` when MF1 can't express it). Needs `knowledge.read`. Problem codes:
        `invalid_query`, `invalid_locale`, `invalid_syntax`,
        `invalid_message`, `message_too_long` (400).
      security:
        - session: []
          csrf: []
        - bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TMLookup" }
      responses:
        "200":
          description: The matches, best first.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TMLookupResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/tenants/{tenant}/tm-concordance:
    parameters:
      - $ref: "#/components/parameters/TenantPath"
    get:
      operationId: searchTranslationMemory
      tags: [translation-memory]
      summary: Find active units containing a phrase
      description: |
        Case-insensitive substring search over the normalized source (or
        target) of active units, closest first — how a translator checks
        how a phrase was translated before. Scope as for lookups. Needs
        `knowledge.read`. Problem codes: `invalid_query`,
        `invalid_locale` (400).
      security:
        - session: []
        - bearer: []
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, minLength: 1, maxLength: 200 } }
        - { name: side, in: query, required: false, schema: { type: string, enum: [source, target], default: source } }
        - { name: source_locale, in: query, required: false, schema: { $ref: "#/components/schemas/Locale" } }
        - { name: target_locale, in: query, required: false, schema: { $ref: "#/components/schemas/Locale" } }
        - { name: project, in: query, required: false, description: A project `id`., schema: { $ref: "#/components/schemas/Id" } }
        - { name: all_projects, in: query, required: false, schema: { type: boolean, default: false } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
      responses:
        "200":
          description: Units containing the phrase.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TMConcordance" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/tenants/{tenant}/tm-units:
    parameters:
      - $ref: "#/components/parameters/TenantPath"
    get:
      operationId: listTranslationMemoryUnits
      tags: [translation-memory]
      summary: Translation-memory units, active or retired
      description: |
        Units are derived from approved translations; retired ones are
        their history. `translation` lists one translation's units.
        Needs `knowledge.read`.
      security:
        - session: []
        - bearer: []
      parameters:
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/PageToken"
        - { name: source_locale, in: query, required: false, schema: { $ref: "#/components/schemas/Locale" } }
        - { name: target_locale, in: query, required: false, schema: { $ref: "#/components/schemas/Locale" } }
        - { name: project, in: query, required: false, description: A project `id`., schema: { $ref: "#/components/schemas/Id" } }
        - { name: translation, in: query, required: false, description: A translation `id`., schema: { $ref: "#/components/schemas/Id" } }
        - { name: state, in: query, required: false, schema: { type: string, enum: [active, retired, all], default: active } }
      responses:
        "200":
          description: A page of units.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TMUnitList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/tenants/{tenant}/tm-units/{unit}:
    parameters:
      - $ref: "#/components/parameters/TenantPath"
      - $ref: "#/components/parameters/TMUnitPath"
    get:
      operationId: getTranslationMemoryUnit
      tags: [translation-memory]
      summary: A translation-memory unit
      description: Needs `knowledge.read`.
      security:
        - session: []
        - bearer: []
      responses:
        "200":
          description: The unit.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TMUnit" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: retireTranslationMemoryUnit
      tags: [translation-memory]
      summary: Retire a unit
      description: |
        Takes the unit out of matching (`retired_reason: deleted`); it
        stays listed as history. Retiring a retired unit changes nothing.
        A later approval of its translation derives a new unit. Needs
        `knowledge.write`.
      security:
        - session: []
          csrf: []
        - bearer: []
      responses:
        "204": { description: Retired. }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ── terminology ─────────────────────────────────────────────────────
  /v1/tenants/{tenant}/term-concepts:
    parameters:
      - $ref: "#/components/parameters/TenantPath"
    get:
      operationId: listTermConcepts
      tags: [terminology]
      summary: Termbase concepts
      description: |
        `project` lists the concepts that apply to it (its own and the
        tenant-wide ones); `q` searches term texts (in `locale`, when
        given) and definitions. Needs `knowledge.read`. Problem codes:
        `invalid_query`, `invalid_locale` (400).
      security:
        - session: []
        - bearer: []
      parameters:
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/PageToken"
        - { name: q, in: query, required: false, schema: { type: string, minLength: 1, maxLength: 200 } }
        - { name: locale, in: query, required: false, schema: { $ref: "#/components/schemas/Locale" } }
        - { name: project, in: query, required: false, description: A project `id`., schema: { $ref: "#/components/schemas/Id" } }
        - { name: domain, in: query, required: false, schema: { type: string, maxLength: 100 } }
      responses:
        "200":
          description: A page of concepts with their terms.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TermConceptList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: createTermConcept
      tags: [terminology]
      summary: Add a concept with its terms
      description: |
        Tenant-wide, or for one project (`project_id`). Needs
        `knowledge.write`. Problem codes: `invalid_concept`,
        `invalid_term`, `invalid_term_status`, `invalid_part_of_speech`,
        `duplicate_term`, `invalid_locale`, `unknown_project` (400).
      security:
        - session: []
          csrf: []
        - bearer: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateTermConcept" }
      responses:
        "201":
          description: The concept.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
            Location: { $ref: "#/components/headers/Location" }
            Idempotent-Replayed: { $ref: "#/components/headers/IdempotentReplayed" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TermConcept" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /v1/tenants/{tenant}/term-concepts/{concept}:
    parameters:
      - $ref: "#/components/parameters/TenantPath"
      - $ref: "#/components/parameters/ConceptPath"
    get:
      operationId: getTermConcept
      tags: [terminology]
      summary: A concept with its terms
      description: Needs `knowledge.read`.
      security:
        - session: []
        - bearer: []
      responses:
        "200":
          description: The concept.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TermConcept" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      operationId: replaceTermConcept
      tags: [terminology]
      summary: Replace a concept and its terms
      description: |
        The body replaces the concept's content and its whole term list
        (terms that stay keep their `id`); its scope never changes.
        Unchanged content is no new version. Needs `knowledge.write`.
        Problem codes as for creating.
      security:
        - session: []
          csrf: []
        - bearer: []
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReplaceTermConcept" }
      responses:
        "200":
          description: The concept.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TermConcept" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "412": { $ref: "#/components/responses/PreconditionFailed" }
        "428": { $ref: "#/components/responses/PreconditionRequired" }
    delete:
      operationId: deleteTermConcept
      tags: [terminology]
      summary: Delete a concept
      description: |
        Its history stays readable, ending in a `deleted` revision.
        `If-Match` is optional; when sent it must match. Needs
        `knowledge.write`.
      security:
        - session: []
          csrf: []
        - bearer: []
      parameters:
        - $ref: "#/components/parameters/IfMatchOptional"
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "412": { $ref: "#/components/responses/PreconditionFailed" }

  /v1/tenants/{tenant}/term-concepts/{concept}/revisions:
    parameters:
      - $ref: "#/components/parameters/TenantPath"
      - $ref: "#/components/parameters/ConceptPath"
    get:
      operationId: listTermConceptRevisions
      tags: [terminology]
      summary: A concept's history, newest first
      description: Full snapshots, also after the concept was deleted. Needs `knowledge.read`.
      security:
        - session: []
        - bearer: []
      parameters:
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/PageToken"
      responses:
        "200":
          description: A page of revisions.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TermConceptRevisionList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/tenants/{tenant}/term-recognitions:
    parameters:
      - $ref: "#/components/parameters/TenantPath"
    post:
      operationId: recognizeTerms
      tags: [terminology]
      summary: Find termbase terms in a text
      description: |
        Word-based and locale-aware: case folded unless a term is
        case-sensitive, short inflectional endings tolerated
        (workspace → workspaces), scripts without spaces (Japanese,
        Chinese, Thai) matched as substrings, overlaps resolved
        leftmost-longest. With `syntax`, `text` is parsed as a message
        and recognition runs over its visible text (placeholders become
        U+FFFC), returned as `analyzed_text`; `start` and `end` are
        Unicode code point offsets into it. `target_locale` adds each
        concept's terms in that locale. Stores nothing. Needs
        `knowledge.read`. Problem codes: `invalid_query`,
        `invalid_locale`, `invalid_syntax`, `invalid_message` (400).
      security:
        - session: []
          csrf: []
        - bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TermRecognitionRequest" }
      responses:
        "200":
          description: The terms found, in text order.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TermRecognition" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/tenants/{tenant}/terminology-checks:
    parameters:
      - $ref: "#/components/parameters/TenantPath"
    post:
      operationId: checkTerminology
      tags: [terminology]
      summary: Check a translation against the termbase
      description: |
        Terminology QA (intent §29.3): `term_missing` (warning) when a
        concept recognized in the source has none of its preferred or
        admitted target terms in the translation; `term_forbidden`
        (error for forbidden, warning for deprecated terms) for every
        forbidden or deprecated target term used. With `syntax`, both
        texts are parsed as messages and checked as visible text. Spans
        are code point offsets into `source_text` or `target_text`.
        Deterministic; stores nothing. Needs `knowledge.read`. Problem
        codes as for recognition.
      security:
        - session: []
          csrf: []
        - bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TerminologyCheckRequest" }
      responses:
        "200":
          description: The findings, source first, by position.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TerminologyCheck" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/tenants/{tenant}/projects/{project}/terminology-findings:
    parameters:
      - $ref: "#/components/parameters/TenantPath"
      - $ref: "#/components/parameters/ProjectPath"
    get:
      operationId: listProjectTerminologyFindings
      tags: [terminology]
      summary: Terminology QA over a project's translations
      description: |
        Runs the checks of `POST …/terminology-checks` server-side over
        a project's translations in the given locales (`locale`,
        repeatable, 1 to 20), each against its message's current source,
        both as visible text, with the project's and the tenant-wide
        concepts — `glossa terms check` and `glossa check
        --terminology`. A page scans up to `page_size` translations of
        active messages in key order and lists those with findings
        (`items`, each with its message key); `checked` counts the
        translations it scanned per locale, so a client sums pages for
        totals. A page can list no items and still have a
        `next_page_token`. Filters: `state` (repeatable; default every
        state but `rejected`), `namespace`, `key_prefix`. Each page is
        one read per context (the termbase, the translations, their
        sources), never one per translation. Stores nothing. Needs
        `knowledge.read`, `translations.read` and `catalog.read`.
        Problem codes: `invalid_locale`, `too_many_locales`,
        `too_many_keys`, `invalid_state` (400).
      security:
        - session: []
        - bearer: []
        - in_context: []
      parameters:
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/PageToken"
        - name: locale
          in: query
          required: true
          description: A target locale to check; repeat for several.
          style: form
          explode: true
          schema:
            type: array
            minItems: 1
            maxItems: 20
            items: { $ref: "#/components/schemas/Locale" }
        - name: state
          in: query
          required: false
          description: Only translations in these review states; repeatable. Default every state but `rejected`.
          style: form
          explode: true
          schema:
            type: array
            maxItems: 4
            items: { $ref: "#/components/schemas/ReviewState" }
        - name: namespace
          in: query
          required: false
          schema: { $ref: "#/components/schemas/Namespace" }
        - name: key_prefix
          in: query
          required: false
          description: Keys starting with this, e.g. `checkout.`.
          schema: { type: string, maxLength: 200 }
        - name: key
          in: query
          required: false
          description: |
            Exactly these message keys; repeatable, at most 50. For
            asking about the messages on one screen — the in-product
            editor asks about one — where `key_prefix` would also match
            everything below the key. Combined with `key_prefix` and
            `namespace` it narrows further.
          style: form
          explode: true
          schema:
            type: array
            maxItems: 50
            items: { $ref: "#/components/schemas/MessageKey" }
      responses:
        "200":
          description: A page of findings.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectTerminologyFindings" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ── style guides ────────────────────────────────────────────────────
  /v1/tenants/{tenant}/style-guides:
    parameters:
      - $ref: "#/components/parameters/TenantPath"
    get:
      operationId: listStyleGuides
      tags: [style-guides]
      summary: Style guides
      description: |
        Every guide, or only tenant-level ones (`tenant_only`), one
        project's, or one locale's. Needs `knowledge.read`.
      security:
        - session: []
        - bearer: []
      parameters:
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/PageToken"
        - { name: project, in: query, required: false, description: A project `id`., schema: { $ref: "#/components/schemas/Id" } }
        - { name: locale, in: query, required: false, schema: { $ref: "#/components/schemas/Locale" } }
        - { name: tenant_only, in: query, required: false, schema: { type: boolean, default: false } }
      responses:
        "200":
          description: A page of guides.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StyleGuideList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: createStyleGuide
      tags: [style-guides]
      summary: Add the style guide for a scope
      description: |
        A scope is any combination of `project_id`, `locale` (which
        covers its descendants: `de` applies to `de-AT`) and `namespace`
        (which needs a project); none is the tenant's guide. Each scope
        has one guide. Needs `knowledge.write`. Problem codes:
        `style_guide_exists` (409), `invalid_style_guide`,
        `invalid_style_rule`, `namespace_needs_project`,
        `invalid_locale`, `unknown_project` (400).
      security:
        - session: []
          csrf: []
        - bearer: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateStyleGuide" }
      responses:
        "201":
          description: The guide.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
            Location: { $ref: "#/components/headers/Location" }
            Idempotent-Replayed: { $ref: "#/components/headers/IdempotentReplayed" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StyleGuide" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /v1/tenants/{tenant}/style-guides/{style_guide}:
    parameters:
      - $ref: "#/components/parameters/TenantPath"
      - $ref: "#/components/parameters/StyleGuidePath"
    get:
      operationId: getStyleGuide
      tags: [style-guides]
      summary: A style guide
      description: Needs `knowledge.read`.
      security:
        - session: []
        - bearer: []
      responses:
        "200":
          description: The guide.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StyleGuide" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      operationId: replaceStyleGuide
      tags: [style-guides]
      summary: Replace a style guide's content
      description: |
        Replaces the name, fields and rules; the scope never changes.
        Unchanged content is no new version. Needs `knowledge.write`.
        Problem codes: `invalid_style_guide`, `invalid_style_rule` (400).
      security:
        - session: []
          csrf: []
        - bearer: []
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReplaceStyleGuide" }
      responses:
        "200":
          description: The guide.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StyleGuide" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "412": { $ref: "#/components/responses/PreconditionFailed" }
        "428": { $ref: "#/components/responses/PreconditionRequired" }
    delete:
      operationId: deleteStyleGuide
      tags: [style-guides]
      summary: Delete a style guide
      description: |
        Its versions stay readable, ending in a `deleted` one. `If-Match`
        is optional; when sent it must match. Needs `knowledge.write`.
      security:
        - session: []
          csrf: []
        - bearer: []
      parameters:
        - $ref: "#/components/parameters/IfMatchOptional"
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "412": { $ref: "#/components/responses/PreconditionFailed" }

  /v1/tenants/{tenant}/style-guides/{style_guide}/versions:
    parameters:
      - $ref: "#/components/parameters/TenantPath"
      - $ref: "#/components/parameters/StyleGuidePath"
    get:
      operationId: listStyleGuideVersions
      tags: [style-guides]
      summary: A style guide's versions, newest first
      description: Full snapshots, also after the guide was deleted. Needs `knowledge.read`.
      security:
        - session: []
        - bearer: []
      parameters:
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/PageToken"
      responses:
        "200":
          description: A page of versions.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StyleGuideVersionList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/tenants/{tenant}/effective-style-guide:
    parameters:
      - $ref: "#/components/parameters/TenantPath"
    get:
      operationId: getEffectiveStyleGuide
      tags: [style-guides]
      summary: The style that applies to a project, locale and namespace
      description: |
        Every applicable guide merged field by field, the narrowest
        winning: a namespace beats a locale, a deeper locale a shallower
        one, a locale a project, a project the tenant. A narrower guide
        replaces a broader rule with the same `id`, or switches it off
        (`disabled`). `sources` names each guide version used, broadest
        first. Without `project`, only tenant-level guides apply; without
        `locale`, no locale guide does. Needs `knowledge.read`. Problem
        codes: `invalid_locale` (400).
      security:
        - session: []
        - bearer: []
      parameters:
        - { name: project, in: query, required: false, description: A project `id`., schema: { $ref: "#/components/schemas/Id" } }
        - { name: locale, in: query, required: false, schema: { $ref: "#/components/schemas/Locale" } }
        - { name: namespace, in: query, required: false, schema: { $ref: "#/components/schemas/Namespace" } }
      responses:
        "200":
          description: The effective style.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EffectiveStyleGuide" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }

  # ── AI configuration ────────────────────────────────────────────────
  /v1/tenants/{tenant}/ai-providers:
    parameters:
      - $ref: "#/components/parameters/TenantPath"
    get:
      operationId: listAIProviders
      tags: [ai-configuration]
      summary: Configured AI providers
      description: |
        The tenant's providers by name — never their API keys
        (`api_key_set` says whether one is stored). Needs
        `intelligence.read`.
      security:
        - session: []
        - bearer: []
      parameters:
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/PageToken"
      responses:
        "200":
          description: A page of providers.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AIProviderList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: createAIProvider
      tags: [ai-configuration]
      summary: Configure an AI provider with the tenant's own key
      description: |
        `name` is what routing policies route to (the default routing
        uses `anthropic`). `api_key` is write-only: it is sealed at rest
        (AES-256-GCM, bound to the tenant and provider) and never
        returned. `base_url` must be https and may not point at private
        or loopback addresses unless the deployment allows it
        (`GLOSSA_AI_ALLOW_PRIVATE_ENDPOINTS`); `models` is an allow-list
        (empty allows any). Needs `intelligence.manage`. Problem codes:
        `invalid_provider` (400), `provider_name_taken` (409).
      security:
        - session: []
          csrf: []
        - bearer: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateAIProvider" }
      responses:
        "201":
          description: The provider.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
            Location: { $ref: "#/components/headers/Location" }
            Idempotent-Replayed: { $ref: "#/components/headers/IdempotentReplayed" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AIProvider" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /v1/tenants/{tenant}/ai-providers/{ai_provider}:
    parameters:
      - $ref: "#/components/parameters/TenantPath"
      - $ref: "#/components/parameters/AIProviderPath"
    get:
      operationId: getAIProvider
      tags: [ai-configuration]
      summary: An AI provider
      description: Never its key. Needs `intelligence.read`.
      security:
        - session: []
        - bearer: []
      responses:
        "200":
          description: The provider.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AIProvider" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      operationId: updateAIProvider
      tags: [ai-configuration]
      summary: Change an AI provider
      description: |
        Absent members keep their value. `api_key` replaces the key,
        `clear_api_key` removes it. Renaming a provider a stored routing
        policy routes to is refused. Needs `intelligence.manage`.
        Problem codes: `invalid_provider` (400), `provider_name_taken`,
        `provider_in_use` (409).
      security:
        - session: []
          csrf: []
        - bearer: []
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateAIProvider" }
      responses:
        "200":
          description: The provider.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AIProvider" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "412": { $ref: "#/components/responses/PreconditionFailed" }
        "428": { $ref: "#/components/responses/PreconditionRequired" }
    delete:
      operationId: deleteAIProvider
      tags: [ai-configuration]
      summary: Remove an AI provider
      description: |
        Refused while a stored routing policy routes to it. Needs
        `intelligence.manage`. Problem code: `provider_in_use` (409).
      security:
        - session: []
          csrf: []
        - bearer: []
      responses:
        "204": { description: Removed. }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/tenants/{tenant}/ai-settings:
    parameters:
      - $ref: "#/components/parameters/TenantPath"
    get:
      operationId: getAISettings
      tags: [ai-configuration]
      summary: The tenant's AI settings
      description: |
        Consent to send text to AI providers (off until someone turns it
        on; who and when is kept), the concurrency cap on running jobs
        and the monthly budget in micro-USD (0 allows no provider calls:
        a hard stop). Defaults until saved, at version 0. Needs
        `intelligence.read`.
      security:
        - session: []
        - bearer: []
      responses:
        "200":
          description: The settings.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AISettings" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
    put:
      operationId: putAISettings
      tags: [ai-configuration]
      summary: Change the tenant's AI settings
      description: |
        Absent members keep their value; `If-Match` applies when sent.
        Needs `intelligence.manage`. Problem code: `invalid_settings`
        (400).
      security:
        - session: []
          csrf: []
        - bearer: []
      parameters:
        - $ref: "#/components/parameters/IfMatchSingleton"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateAISettings" }
      responses:
        "200":
          description: The settings.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AISettings" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "412": { $ref: "#/components/responses/PreconditionFailed" }

  /v1/tenants/{tenant}/ai-prices:
    parameters:
      - $ref: "#/components/parameters/TenantPath"
    get:
      operationId: getAIPrices
      tags: [ai-configuration]
      summary: The AI price table
      description: |
        USD per million tokens by `<provider>/<model>`: the deployment's
        defaults, the tenant's overrides and the effective table budgets
        are charged with (an unpriced model costs 0 and its spend is
        flagged `priced: false`). The ETag is the settings'. Needs
        `intelligence.read`.
      security:
        - session: []
        - bearer: []
      responses:
        "200":
          description: The prices.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AIPrices" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
    put:
      operationId: putAIPrices
      tags: [ai-configuration]
      summary: Replace the tenant's price overrides
      description: |
        Needs `intelligence.manage`. Problem code: `invalid_prices` (400).
      security:
        - session: []
          csrf: []
        - bearer: []
      parameters:
        - $ref: "#/components/parameters/IfMatchSingleton"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PutAIPrices" }
      responses:
        "200":
          description: The prices.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AIPrices" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "412": { $ref: "#/components/responses/PreconditionFailed" }

  /v1/tenants/{tenant}/ai-budget:
    parameters:
      - $ref: "#/components/parameters/TenantPath"
    get:
      operationId: getAIBudget
      tags: [ai-configuration]
      summary: The monthly budget and this month's spend
      description: |
        The cap (set with `ai-settings`), what this calendar month (UTC)
        spent, what remains and the spend per provider and model. A call
        whose upper-bound estimate would pass the cap is refused before
        anything is sent. Needs `intelligence.read`.
      security:
        - session: []
        - bearer: []
      responses:
        "200":
          description: The budget.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AIBudget" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/tenants/{tenant}/ai-spend:
    parameters:
      - $ref: "#/components/parameters/TenantPath"
    get:
      operationId: listAISpend
      tags: [ai-configuration]
      summary: The spend ledger
      description: |
        Every priced provider call since `since` (default: the start of
        this month), newest first. Needs `intelligence.read`.
      security:
        - session: []
        - bearer: []
      parameters:
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/PageToken"
        - { name: since, in: query, required: false, schema: { $ref: "#/components/schemas/Timestamp" } }
      responses:
        "200":
          description: A page of calls.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AISpendList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/tenants/{tenant}/ai-routing-policy:
    parameters:
      - $ref: "#/components/parameters/TenantPath"
    get:
      operationId: getAIRoutingPolicy
      tags: [ai-configuration]
      summary: The tenant's AI routing policy
      description: |
        Which provider and model each task (`translate`, `review`,
        `explain`, `assess`) runs on, per target locale, with ordered
        fallbacks. Without a stored policy the default applies
        (`source: default`: Anthropic Claude Sonnet 5 for translate and
        review, Claude Haiku 4.5 for the self-assessment). Needs
        `intelligence.read`.
      security:
        - session: []
        - bearer: []
      responses:
        "200":
          description: The policy in effect.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AIRoutingPolicyView" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
    put:
      operationId: putAIRoutingPolicy
      tags: [ai-configuration]
      summary: Replace the tenant's AI routing policy
      description: |
        Every route must name a configured provider whose model
        allow-list admits the model. Needs `intelligence.manage`.
        Problem code: `invalid_routing_policy` (400).
      security:
        - session: []
          csrf: []
        - bearer: []
      parameters:
        - $ref: "#/components/parameters/IfMatchSingleton"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AIRoutingPolicy" }
      responses:
        "200":
          description: The policy.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AIRoutingPolicyView" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "412": { $ref: "#/components/responses/PreconditionFailed" }

  /v1/tenants/{tenant}/projects/{project}/ai-routing-policy:
    parameters:
      - $ref: "#/components/parameters/TenantPath"
      - $ref: "#/components/parameters/ProjectPath"
    get:
      operationId: getProjectAIRoutingPolicy
      tags: [ai-configuration]
      summary: The AI routing policy in effect for a project
      description: |
        The project's own (`source: project`), else the tenant's, else
        the default. The `ETag` is the project's own policy's: `"0"`
        while it has none (as the tenant policy's is while the default
        applies). Needs `intelligence.read`.
      security:
        - session: []
        - bearer: []
      responses:
        "200":
          description: The policy in effect.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AIRoutingPolicyView" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      operationId: putProjectAIRoutingPolicy
      tags: [ai-configuration]
      summary: Replace a project's AI routing policy
      description: |
        As the tenant's, for one project. Needs `intelligence.manage`.
        Problem code: `invalid_routing_policy` (400).
      security:
        - session: []
          csrf: []
        - bearer: []
      parameters:
        - $ref: "#/components/parameters/IfMatchSingleton"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AIRoutingPolicy" }
      responses:
        "200":
          description: The policy.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AIRoutingPolicyView" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "412": { $ref: "#/components/responses/PreconditionFailed" }
    delete:
      operationId: deleteProjectAIRoutingPolicy
      tags: [ai-configuration]
      summary: Remove a project's AI routing policy
      description: The tenant's (or the default) applies again. Needs `intelligence.manage`.
      security:
        - session: []
          csrf: []
        - bearer: []
      responses:
        "204": { description: Removed. }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/tenants/{tenant}/projects/{project}/ai-settings:
    parameters:
      - $ref: "#/components/parameters/TenantPath"
      - $ref: "#/components/parameters/ProjectPath"
    get:
      operationId: getProjectAISettings
      tags: [ai-configuration]
      summary: A project's AI settings
      description: |
        Namespace policy tags (`sensitive`: never sent to a provider,
        always translated by people; `legal` and `marketing`: riskier,
        reviewed first), the locales auto-translate is on for (none by
        default) and the review routing of suggestions by confidence.
        Defaults until saved, at version 0. Needs `intelligence.read`.
      security:
        - session: []
        - bearer: []
      responses:
        "200":
          description: The settings.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AIProjectSettings" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      operationId: putProjectAISettings
      tags: [ai-configuration]
      summary: Change a project's AI settings
      description: |
        Absent members keep their value. `review.auto_approve` (off by
        default) is accepted only with `auto_approve_environments` that
        all exist and ship approved translations (Release's eligibility
        policies), and is re-checked for every suggestion: when an
        environment stops shipping approved text, suggestions are routed
        `approve_recommended` instead, with an `action_note`. Needs
        `intelligence.manage`. Problem codes: `invalid_namespace_tags`,
        `invalid_review_policy`, `invalid_locale` (400),
        `auto_approve_ineligible` (422).
      security:
        - session: []
          csrf: []
        - bearer: []
      parameters:
        - $ref: "#/components/parameters/IfMatchSingleton"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateAIProjectSettings" }
      responses:
        "200":
          description: The settings.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AIProjectSettings" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "412": { $ref: "#/components/responses/PreconditionFailed" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  # ── AI jobs ─────────────────────────────────────────────────────────
  /v1/tenants/{tenant}/projects/{project}/ai-fills:
    parameters:
      - $ref: "#/components/parameters/TenantPath"
      - $ref: "#/components/parameters/ProjectPath"
    post:
      operationId: createAIFill
      tags: [ai-jobs]
      summary: Fill locales with AI ("Fill with AI", `glossa translate`)
      description: |
        Queues one job per message whose translation in each locale is
        in the state `select` names — `missing` (none, or rejected; the
        default), `outdated` (made against an older source revision) or
        `missing_or_outdated` — among the listed `keys` or every active
        message, narrowed by `namespace` and `key_prefix`. Clients don't
        need to list keys to fill outdated translations. `include_outdated`
        is the older spelling of `missing_or_outdated`; listed `keys`
        without `select` are filled when missing or outdated. The fill
        records the effective `select`. Messages in `sensitive`
        namespaces are skipped (`skipped.sensitive`), listed keys that
        are current (`skipped.up_to_date`) or in a state the select
        leaves out (`skipped.not_selected`). A job exists once per
        message, locale, source revision and knowledge fingerprint: an
        existing one is reused (`jobs_existing`), a failed, dead or
        cancelled one queued again. `force` (with `keys`) also queues a
        current translation, and queues an existing job again whatever
        its state, so the in-product editor can ask for a second opinion
        on text that is already there. The response's `job_ids` name the
        jobs queued or reused, for a caller following a handful of them.
        `warnings` say when jobs will do
        little: consent off (only exact translation-memory matches are
        reused), no budget, no provider. `POST …/ai-fill-previews`
        answers what a fill would do without queueing anything. Needs
        `intelligence.translate` for every locale. Problem codes:
        `too_many_locales`, `too_many_keys`, `invalid_locale`,
        `invalid_query` (an unknown `select`, one `include_outdated`
        contradicts, or `force` without `keys`) (400),
        `locale_not_found` (404).
      security:
        - session: []
          csrf: []
        - bearer: []
        - in_context: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateAIFill" }
      responses:
        "201":
          description: The fill and its jobs' states.
          headers:
            Location: { $ref: "#/components/headers/Location" }
            Idempotent-Replayed: { $ref: "#/components/headers/IdempotentReplayed" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AIFill" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /v1/tenants/{tenant}/projects/{project}/ai-fill-previews:
    parameters:
      - $ref: "#/components/parameters/TenantPath"
      - $ref: "#/components/parameters/ProjectPath"
    post:
      operationId: previewAIFill
      tags: [ai-jobs]
      summary: What a fill would do, without doing it (`glossa translate --dry-run`)
      description: |
        Takes a fill request and answers, per locale, what `POST
        …/ai-fills` would do with it, writing nothing — no fill, no job,
        no translation-memory hit count, no spend, no event. The same
        checks, selection and limits apply; then each message is decided
        the way its job would be: `existing` jobs (queued, running or
        finished) are reused, `tm_exact` messages have an exact
        translation-memory match that is reused without a provider call
        (when it validates), and the rest either call a provider
        (`provider`, priced in `cost`) or are `refused` —
        `sensitive` (never queued), `provider_consent`, `no_route` (no
        route to an enabled provider allowing the model) or
        `budget_exceeded` (this month's spend plus the calls before it
        leave no room for the call's upper bound). `cost` uses the price
        table in effect: `estimated_micro_usd` expects one draft and one
        self-assessment per message (prompts at about three characters a
        token, a draft twice its source); `max_micro_usd` is the bound
        the budget guard reserves (every repair, each call's whole
        `max_tokens`); `unpriced` flags a model without a price. Needs
        `intelligence.translate` for every locale. Problem codes: those
        of `createAIFill`.
      security:
        - session: []
          csrf: []
        - bearer: []
        - in_context: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateAIFill" }
      responses:
        "200":
          description: What the fill would do.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AIFillPreview" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/tenants/{tenant}/ai-fills/{ai_fill}:
    parameters:
      - $ref: "#/components/parameters/TenantPath"
      - $ref: "#/components/parameters/AIFillPath"
    get:
      operationId: getAIFill
      tags: [ai-jobs]
      summary: A fill and its jobs' states
      description: Needs `intelligence.read`.
      security:
        - session: []
        - bearer: []
      responses:
        "200":
          description: The fill.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AIFill" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/tenants/{tenant}/ai-fills/{ai_fill}/cancellation:
    parameters:
      - $ref: "#/components/parameters/TenantPath"
      - $ref: "#/components/parameters/AIFillPath"
    post:
      operationId: cancelAIFill
      tags: [ai-jobs]
      summary: Cancel a fill's queued jobs
      description: |
        Running jobs finish. Cancelling twice changes nothing. Needs
        `intelligence.translate` for the fill's locales.
      security:
        - session: []
          csrf: []
        - bearer: []
      responses:
        "200":
          description: The fill.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AIFill" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/tenants/{tenant}/ai-jobs:
    parameters:
      - $ref: "#/components/parameters/TenantPath"
    get:
      operationId: listAIJobs
      tags: [ai-jobs]
      summary: AI translation jobs
      description: |
        Newest first. A job is `queued` → `running` → `succeeded`
        (with a suggestion), `skipped` (the message changed, was
        translated meanwhile or is gone), `failed` (for good:
        `failure_code` says why — `provider_consent`, `sensitive`,
        `invalid_output`, `budget_exceeded`, `no_route`,
        `provider_error`, `invalid_source`), `dead` (transient failures
        exhausted its attempts) or `cancelled`. Needs
        `intelligence.read`.
      security:
        - session: []
        - bearer: []
      parameters:
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/PageToken"
        - { name: project, in: query, required: false, description: A project `id`., schema: { $ref: "#/components/schemas/Id" } }
        - { name: state, in: query, required: false, schema: { $ref: "#/components/schemas/AIJobState" } }
        - { name: locale, in: query, required: false, schema: { $ref: "#/components/schemas/Locale" } }
        - { name: fill, in: query, required: false, description: A fill `id`., schema: { $ref: "#/components/schemas/Id" } }
        - { name: message, in: query, required: false, description: A message `id`., schema: { $ref: "#/components/schemas/Id" } }
      responses:
        "200":
          description: A page of jobs.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AIJobList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/tenants/{tenant}/ai-jobs/{ai_job}:
    parameters:
      - $ref: "#/components/parameters/TenantPath"
      - $ref: "#/components/parameters/AIJobPath"
    get:
      operationId: getAIJob
      tags: [ai-jobs]
      summary: A job with its audit ledger
      description: |
        `audit` is the agent's ledger: every tool result in order — what
        it looked up, what it sent and what came back. Needs
        `intelligence.read`.
      security:
        - session: []
        - bearer: []
      responses:
        "200":
          description: The job.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AIJob" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/tenants/{tenant}/ai-jobs/{ai_job}/cancellation:
    parameters:
      - $ref: "#/components/parameters/TenantPath"
      - $ref: "#/components/parameters/AIJobPath"
    post:
      operationId: cancelAIJob
      tags: [ai-jobs]
      summary: Cancel a queued job
      description: |
        Only queued jobs can be cancelled; cancelling a cancelled job
        changes nothing. Needs `intelligence.translate` for its locale.
        Problem code: `job_not_cancellable` (409).
      security:
        - session: []
          csrf: []
        - bearer: []
      responses:
        "200":
          description: The job.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AIJob" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  # ── AI suggestions ──────────────────────────────────────────────────
  /v1/tenants/{tenant}/ai-suggestions:
    parameters:
      - $ref: "#/components/parameters/TenantPath"
    get:
      operationId: listAISuggestions
      tags: [ai-suggestions]
      summary: AI suggestions
      description: |
        Newest first, each with its message's current `source` (read in
        one catalog query per page). Needs `intelligence.read` and
        `catalog.read`.
      security:
        - session: []
        - bearer: []
        - in_context: []
      parameters:
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/PageToken"
        - { name: project, in: query, required: false, description: A project `id`., schema: { $ref: "#/components/schemas/Id" } }
        - { name: status, in: query, required: false, schema: { $ref: "#/components/schemas/AISuggestionStatus" } }
        - { name: locale, in: query, required: false, schema: { $ref: "#/components/schemas/Locale" } }
        - { name: message, in: query, required: false, description: A message `id`., schema: { $ref: "#/components/schemas/Id" } }
        - { name: job, in: query, required: false, description: A job `id`., schema: { $ref: "#/components/schemas/Id" } }
      responses:
        "200":
          description: A page of suggestions.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AISuggestionList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/tenants/{tenant}/ai-suggestions/{ai_suggestion}:
    parameters:
      - $ref: "#/components/parameters/TenantPath"
      - $ref: "#/components/parameters/AISuggestionPath"
    get:
      operationId: getAISuggestion
      tags: [ai-suggestions]
      summary: An AI suggestion with its confidence explanation
      description: |
        `score` (0–1) prioritizes review; it is never a promise of
        correctness. `explanation` lists each factor and its
        contribution ("why this?"); `provenance` names the provider,
        model, prompt version, translation-memory units, terms and
        style-guide version; `source` is the message as it is now. Needs
        `intelligence.read` and `catalog.read`.
      security:
        - session: []
        - bearer: []
      responses:
        "200":
          description: The suggestion.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AISuggestion" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/tenants/{tenant}/ai-suggestions/{ai_suggestion}/acceptance:
    parameters:
      - $ref: "#/components/parameters/TenantPath"
      - $ref: "#/components/parameters/AISuggestionPath"
    post:
      operationId: acceptAISuggestion
      tags: [ai-suggestions]
      summary: Accept a suggestion, as is or edited
      description: |
        Writes the message's translation: a revision with origin `ai`
        or `translation_memory` and an `origin_detail` naming provider,
        model, prompt version, TM units, terms, style version, score and
        explanation. It is `approved` when the caller may review the
        locale, else what the project's review policy says. With `text`
        (MF2 by default) the edit is accepted instead and its structured
        diff (edit distance, terms and style fields changed) recorded for
        the metrics. Needs `intelligence.translate` and
        `translations.write` for the locale. Problem codes:
        `suggestion_decided`, `suggestion_outdated`,
        `translation_conflict` (409), `translation_rejected` (422),
        `invalid_message`, `invalid_syntax` (400).
      security:
        - session: []
          csrf: []
        - bearer: []
        - in_context: []
      parameters:
        - $ref: "#/components/parameters/IfMatchOptional"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AcceptAISuggestion" }
      responses:
        "200":
          description: The accepted suggestion.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AISuggestion" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "412": { $ref: "#/components/responses/PreconditionFailed" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /v1/tenants/{tenant}/ai-suggestions/{ai_suggestion}/rejection:
    parameters:
      - $ref: "#/components/parameters/TenantPath"
      - $ref: "#/components/parameters/AISuggestionPath"
    post:
      operationId: rejectAISuggestion
      tags: [ai-suggestions]
      summary: Reject a suggestion
      description: |
        Nothing is written. Needs `intelligence.translate` for the
        locale. Problem codes: `suggestion_decided` (409),
        `invalid_reason` (400).
      security:
        - session: []
          csrf: []
        - bearer: []
      parameters:
        - $ref: "#/components/parameters/IfMatchOptional"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RejectAISuggestion" }
      responses:
        "200":
          description: The rejected suggestion.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AISuggestion" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "412": { $ref: "#/components/responses/PreconditionFailed" }

  /v1/tenants/{tenant}/projects/{project}/ai-review-queue:
    parameters:
      - $ref: "#/components/parameters/TenantPath"
      - $ref: "#/components/parameters/ProjectPath"
    get:
      operationId: getAIReviewQueue
      tags: [ai-suggestions]
      summary: The review queue, riskiest first
      description: |
        Pending suggestions ordered by risk, not by key: lowest score
        first, then the most `risk_tags` (legal and marketing
        namespaces, forbidden terms, max length, missing plural
        categories). `locale` (repeatable) narrows it. Each item carries
        its message's current `source` (key, namespace, authored text,
        canonical MF2, revision), read in one catalog query per page, so
        a reviewer needs no request per item. Needs `intelligence.read`
        and `catalog.read`.
      security:
        - session: []
        - bearer: []
      parameters:
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/PageToken"
        - name: locale
          in: query
          required: false
          style: form
          explode: true
          schema:
            type: array
            maxItems: 20
            items: { $ref: "#/components/schemas/Locale" }
      responses:
        "200":
          description: A page of the queue.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AISuggestionList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ── AI insights ─────────────────────────────────────────────────────
  /v1/tenants/{tenant}/ai-disclosures:
    parameters:
      - $ref: "#/components/parameters/TenantPath"
    get:
      operationId: listAIDisclosures
      tags: [ai-insights]
      summary: Which provider saw which message
      description: |
        Every provider call a job made, even a failed one, with exactly
        what the provider was sent (RFC 0003 §7), newest first. Needs
        `intelligence.read`.
      security:
        - session: []
        - bearer: []
      parameters:
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/PageToken"
        - { name: job, in: query, required: false, description: A job `id`., schema: { $ref: "#/components/schemas/Id" } }
        - { name: message, in: query, required: false, description: A message `id`., schema: { $ref: "#/components/schemas/Id" } }
        - { name: project, in: query, required: false, description: A project `id`., schema: { $ref: "#/components/schemas/Id" } }
        - { name: provider, in: query, required: false, schema: { type: string, maxLength: 63 } }
      responses:
        "200":
          description: A page of disclosures.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AIDisclosureList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/tenants/{tenant}/projects/{project}/ai-metrics:
    parameters:
      - $ref: "#/components/parameters/TenantPath"
      - $ref: "#/components/parameters/ProjectPath"
    get:
      operationId: getAIMetrics
      tags: [ai-insights]
      summary: Acceptance rate and edit distance per locale
      description: |
        People's decisions on the project's suggestions since `since`
        (default: 30 days ago), per locale: accepted (as is or edited),
        rejected, the acceptance rate and the mean edit distance of
        accepted suggestions (0 for those accepted as is). Needs
        `intelligence.read`.
      security:
        - session: []
        - bearer: []
      parameters:
        - { name: since, in: query, required: false, schema: { $ref: "#/components/schemas/Timestamp" } }
      responses:
        "200":
          description: The metrics.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AIMetrics" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/tenants/{tenant}/ai-eval-baseline:
    parameters:
      - $ref: "#/components/parameters/TenantPath"
    get:
      operationId: getAIEvalBaseline
      tags: [ai-insights]
      summary: The translation agent's eval baseline
      description: |
        The tracked metrics of the golden-set evals per locale pair and
        overall (`all`), as committed with the server
        (`internal/intelligence/evals/testdata/baseline.json`): a prompt
        or model change may not regress them (RFC 0003 §4). Needs
        `intelligence.read`.
      security:
        - session: []
        - bearer: []
      responses:
        "200":
          description: The baseline.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AIEvalBaseline" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }

  # ── imports ─────────────────────────────────────────────────────────
  /v1/tenants/{tenant}/import-jobs:
    parameters:
      - $ref: "#/components/parameters/TenantPath"
    post:
      operationId: createImportJob
      tags: [imports]
      summary: Create an import job (then upload its file)
      description: |
        Creates a job in `awaiting_upload`; `PUT` the file to its
        `upload_url` next (within 24 hours). Catalog formats (`xliff`,
        `json`, `po`) belong to a project; `tmx` and `tbx` import into
        a project, or tenant-wide without `project_id`.

        **Modes.** `merge` (default) creates what is missing and updates
        what changed, but never replaces an approved translation, a
        message's source that differs from the file's, or a concept that
        differs: those are `conflict` results (and a translation of a
        message whose source differs is one too — it was made for other
        text). `overwrite` makes the stored state the file's (needs
        `integration.manage`). `dry_run` runs every check of a merge and
        reports its results without changing anything.

        **Review states.** A file's states (XLIFF `final` → approved,
        `translated` → needs_review, `initial` → draft; PO fuzzy →
        needs_review; JSON: `options.state`, default needs_review) are
        kept only as far as the requester may decide them: an approval
        (or rejection) needs `translations.review` for the locale, or —
        approvals — a project that doesn't require review; otherwise
        the translation waits for review. Translations are written with
        provenance `import` and `origin_detail` `{job, file, format,
        requested_by}`.

        **Keys.** XLIFF units and JSON keys are message keys. gettext
        keys messages by text: a PO entry's key is
        `[<msgctxt slug>.]<msgid slug>_<hash>` — the text folded to
        lowercase ASCII words joined by `_` (at most 40 characters) and
        the first 8 hex digits of SHA-256 over msgctxt, U+0004 and msgid
        (`Add to cart` → `add_to_cart_…`), so the same entry always
        gets the same key.

        **Permissions.** Catalog formats need `integration.import`
        (translations of the locales in the requester's scope — a
        translator's) or `integration.manage` (also creating and
        revising messages; a JSON file in the source locale is a source
        catalog and needs it). TMX, TBX and `overwrite` need
        `integration.manage` (and `knowledge.write` for TMX and TBX).
        What the requester may do is recorded with the job and applied
        when it runs. A tenant-wide memory or termbase has its own
        routes, `tm-import-jobs` and `termbase-import-jobs`. Problem
        codes: `invalid_format`, `invalid_mode`, `invalid_options`,
        `project_required` (400), `locale_not_found` (404:
        `options.locale` isn't one of the project's locales).
      security:
        - session: []
          csrf: []
        - bearer: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ImportJobRequest" }
      responses:
        "201":
          description: The job, waiting for its file.
          headers:
            Location: { $ref: "#/components/headers/Location" }
            Idempotent-Replayed: { $ref: "#/components/headers/IdempotentReplayed" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportJob" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
    get:
      operationId: listImportJobs
      tags: [imports]
      summary: Import jobs
      description: Newest first. Needs `integration.read`.
      security:
        - session: []
        - bearer: []
      parameters:
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/PageToken"
        - { name: project, in: query, required: false, description: A project `id`., schema: { $ref: "#/components/schemas/Id" } }
        - { name: state, in: query, required: false, schema: { $ref: "#/components/schemas/IntegrationJobState" } }
      responses:
        "200":
          description: A page of import jobs.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportJobList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/tenants/{tenant}/import-jobs/{import_job}:
    parameters:
      - $ref: "#/components/parameters/TenantPath"
      - $ref: "#/components/parameters/ImportJobPath"
    get:
      operationId: getImportJob
      tags: [imports]
      summary: An import job with its progress and counts
      description: |
        `processed_items` of `total_items` (entries, units or concepts
        of the file; 0 until known — a TMX file streams) and `summary`,
        the results so far by status and kind. A job ends `succeeded`,
        `failed` (`failure_code`: `invalid_file`, `unsupported_file`,
        `file_too_large` — the problem's line and column are its last
        result —, `source_locale_mismatch`, `target_locale_mismatch` —
        the file's translations are in a locale the project doesn't
        have; import it as one of the project's with `options.locale`
        —, `project_not_found`, `upload_expired`, `internal`) or
        `cancelled`. An import of a
        file this tenant already imported with the same options
        succeeds at once with that job's result (`reused_job_id`);
        dry runs are always run. Needs `integration.read`.
      security:
        - session: []
        - bearer: []
      responses:
        "200":
          description: The job.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportJob" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/tenants/{tenant}/import-jobs/{import_job}/file:
    parameters:
      - $ref: "#/components/parameters/TenantPath"
      - $ref: "#/components/parameters/ImportJobPath"
    put:
      operationId: uploadImportFile
      tags: [imports]
      summary: Upload an import job's file
      description: |
        The raw file (any `Content-Type`; the job's `format` says how it
        is read), streamed to object storage — once, by the job's
        requester, while it is `awaiting_upload`. The job is `queued`,
        or `succeeded` at once when it reuses an earlier result. Problem
        codes: `empty_file`, `upload_interrupted` (400: the body broke
        off), `upload_not_expected` (409), `file_too_large` (413; the
        limit is the deployment's `GLOSSA_INTEGRATION_MAX_UPLOAD_BYTES`,
        64 MiB by default), `storage_unavailable` (503).
      security:
        - session: []
          csrf: []
        - bearer: []
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        "200":
          description: The job, queued.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportJob" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /v1/tenants/{tenant}/import-jobs/{import_job}/cancellation:
    parameters:
      - $ref: "#/components/parameters/TenantPath"
      - $ref: "#/components/parameters/ImportJobPath"
    post:
      operationId: cancelImportJob
      tags: [imports]
      summary: Cancel an import job
      description: |
        A job waiting for its file or queued is cancelled at once; a
        running one stops after its current batch of 500
        (`cancel_requested`), and what it already applied stays
        applied. Cancelling a cancelled job changes nothing. The
        requester, or someone with `integration.manage`, may cancel.
        Problem code: `job_not_cancellable` (409: it has finished).
      security:
        - session: []
          csrf: []
        - bearer: []
      responses:
        "200":
          description: The job.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportJob" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/tenants/{tenant}/import-jobs/{import_job}/results:
    parameters:
      - $ref: "#/components/parameters/TenantPath"
      - $ref: "#/components/parameters/ImportJobPath"
    get:
      operationId: listImportResults
      tags: [imports]
      summary: An import job's per-item results
      description: |
        In file order: each message, then its translations; TM units;
        concepts. `status` is `created`, `updated`, `unchanged`,
        `conflict` (stored data differs and the mode keeps it: `code`
        `approved_translation_conflict`, `source_differs`,
        `concept_differs`) or `invalid` (`code` says why:
        `forbidden`, `message_not_found`, `invalid_message_key`,
        `structural_qa_failed`, `invalid_file`, …). Every result of a
        file carries where it is — `line`, `column` and `ref`, the
        item in the format's own terms — so each conflict can be found
        in the file. A dry run's results are what a merge would do.
        Needs `integration.read`.
      security:
        - session: []
        - bearer: []
      parameters:
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/PageToken"
        - { name: status, in: query, required: false, schema: { $ref: "#/components/schemas/ImportResultStatus" } }
        - { name: kind, in: query, required: false, schema: { $ref: "#/components/schemas/ImportResultKind" } }
      responses:
        "200":
          description: A page of results.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportResultList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ── exports ─────────────────────────────────────────────────────────
  /v1/tenants/{tenant}/export-jobs:
    parameters:
      - $ref: "#/components/parameters/TenantPath"
    post:
      operationId: createExportJob
      tags: [exports]
      summary: Export a catalog, translation memory or termbase
      description: |
        Queues the export; download its file when it has `succeeded`.
        Catalogs (`xliff`, `json`) belong to a project and write one
        file per locale in `options.locales` — several are zipped as
        `<locale>.<ext>` —, the project's active messages (in
        `options.namespaces`) with their translations in
        `options.states` (default `approved`). An XLIFF export without
        locales carries the source only; a JSON export defaults to the
        source locale and matches what `glossa pull` writes (sorted
        keys, two-space indent; `layout` flat or nested; `syntax` mf1 or
        mf2). `tmx` and `tbx` export a project's own memory or termbase,
        or without `project_id` everything the tenant holds (the
        workspace's own routes, `tm-export-jobs` and
        `termbase-export-jobs`, say so explicitly); `tmx`
        narrows by `source_locale` and target `locales`. Needs
        `integration.read` and `catalog.read` with
        `translations.read` (catalogs) or `knowledge.read`. Problem
        codes: `invalid_format` (400; `po` is import only),
        `invalid_options`, `project_required` (400),
        `locale_not_found` (404).
      security:
        - session: []
          csrf: []
        - bearer: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExportJobRequest" }
      responses:
        "201":
          description: The job, queued.
          headers:
            Location: { $ref: "#/components/headers/Location" }
            Idempotent-Replayed: { $ref: "#/components/headers/IdempotentReplayed" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExportJob" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
    get:
      operationId: listExportJobs
      tags: [exports]
      summary: Export jobs
      description: Newest first. Needs `integration.read`.
      security:
        - session: []
        - bearer: []
      parameters:
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/PageToken"
        - { name: project, in: query, required: false, description: A project `id`., schema: { $ref: "#/components/schemas/Id" } }
        - { name: state, in: query, required: false, schema: { $ref: "#/components/schemas/IntegrationJobState" } }
      responses:
        "200":
          description: A page of export jobs.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExportJobList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/tenants/{tenant}/export-jobs/{export_job}:
    parameters:
      - $ref: "#/components/parameters/TenantPath"
      - $ref: "#/components/parameters/ExportJobPath"
    get:
      operationId: getExportJob
      tags: [exports]
      summary: An export job
      description: |
        A job ends `succeeded` (with `file` and `download_url`),
        `failed` (`failure_code`: `not_representable` — the format can't
        express the catalog with these options, such as MF2-only
        messages in an MF1 JSON file or an XLIFF file without messages
        —, `project_not_found`, `internal`) or `cancelled`. Needs
        `integration.read`.
      security:
        - session: []
        - bearer: []
      responses:
        "200":
          description: The job.
          content:
            application/json:
